<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quiz (refactored)</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    button { display: block; margin: 8px 0; padding: 8px 16px; }
    .correct { color: #2a2; } .wrong { color: #c33; }
  </style>
</head>
<body>
  <h1>JS Quiz</h1>
  <div id="quiz"></div>

  <script>
    // ============ CONTENT: questions are DATA ====================
    // Adding question 4 = adding an object. Shuffling = shuffling an
    // array. A quiz about geography = swap this array out. Content
    // has been separated from mechanism.
    const QUESTIONS = [
      {
        prompt: 'What does === check?',
        choices: ['value AND type', 'just value'],
        answerIndex: 0,
      },
      {
        prompt: 'What is [1,2] + [3]?',
        choices: ["[1,2,3]", "the string '1,23'", 'an error'],
        answerIndex: 1,
      },
      {
        prompt: 'Which is NOT falsy?',
        choices: ['0', "'0'", "''"],
        answerIndex: 1,
      },
      {
        prompt: 'Maps beat plain objects as dictionaries because...',
        choices: [
          'they are faster, always',
          'no inherited keys like __proto__',
          'they serialize to JSON',
        ],
        answerIndex: 1,
      },
    ];

    // ============ STATE + phases (project 15's state machine) ====
    let state = newQuiz();

    function newQuiz() {
      return {
        index: 0,
        score: 0,
        phase: 'asking',   // 'asking' | 'feedback' | 'done'
        lastPick: null,
      };
    }

    // ============ ACTIONS ========================================
    function pickAnswer(choiceIndex) {
      if (state.phase !== 'asking') return;
      state.lastPick = choiceIndex;
      if (choiceIndex === QUESTIONS[state.index].answerIndex) state.score++;
      state.phase = 'feedback';
      render();
    }

    function nextQuestion() {
      state.index++;
      state.lastPick = null;
      state.phase = state.index < QUESTIONS.length ? 'asking' : 'done';
      render();
    }

    function restart() {
      state = newQuiz();
      render();
    }

    // ============ RENDER: one function, all phases ===============
    function render() {
      const root = document.getElementById('quiz');
      root.innerHTML = '';

      if (state.phase === 'done') {
        addText(root, 'p', `Done! Score: ${state.score}/${QUESTIONS.length}`);
        addButton(root, 'Play again', restart);
        return;
      }

      const question = QUESTIONS[state.index];
      addText(root, 'p', `${state.index + 1}. ${question.prompt}`);

      question.choices.forEach((choice, i) => {
        const button = addButton(root, choice, () => pickAnswer(i));
        if (state.phase === 'feedback') {
          button.disabled = true;
          if (i === question.answerIndex) button.className = 'correct';
          else if (i === state.lastPick) button.className = 'wrong';
        }
      });

      if (state.phase === 'feedback') {
        const wasRight = state.lastPick === question.answerIndex;
        addText(root, 'p', wasRight ? 'Correct!' : 'Not quite.');
        addButton(root, state.index + 1 < QUESTIONS.length ? 'Next' : 'Finish', nextQuestion);
      }
    }

    // createElement + textContent, never innerHTML with data:
    // question text can contain < > ' " safely (project 35's lesson).
    function addText(parent, tag, text) {
      const el = document.createElement(tag);
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function addButton(parent, label, onClick) {
      const button = addText(parent, 'button', label);
      button.onclick = onClick;
      return button;
    }

    render();
  </script>
</body>
</html>

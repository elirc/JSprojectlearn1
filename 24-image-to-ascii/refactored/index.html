<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image to ASCII (refactored)</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    pre { font: 7px/7px monospace; }
    label { margin-right: 16px; }
  </style>
</head>
<body>
  <h1>Image to ASCII</h1>
  <p>
    <input type="file" id="file" accept="image/*">
    <label>Width: <input type="number" id="width" value="100" min="20" max="300"></label>
    <label>Ramp: <select id="ramp">
      <option value=" .:-=+*#%@">standard (10 levels)</option>
      <option value=" .oO@">chunky (5 levels)</option>
      <option value=" .'`^&quot;,:;Il!i~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&amp;8%B@$">fine (70 levels)</option>
    </select></label>
  </p>
  <pre id="out"></pre>

  <script>
    // ============ THE PIPELINE (pure, reusable) ==================
    //   image -> sampleGrid -> brightness[][] -> asciify -> string
    // The brightness grid in the middle is the interface: the left
    // half doesn't know about characters, the right half doesn't
    // know about canvases. Feed it a webcam frame, get ASCII video.
    // =============================================================

    /**
     * Downscale the image and return a 2D array of brightness 0-1.
     * `rows` is halved relative to aspect because terminal characters
     * are roughly twice as tall as they are wide.
     */
    function sampleGrid(img, columns) {
      const rows = Math.max(1, Math.round(columns * (img.height / img.width) * 0.5));
      const canvas = document.createElement('canvas');
      canvas.width = columns;
      canvas.height = rows;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, columns, rows); // the browser does the averaging
      const { data } = ctx.getImageData(0, 0, columns, rows);

      const grid = [];
      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < columns; x++) {
          const i = (y * columns + x) * 4;
          row.push(luminance(data[i], data[i + 1], data[i + 2]));
        }
        grid.push(row);
      }
      return grid;
    }

    /**
     * Perceived brightness 0-1. The eye is most sensitive to green,
     * least to blue — these are the standard Rec. 601 weights. (The
     * original's flat average made green areas render too dark.)
     */
    function luminance(r, g, b) {
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    /**
     * Map a brightness grid to characters. The ramp is a PARAMETER —
     * a string ordered light to dark, any length. No thresholds to
     * recompute: brightness scales into the ramp by arithmetic.
     */
    function asciify(grid, ramp) {
      const toChar = (brightness) => {
        const index = Math.min(
          ramp.length - 1,
          Math.floor((1 - brightness) * ramp.length),
        );
        return ramp[index];
      };
      return grid.map((row) => row.map(toChar).join('')).join('\n');
    }

    // ============ FILE LOADING (promisified) =====================
    /** Wrap the two callback layers into one awaitable step. */
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(img.src); resolve(img); };
        img.onerror = () => reject(new Error(`Could not load ${file.name}`));
        img.src = URL.createObjectURL(file);
      });
    }

    // ============ WIRING =========================================
    const fileInput = document.getElementById('file');
    const widthInput = document.getElementById('width');
    const rampSelect = document.getElementById('ramp');

    let currentImage = null;

    async function update() {
      if (!currentImage) return;
      const grid = sampleGrid(currentImage, Number(widthInput.value));
      document.getElementById('out').textContent =
        asciify(grid, rampSelect.value);
    }

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      currentImage = await loadImage(file); // straight-line async, no pyramid
      update();
    };
    // Because the pipeline is parameterized, live re-tuning is free:
    widthInput.oninput = update;
    rampSelect.oninput = update;
  </script>
</body>
</html>

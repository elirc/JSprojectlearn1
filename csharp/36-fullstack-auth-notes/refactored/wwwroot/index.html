<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Notes</h1>
    <p id="error" class="error" hidden></p>

    <!-- Signed out: register or log in. Same two fields, two buttons. -->
    <section id="auth" hidden>
      <p class="hint">Your notes are private to your account. Passwords need 8+ characters.</p>
      <form id="auth-form" autocomplete="off">
        <input id="username" placeholder="username" aria-label="Username" autocomplete="username">
        <input id="password" type="password" placeholder="password" aria-label="Password" autocomplete="current-password">
        <div class="row">
          <button id="login-btn" type="submit">Log in</button>
          <button id="register-btn" type="button" class="secondary">Register</button>
        </div>
      </form>
    </section>

    <!-- Signed in: who you are, and your notes. -->
    <section id="app" hidden>
      <p class="whoami">
        Signed in as <strong id="who"></strong>
        <button id="logout-btn" type="button" class="secondary">Log out</button>
      </p>

      <form id="add-form" autocomplete="off">
        <input id="new-text" placeholder="Write a note..." aria-label="New note text">
        <button type="submit">Add</button>
      </form>

      <ul id="list" aria-live="polite"></ul>
      <p id="count" class="count"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

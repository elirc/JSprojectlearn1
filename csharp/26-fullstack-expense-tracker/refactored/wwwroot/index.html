<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>
    <p id="error" class="error" hidden></p>

    <form id="add-form" autocomplete="off">
      <input id="description" placeholder="What was it?" aria-label="Description">
      <input id="category" placeholder="Category" aria-label="Category" list="known-categories">
      <datalist id="known-categories"></datalist>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" aria-label="Amount">
      <input id="date" type="date" aria-label="Date">
      <button>Add</button>
    </form>

    <div class="columns">
      <section>
        <h2>Expenses</h2>
        <table>
          <thead>
            <tr><th>Date</th><th>What</th><th>Category</th><th class="num">Amount</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No expenses yet — add one above.</p>
      </section>

      <section>
        <h2>Summary</h2>
        <label class="filter">
          Month <input id="month-filter" type="month">
          <button id="clear-filter" type="button">All time</button>
        </label>
        <p class="headline"><span id="total">0.00</span></p>
        <p id="biggest" class="biggest"></p>
        <ul id="by-category"></ul>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>

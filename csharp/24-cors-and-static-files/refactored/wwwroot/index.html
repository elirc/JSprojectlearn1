<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Wall</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.5rem; }
    li { margin: 0.5rem 0; }
    .author { color: #666; font-style: italic; }
    #random { margin: 1rem 0; padding: 0.75rem 1rem; background: #f4f4f4; border-left: 4px solid #888; }
    form { margin-top: 1.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input { padding: 0.4rem; flex: 1 1 10rem; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Quote Wall</h1>
  <p>A static page + fetch calls against <code>/api/quotes</code>. No HTML is built on the server.</p>

  <button id="random-btn">Show a random quote</button>
  <p id="random" hidden></p>

  <ul id="quotes"></ul>

  <form id="add-form">
    <input id="text" placeholder="Quote text" required>
    <input id="author" placeholder="Author (optional)">
    <button type="submit">Add quote</button>
  </form>
  <p id="error" hidden></p>

  <script src="app.js"></script>
</body>
</html>

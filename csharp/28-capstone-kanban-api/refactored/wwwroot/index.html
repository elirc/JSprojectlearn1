<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Kanban</h1>
      <form id="add-column-form" autocomplete="off">
        <input id="new-column" placeholder="New column…" aria-label="New column name">
        <button>Add column</button>
      </form>
    </header>
    <p id="error" class="error" hidden></p>
    <div id="board" class="board"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>

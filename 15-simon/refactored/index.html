<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simon (refactored)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .pad { display: inline-block; width: 100px; height: 100px; margin: 5px;
           border-radius: 12px; cursor: pointer; opacity: 0.5; }
    .pad.lit { opacity: 1; }
    #green { background: #2a2; } #red { background: #c33; }
    #yellow { background: #cc2; } #blue { background: #36c; }
  </style>
</head>
<body>
  <h1>Simon</h1>
  <p id="status">Press Start</p>
  <div>
    <div class="pad" id="green"></div>
    <div class="pad" id="red"></div>
  </div>
  <div>
    <div class="pad" id="yellow"></div>
    <div class="pad" id="blue"></div>
  </div>
  <p><button id="startButton">Start</button></p>

  <script>
    const COLORS = ['green', 'red', 'yellow', 'blue'];

    // All timing in one place. Want a faster game? Edit numbers here —
    // they can't drift out of sync because nothing else hardcodes time.
    const TIMING = {
      flash: 400,       // pad lit, ms
      gap: 300,         // between flashes
      beforeInput: 250, // pause after sequence before player's turn
      betweenRounds: 900,
    };

    // The game is always in exactly one phase. Every handler checks
    // the phase instead of juggling boolean flags.
    let phase = 'idle'; // 'idle' | 'showing' | 'listening' | 'gameover'
    let sequence = [];
    let playerIndex = 0;

    // ---- The workhorse: sleep() turns setTimeout into an awaitable ----
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    /** Light a pad for TIMING.flash ms. Async, so callers can await it. */
    async function flash(color) {
      const pad = document.getElementById(color);
      pad.classList.add('lit');
      await sleep(TIMING.flash);
      pad.classList.remove('lit');
    }

    /**
     * Compare with the original's scheduling pyramid: this is the same
     * behavior written as a straight line. "For each color: flash it,
     * small gap." Reads exactly like you'd describe the game aloud.
     */
    async function playSequence() {
      phase = 'showing';
      setStatus(`Watch... (round ${sequence.length})`);
      for (const color of sequence) {
        await flash(color);
        await sleep(TIMING.gap);
      }
      await sleep(TIMING.beforeInput);
      phase = 'listening';
      playerIndex = 0;
      setStatus('Your turn!');
    }

    async function nextRound() {
      sequence.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
      await playSequence();
    }

    async function handlePadClick(color) {
      if (phase !== 'listening') return; // one check replaces flag-juggling
      flash(color); // deliberately not awaited: don't block the check below

      if (color !== sequence[playerIndex]) {
        phase = 'gameover';
        setStatus(`Wrong! You reached round ${sequence.length}. Press Start.`);
        return;
      }

      playerIndex++;
      if (playerIndex === sequence.length) {
        phase = 'showing';
        setStatus('Good!');
        await sleep(TIMING.betweenRounds);
        await nextRound();
      }
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // ---- wiring ----
    document.getElementById('startButton').onclick = () => {
      sequence = [];
      nextRound();
    };
    for (const color of COLORS) {
      document.getElementById(color).onclick = () => handlePadClick(color);
    }
  </script>
</body>
</html>

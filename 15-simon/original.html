<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simon (original)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .pad { display: inline-block; width: 100px; height: 100px; margin: 5px;
           border-radius: 12px; cursor: pointer; opacity: 0.5; }
    .pad.lit { opacity: 1; }
    #green { background: #2a2; } #red { background: #c33; }
    #yellow { background: #cc2; } #blue { background: #36c; }
  </style>
</head>
<body>
  <h1>Simon</h1>
  <p id="status">Press Start</p>
  <div>
    <div class="pad" id="green" onclick="padClick('green')"></div>
    <div class="pad" id="red" onclick="padClick('red')"></div>
  </div>
  <div>
    <div class="pad" id="yellow" onclick="padClick('yellow')"></div>
    <div class="pad" id="blue" onclick="padClick('blue')"></div>
  </div>
  <p><button onclick="start()">Start</button></p>

  <script>
    var colors = ["green", "red", "yellow", "blue"];
    var sequence = [];
    var playerIndex = 0;
    var accepting = false; // did we remember to flip this everywhere? hope so

    function start() {
      sequence = [];
      nextRound();
    }

    function nextRound() {
      playerIndex = 0;
      accepting = false;
      sequence.push(colors[Math.floor(Math.random() * 4)]);
      document.getElementById("status").innerText = "Watch... (round " + sequence.length + ")";

      // Play the sequence by scheduling EVERY flash up front with
      // hand-computed delays. The callback pyramid begins:
      for (var i = 0; i < sequence.length; i++) {
        (function (i) { // <- the classic var-in-loop trap workaround
          setTimeout(function () {
            var pad = document.getElementById(sequence[i]);
            pad.className = "pad lit";
            setTimeout(function () {
              pad.className = "pad";
              if (i == sequence.length - 1) {
                // last flash done -> NOW we can accept input.
                // this "what happens next" logic is buried three
                // callbacks deep inside a loop.
                setTimeout(function () {
                  accepting = true;
                  document.getElementById("status").innerText = "Your turn!";
                }, 250);
              }
            }, 400);
          }, i * 700);
        })(i);
      }
    }

    function padClick(color) {
      if (!accepting) return;
      var pad = document.getElementById(color);
      pad.className = "pad lit";
      setTimeout(function () { pad.className = "pad"; }, 200);

      if (color == sequence[playerIndex]) {
        playerIndex++;
        if (playerIndex == sequence.length) {
          accepting = false;
          document.getElementById("status").innerText = "Good!";
          setTimeout(nextRound, 900);
        }
      } else {
        accepting = false;
        document.getElementById("status").innerText =
          "Wrong! You reached round " + sequence.length + ". Press Start.";
      }
    }
    // Try changing the timing (flash longer, gap shorter): you must
    // re-derive i*700, 400, 250 and keep them mutually consistent.
    // Try adding sound per flash: another setTimeout inside the pyramid.
  </script>
</body>
</html>

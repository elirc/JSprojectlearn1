<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Big list (original)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
    #stats { font: 12px monospace; background: #000; color: #0f0; padding: 8px; }
    #viewport { height: 400px; overflow-y: auto; border: 1px solid #ccc; margin-top: 12px; }
    .row { height: 32px; box-sizing: border-box; padding: 6px 10px; border-bottom: 1px solid #eee;
           display: flex; justify-content: space-between; font-size: 14px; }
    .row:hover { background: #f4f8ff; }
    .amount { font: 13px monospace; color: #444; }
    button { font: inherit; margin-top: 12px; }
    p.note { color: #555; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>10,000 transactions</h1>
  <div id="stats">building…</div>
  <button id="sort">Sort by amount ↓</button>
  <button id="jump">Jump to row 9,000</button>
  <div id="viewport"><div id="list"></div></div>
  <p class="note">
    Notice the delay before the list appears, the DOM node count in the green
    box, and the stutter while you drag the scrollbar. Then click "Sort" and
    watch the page freeze while it does the whole thing again.
  </p>

  <script>
    // A list of 10,000 rows. The obvious way to show a list is to make
    // an element for every item, so that's what this does.

    var TOTAL = 10000;
    var rows = [];
    for (var i = 0; i < TOTAL; i++) {
      rows.push({ id: i, label: "Transaction #" + i, amount: (i * 7919) % 1000 });
    }

    function buildEverything() {
      var started = performance.now();
      var list = document.getElementById("list");
      list.innerHTML = "";

      for (var i = 0; i < rows.length; i++) {
        // PROBLEM 1: 10,000 elements. Each one costs memory, a slot in the
        // browser's layout tree, and time in every layout and paint pass
        // for as long as it exists — including the 9,988 the user cannot
        // see. The screen fits about 13.
        var row = document.createElement("div");
        row.className = "row";

        var label = document.createElement("span");
        label.textContent = rows[i].label;
        var amount = document.createElement("span");
        amount.className = "amount";
        amount.textContent = "$" + rows[i].amount;
        row.appendChild(label);
        row.appendChild(amount);

        // PROBLEM 2: 10,000 event listeners, each holding a closure over a
        // row object. Memory that never comes back until the list does.
        (function (item) {
          row.addEventListener("click", function () {
            document.getElementById("stats").textContent = "clicked " + item.label;
          });
        })(rows[i]);

        // PROBLEM 3: appending inside the loop means the browser is asked
        // to reflow the page thousands of times while we're still working.
        list.appendChild(row);
      }

      var ms = performance.now() - started;
      document.getElementById("stats").textContent =
        "DOM nodes: " + document.getElementsByTagName("*").length +
        "  ·  rows in DOM: " + list.children.length +
        "  ·  built in " + ms.toFixed(0) + "ms";
    }

    // PROBLEM 4: any change to the data means building all 10,000 again.
    // Sorting 10,000 numbers takes about a millisecond; rebuilding 10,000
    // elements is what actually freezes the tab.
    document.getElementById("sort").onclick = function () {
      rows.sort(function (a, b) { return b.amount - a.amount; });
      buildEverything();
    };

    document.getElementById("jump").onclick = function () {
      document.getElementById("viewport").scrollTop = 9000 * 32;
    };

    buildEverything();

    // PROBLEM 5, the one that matters most: this page's cost is
    // proportional to how much data EXISTS, not to how much the user can
    // SEE. At 10,000 rows it's slow. At 100,000 the tab stops responding.
    // At 1,000,000 it crashes. Nothing about the code changes — only the
    // number does — so there is no bug to find and no fix to apply.
  </script>
</body>
</html>

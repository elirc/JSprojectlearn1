<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 58 — one big palette component (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; transition: none; }
    body.dark { background: #1a202c; color: #e2e8f0; }
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35);
                display: flex; align-items: flex-start; justify-content: center; }
    .palette { margin-top: 12vh; width: 460px; background: #fff; color: #111;
               border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.35); overflow: hidden; }
    .palette input { width: 100%; box-sizing: border-box; border: 0; padding: 14px;
                     font-size: 16px; outline: none; border-bottom: 1px solid #eee; }
    .palette li { list-style: none; padding: 10px 14px; cursor: pointer; }
    .palette li.active { background: #e6f0ff; }
    .palette ul { margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    .log { background: #f4f5f7; border-radius: 6px; padding: 10px; min-height: 60px; }
    body.dark .log { background: #2d3748; }
    .note { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ONE component. Global key handling, fuzzy filtering, selection
    // state, icons and every command's implementation, interleaved.
    // Adding one command means editing five separate places — they are
    // marked (1) ... (5) below. Go and count them.
    function App() {
      const [open, setOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [selected, setSelected] = useState(0);
      const [dark, setDark] = useState(false);
      const [fontSize, setFontSize] = useState(16);
      const [log, setLog] = useState(['(nothing yet)']);

      // (1) the list of commands — titles, and titles are the identity
      const allCommands = [
        'Toggle dark mode',
        'Increase font size',
        'Decrease font size',
        'Reset font size',
        'Say hello',
        'Clear the log',
        'About this palette',
      ];

      // (2) the filter, with its hand-rolled special cases
      function matches(q, title) {
        if (q.trim() === '') return true;
        const query = q.toLowerCase();
        const text = title.toLowerCase();
        // synonyms, bolted on one panicked bug report at a time
        if (query === 'theme' && title === 'Toggle dark mode') return true;
        if (query === 'night' && title === 'Toggle dark mode') return true;
        if (query === 'bigger' && title === 'Increase font size') return true;
        if (query === 'smaller' && title === 'Decrease font size') return true;
        if (query === 'erase' && title === 'Clear the log') return true;
        let i = 0;
        for (const ch of query) {
          const found = text.indexOf(ch, i);
          if (found === -1) return false;
          i = found + 1;
        }
        return true;
      }

      const results = allCommands.filter((title) => matches(query, title));

      // (3) what each command DOES — a chain of string comparisons
      function runCommand(title) {
        if (title === 'Toggle dark mode') {
          setDark(!dark);
        } else if (title === 'Increase font size') {
          setFontSize(fontSize + 2);
        } else if (title === 'Decrease font size') {
          setFontSize(fontSize - 2);
        } else if (title === 'Reset font size') {
          setFontSize(16);
        } else if (title === 'Say hello') {
          setLog([...log, 'hello 👋']);
        } else if (title === 'Clear the log') {
          setLog([]);
        } else if (title === 'About this palette') {
          setLog([...log, 'A command palette in one 200-line component.']);
        }
        setOpen(false);
        setQuery('');
        setSelected(0);
      }

      // (4) the icon for each command — a second chain of string comparisons
      function iconFor(title) {
        if (title === 'Toggle dark mode') return '🌗';
        if (title === 'Increase font size') return '🔍';
        if (title === 'Decrease font size') return '🔍';
        if (title === 'Reset font size') return '↩️';
        if (title === 'Say hello') return '👋';
        if (title === 'Clear the log') return '🧹';
        return '❔';
      }

      // (5) the keyboard: open/close, move, run — and it must be
      // re-subscribed on every keystroke, because it reads `query`,
      // `selected`, `open`, `results`, `dark`, `fontSize` and `log`
      // out of this render's closure. Leave anything out of the deps
      // array and it runs a stale command (project 11).
      useEffect(() => {
        function onKeyDown(e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            setOpen((o) => !o);
            setQuery('');
            setSelected(0);
            return;
          }
          if (!open) return;
          if (e.key === 'Escape') {
            setOpen(false);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSelected((s) => (s + 1) % Math.max(results.length, 1));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSelected((s) => (s - 1 + results.length) % Math.max(results.length, 1));
          } else if (e.key === 'Enter') {
            const title = results[selected];
            if (title) runCommand(title);
          }
        }
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [open, query, selected, results.length, dark, fontSize, log]);

      useEffect(() => {
        document.body.className = dark ? 'dark' : '';
        document.body.style.fontSize = fontSize + 'px';
      }, [dark, fontSize]);

      return (
        <div>
          <h1>Palette demo</h1>
          <p className="note">
            Press <b>Ctrl+K</b> (or Cmd+K), type, use ↑ ↓ and Enter.
            Everything works. Now open the source and try to answer one
            question: <i>where would you add a "Copy the log" command?</i>
          </p>
          <div className="log">
            {log.map((line, i) => <div key={i}>{line}</div>)}
          </div>
          <p className="note">
            font size {fontSize}px · theme {dark ? 'dark' : 'light'}
          </p>
          {open && (
            <div className="backdrop" onClick={() => setOpen(false)}>
              <div className="palette" onClick={(e) => e.stopPropagation()}>
                <input
                  autoFocus
                  placeholder="Type a command…"
                  value={query}
                  onChange={(e) => { setQuery(e.target.value); setSelected(0); }}
                />
                <ul>
                  {results.map((title, i) => (
                    <li
                      key={title}
                      className={i === selected ? 'active' : ''}
                      onMouseEnter={() => setSelected(i)}
                      onClick={() => runCommand(title)}
                    >
                      {iconFor(title)} {title}
                    </li>
                  ))}
                  {results.length === 0 && <li className="note">no matches</li>}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

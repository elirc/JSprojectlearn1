<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 19 — fetch race (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A search API where SHORT queries are SLOW (more results to
    // "scan"). This inversion is realistic — and it's what exposes
    // the race.
    function searchApi(query) {
      const delay = Math.max(200, 1200 - query.length * 300);
      return new Promise((resolve) =>
        setTimeout(
          () => resolve(`results for "${query}" (took ${delay}ms)`),
          delay,
        ),
      );
    }

    function App() {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState('');

      useEffect(() => {
        if (query === '') { setResults(''); return; }
        searchApi(query).then((r) => setResults(r));
        // Deps are correct! Cleanup isn't the issue either. The bug:
        // NOTHING says "only the LATEST request may write results."
        // Type "cat" quickly:
        //   "c"   -> fires, resolves in ~900ms
        //   "ca"  -> fires, resolves in ~600ms
        //   "cat" -> fires, resolves in ~300ms  <- shows first!
        // ...then "ca" lands, then "c" lands LAST and OVERWRITES the
        // correct results. The screen ends up showing results for
        // "c" under a search box that says "cat".
      }, [query]);

      return (
        <div>
          <h1>Search</h1>
          <input value={query} onChange={(e) => setQuery(e.target.value)}
                 placeholder='type "cat" quickly' />
          <p><strong>box says:</strong> {query || '(empty)'}</p>
          <p><strong>results say:</strong> {results || '(none)'}</p>
          <p style={{ color: '#666', fontSize: 14 }}>
            Type "cat" fast, then wait a second. The results settle on
            "c" — the oldest, slowest, WRONG response. js#48 called
            this a race condition; this is the async-data version, and
            every search box ever built has shipped it once.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

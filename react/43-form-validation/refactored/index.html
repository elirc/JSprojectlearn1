<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 43 — schema validation (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          input { display: block; margin: 6px 0 2px; padding: 6px; width: 260px; }
          input.invalid { border-color: #c33; }
          .error { color: #c33; font-size: 13px; margin: 0 0 6px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ==== js#31's validator, verbatim ============================
    // Rules are functions value -> message|null; schemas are data;
    // validate() collects ALL errors. Nothing React-specific — which
    // is why it drops straight in. (In a bundled project you would
    // literally `import { validate } from 'js/31-validator'`.)
    const required = () => (v) =>
      v === undefined || v === null || v === '' ? 'is required' : null;
    const minLength = (n) => (v) =>
      typeof v === 'string' && v.length < n ? `must be at least ${n} characters` : null;
    const matches = (pattern, description) => (v) =>
      typeof v === 'string' && !pattern.test(v) ? `must ${description}` : null;

    function validate(data, schema) {
      const errors = {};
      for (const [field, rules] of Object.entries(schema)) {
        const fieldErrors = rules.map((rule) => rule(data[field])).filter(Boolean);
        if (fieldErrors.length > 0) errors[field] = fieldErrors;
      }
      return errors;
    }

    const signupSchema = {
      username: [required(), minLength(3)],
      email: [required(), matches(/^\S+@\S+\.\S+$/, 'be a valid email')],
      password: [required(), minLength(8)],
    };

    // ==== a reusable field that shows its own errors ==============
    function Field({ name, type = 'text', value, errors, touched, onChange }) {
      const show = touched && errors.length > 0;
      return (
        <div>
          <input
            name={name} type={type} placeholder={name} value={value}
            className={show ? 'invalid' : ''}
            onChange={onChange}
          />
          {show && errors.map((e) => <p key={e} className="error">{name} {e}</p>)}
        </div>
      );
    }

    function App() {
      // one form object (project 12) + which fields the user has
      // visited (so we don't yell about emptiness before they type)
      const [form, setForm] = useState({ username: '', email: '', password: '' });
      const [touched, setTouched] = useState({});
      const [submitted, setSubmitted] = useState(false);

      // validation is DERIVED, every render (project 09): always
      // current, nothing to sync
      const errors = validate(form, signupSchema);
      const isValid = Object.keys(errors).length === 0;

      function handleChange(e) {
        const { name, value } = e.target;
        setForm((f) => ({ ...f, [name]: value }));
        setTouched((t) => ({ ...t, [name]: true }));
      }

      function handleSubmit(e) {
        e.preventDefault();
        // on submit, every field counts as touched (show everything):
        setTouched({ username: true, email: true, password: true });
        if (isValid) setSubmitted(true);
      }

      return (
        <form onSubmit={handleSubmit} noValidate>
          <h1>Sign up</h1>
          {['username', 'email', 'password'].map((name) => (
            <Field
              key={name}
              name={name}
              type={name === 'password' ? 'password' : 'text'}
              value={form[name]}
              errors={errors[name] ?? []}
              touched={Boolean(touched[name])}
              onChange={handleChange}
            />
          ))}
          <button type="submit" disabled={!isValid && Object.keys(touched).length > 0}>
            create account
          </button>
          {submitted && <p>✅ account created</p>}

          <p style={{ color: '#666', fontSize: 14 }}>
            Every problem is visible AT ITS FIELD, live as you type
            (after you've touched the field — no yelling at pristine
            inputs). One submit shows everything wrong at once. And
            the rules are js#31's schema — data, reusable by the next
            form and testable in Node without any React.
          </p>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 40 — undo, badly (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    .swatch { display: inline-block; width: 40px; height: 40px; margin: 3px;
              border-radius: 6px; cursor: pointer; border: 2px solid #ccc; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A tiny pixel-palette editor with undo. The undo strategy:
    // remember ONE previous palette. (Sound familiar? js#39's
    // original at least had an array...)
    const COLORS = ['#c33', '#36c', '#2a2', '#fc0', '#000', '#fff'];

    function App() {
      const [palette, setPalette] = useState(['#fff', '#fff', '#fff', '#fff']);
      const [previous, setPrevious] = useState(null); // one slot of history
      const [selectedColor, setSelectedColor] = useState('#c33');

      function paint(index) {
        setPrevious(palette); // save the old palette...
        setPalette(palette.map((c, i) => (i === index ? selectedColor : c)));
      }

      function undo() {
        if (previous) {
          setPalette(previous);
          setPrevious(null); // ...and now history is EMPTY again
        }
      }

      return (
        <div>
          <h1>Palette editor</h1>
          <p>
            pick a color:
            {COLORS.map((c) => (
              <span key={c} className="swatch" style={{ background: c,
                    borderColor: c === selectedColor ? '#000' : '#ccc' }}
                    onClick={() => setSelectedColor(c)} />
            ))}
          </p>
          <p>
            click to paint:
            {palette.map((c, i) => (
              <span key={i} className="swatch" style={{ background: c }}
                    onClick={() => paint(i)} />
            ))}
          </p>
          <button onClick={undo} disabled={!previous}>undo</button>
          <p style={{ color: '#666', fontSize: 14 }}>
            Paint three cells, then hit undo twice: only ONE step comes
            back — history is a single slot. There's no redo at all.
            And the undo logic is woven into the component next to
            color-picking and rendering, so testing it means clicking
            swatches. js#39 already SOLVED multi-step undo/redo with
            past/present/future — this component just never heard
            about it.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

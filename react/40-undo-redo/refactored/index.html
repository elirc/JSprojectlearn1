<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 40 — undoable reducer (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    .swatch { display: inline-block; width: 40px; height: 40px; margin: 3px;
              border-radius: 6px; cursor: pointer; border: 2px solid #ccc; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useReducer } = React;

    // ==== copy of history-reducer.js (unit-tested in Node; file://
    // pages can't import modules — see react/13's same note) ========
    function createHistory(initialPresent) {
      return { past: [], present: initialPresent, future: [] };
    }

    function historyReducer(history, action) {
      const { past, present, future } = history;
      switch (action.type) {
        case 'did':
          return { past: [...past, present], present: action.next, future: [] };
        case 'undid': {
          if (past.length === 0) return history;
          return {
            past: past.slice(0, -1),
            present: past[past.length - 1],
            future: [present, ...future],
          };
        }
        case 'redid': {
          if (future.length === 0) return history;
          const [next, ...restFuture] = future;
          return { past: [...past, present], present: next, future: restFuture };
        }
        default:
          throw new Error(`Unknown history action: ${action.type}`);
      }
    }

    function undoable(reducer) {
      return function (history, action) {
        if (action.type === 'undo') return historyReducer(history, { type: 'undid' });
        if (action.type === 'redo') return historyReducer(history, { type: 'redid' });
        const next = reducer(history.present, action);
        if (next === history.present) return history;
        return historyReducer(history, { type: 'did', next });
      };
    }

    // ==== the app's OWN reducer: knows palettes, nothing else ======
    function paletteReducer(palette, action) {
      switch (action.type) {
        case 'painted':
          return palette.map((c, i) => (i === action.index ? action.color : c));
        default:
          return palette;
      }
    }

    const COLORS = ['#c33', '#36c', '#2a2', '#fc0', '#000', '#fff'];

    function App() {
      const [selectedColor, setSelectedColor] = useState('#c33');
      // One line makes the palette undoable. The palette reducer
      // doesn't know history exists; the history reducer doesn't
      // know what a palette is.
      const [history, dispatch] = useReducer(
        undoable(paletteReducer),
        createHistory(['#fff', '#fff', '#fff', '#fff']),
      );
      const palette = history.present;

      return (
        <div>
          <h1>Palette editor</h1>
          <p>
            pick a color:
            {COLORS.map((c) => (
              <span key={c} className="swatch" style={{ background: c,
                    borderColor: c === selectedColor ? '#000' : '#ccc' }}
                    onClick={() => setSelectedColor(c)} />
            ))}
          </p>
          <p>
            click to paint:
            {palette.map((c, i) => (
              <span key={i} className="swatch" style={{ background: c }}
                    onClick={() => dispatch({ type: 'painted', index: i, color: selectedColor })} />
            ))}
          </p>
          <button onClick={() => dispatch({ type: 'undo' })}
                  disabled={history.past.length === 0}>
            undo ({history.past.length})
          </button>{' '}
          <button onClick={() => dispatch({ type: 'redo' })}
                  disabled={history.future.length === 0}>
            redo ({history.future.length})
          </button>
          <p style={{ color: '#666', fontSize: 14 }}>
            Paint five cells, undo five times, redo three — full
            multi-step time travel, with correct
            new-action-kills-the-future behavior (tested in Node).
            This works BECAUSE reducers never mutate (react#10/13):
            every past state is intact, so keeping them is free.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 41 — mini store (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .box { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 6px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useReducer, useContext, createContext } = React;

    // ==== THE STORE: reducer (13) + context (34), packaged ========
    // This ~25-line recipe IS the core of Redux/Zustand-style state:
    // one rulebook, one provider, hooks to reach it from anywhere.
    function cartReducer(cart, action) {
      switch (action.type) {
        case 'added': {
          const existing = cart.find((line) => line.id === action.id);
          if (existing) {
            return cart.map((line) =>
              line.id === action.id ? { ...line, qty: line.qty + 1 } : line);
          }
          return [...cart, { id: action.id, name: action.name, qty: 1 }];
        }
        case 'removed':
          return cart.filter((line) => line.id !== action.id);
        default:
          return cart;
      }
    }

    // TWO contexts, not one (project 33's lesson): dispatch never
    // changes, so components that only WRITE (buttons) never
    // re-render when the cart changes.
    const CartContext = createContext(null);
    const CartDispatchContext = createContext(null);

    function CartProvider({ children }) {
      const [cart, dispatch] = useReducer(cartReducer, []);
      return (
        <CartContext.Provider value={cart}>
          <CartDispatchContext.Provider value={dispatch}>
            {children}
          </CartDispatchContext.Provider>
        </CartContext.Provider>
      );
    }

    function useCart() {
      const cart = useContext(CartContext);
      if (cart === null) throw new Error('useCart needs <CartProvider>');
      return cart;
    }

    function useCartDispatch() {
      const dispatch = useContext(CartDispatchContext);
      if (dispatch === null) throw new Error('useCartDispatch needs <CartProvider>');
      return dispatch;
    }

    // ==== THE TREE: zero cart props anywhere ======================
    function Layout() {
      return (
        <div className="box">
          Layout
          <Header />
          <ProductPage />
        </div>
      );
    }

    function Header() {
      return <div className="box">Header — <CartBadge /></div>;
    }

    function CartBadge() {
      const cart = useCart(); // reads: subscribes to cart changes
      const count = cart.reduce((sum, line) => sum + line.qty, 0);
      return <span>🛒 {count}</span>;
    }

    function ProductPage() {
      return (
        <div className="box">
          Products
          <ProductButton id="kb" name="Keyboard" />
          <ProductButton id="ms" name="Mouse" />
          <CartList />
        </div>
      );
    }

    function ProductButton({ id, name }) {
      const dispatch = useCartDispatch(); // writes only: never re-renders on cart change
      return (
        <button onClick={() => dispatch({ type: 'added', id, name })}>
          add {name}
        </button>
      );
    }

    function CartList() {
      const cart = useCart();
      const dispatch = useCartDispatch();
      return (
        <ul>
          {cart.map((line) => (
            <li key={line.id}>
              {line.name} x{line.qty}{' '}
              <button onClick={() => dispatch({ type: 'removed', id: line.id })}>x</button>
            </li>
          ))}
        </ul>
      );
    }

    function App() {
      return (
        <CartProvider>
          <h1>Shop</h1>
          <Layout />
          <p style={{ color: '#666', fontSize: 14 }}>
            Layout, Header, ProductPage: zero cart props. Readers call
            useCart(), writers call useCartDispatch(), and the
            reducer stays the same pure, testable rulebook from
            project 13. When an app outgrows this recipe, libraries
            (Redux Toolkit, Zustand) add devtools and finer-grained
            subscriptions — but this IS the architecture they wrap.
          </p>
        </CartProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

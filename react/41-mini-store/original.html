<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 41 — dispatch drilling (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .box { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 6px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useReducer } = React;

    // A cart shared app-wide, managed with a reducer (good, project
    // 13!)... and then state+dispatch hand-carried through every
    // layer (bad — project 34's hallway, now with TWO suitcases).
    function cartReducer(cart, action) {
      switch (action.type) {
        case 'added': {
          const existing = cart.find((line) => line.id === action.id);
          if (existing) {
            return cart.map((line) =>
              line.id === action.id ? { ...line, qty: line.qty + 1 } : line);
          }
          return [...cart, { id: action.id, name: action.name, qty: 1 }];
        }
        case 'removed':
          return cart.filter((line) => line.id !== action.id);
        default:
          return cart;
      }
    }

    function Layout({ cart, dispatch }) {            // courier
      return (
        <div className="box">
          Layout
          <Header cart={cart} dispatch={dispatch} />
          <ProductPage cart={cart} dispatch={dispatch} />
        </div>
      );
    }

    function Header({ cart, dispatch }) {            // courier (uses cart only)
      return (
        <div className="box">
          Header — <CartBadge cart={cart} />
        </div>
      );
    }

    function CartBadge({ cart }) {
      const count = cart.reduce((sum, line) => sum + line.qty, 0);
      return <span>🛒 {count}</span>;
    }

    function ProductPage({ cart, dispatch }) {       // courier
      return (
        <div className="box">
          Products
          <ProductButton id="kb" name="Keyboard" dispatch={dispatch} />
          <ProductButton id="ms" name="Mouse" dispatch={dispatch} />
          <CartList cart={cart} dispatch={dispatch} />
        </div>
      );
    }

    function ProductButton({ id, name, dispatch }) {
      return (
        <button onClick={() => dispatch({ type: 'added', id, name })}>
          add {name}
        </button>
      );
    }

    function CartList({ cart, dispatch }) {
      return (
        <ul>
          {cart.map((line) => (
            <li key={line.id}>
              {line.name} x{line.qty}{' '}
              <button onClick={() => dispatch({ type: 'removed', id: line.id })}>x</button>
            </li>
          ))}
        </ul>
      );
    }

    function App() {
      const [cart, dispatch] = useReducer(cartReducer, []);
      return (
        <div>
          <h1>Shop</h1>
          <Layout cart={cart} dispatch={dispatch} />
          <p style={{ color: '#666', fontSize: 14 }}>
            `cart` and `dispatch` appear in SEVEN signatures; three
            components are pure couriers. Every new consumer of the
            cart threads the pair through every layer between it and
            App — and every layout refactor re-plumbs them.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

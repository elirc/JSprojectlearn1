<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 12 — a useState per field (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          input, select { display: block; margin: 6px 0; padding: 6px; width: 240px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A shipping form. One useState per field, one handler per field,
    // and every form-wide operation spelled out field by field.
    function App() {
      const [firstName, setFirstName] = useState('');
      const [lastName, setLastName] = useState('');
      const [street, setStreet] = useState('');
      const [city, setCity] = useState('');
      const [zip, setZip] = useState('');
      const [country, setCountry] = useState('US');
      const [saved, setSaved] = useState('');

      function handleReset() {
        // seven setters. add a field, remember to add an eighth.
        setFirstName('');
        setLastName('');
        setStreet('');
        setCity('');
        setZip('');
        setCountry('US');
      }

      function handleSave() {
        // reassemble the object that never existed:
        setSaved(JSON.stringify({ firstName, lastName, street, city, zip, country }));
      }

      function copyFromProfile() {
        // "prefill from profile" — field by field, again:
        setFirstName('Ada');
        setLastName('Lovelace');
        setStreet('12 Analytical Row');
        setCity('London');
        setZip('W1');
        setCountry('UK');
      }

      return (
        <div>
          <h1>Shipping</h1>
          <input placeholder="first name" value={firstName} onChange={(e) => setFirstName(e.target.value)} />
          <input placeholder="last name" value={lastName} onChange={(e) => setLastName(e.target.value)} />
          <input placeholder="street" value={street} onChange={(e) => setStreet(e.target.value)} />
          <input placeholder="city" value={city} onChange={(e) => setCity(e.target.value)} />
          <input placeholder="zip" value={zip} onChange={(e) => setZip(e.target.value)} />
          <select value={country} onChange={(e) => setCountry(e.target.value)}>
            <option>US</option><option>UK</option><option>DE</option>
          </select>
          <button onClick={copyFromProfile}>prefill from profile</button>
          <button onClick={handleReset}>reset</button>
          <button onClick={handleSave}>save</button>
          <pre>{saved}</pre>
          {/* Six fields: six states, six inline handlers, and three
              functions that each enumerate all six. The FORM — the
              thing as a whole — exists nowhere; only its shrapnel. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

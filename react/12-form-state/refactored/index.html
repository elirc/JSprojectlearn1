<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 12 — one form object (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          input, select { display: block; margin: 6px 0; padding: 6px; width: 240px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // The form as a VALUE. Reset = this object. Save = this object.
    // Prefill = another object. Whole-form operations become
    // one-liners because the whole form exists.
    const EMPTY_FORM = {
      firstName: '', lastName: '', street: '', city: '', zip: '', country: 'US',
    };

    const PROFILE_ADDRESS = {
      firstName: 'Ada', lastName: 'Lovelace', street: '12 Analytical Row',
      city: 'London', zip: 'W1', country: 'UK',
    };

    // Field definitions as data (js#47's content/mechanism split) —
    // the JSX below is a loop, and adding a field is adding a row here
    // plus a key in EMPTY_FORM.
    const FIELDS = [
      { name: 'firstName', placeholder: 'first name' },
      { name: 'lastName', placeholder: 'last name' },
      { name: 'street', placeholder: 'street' },
      { name: 'city', placeholder: 'city' },
      { name: 'zip', placeholder: 'zip' },
    ];

    function App() {
      const [form, setForm] = useState(EMPTY_FORM);
      const [saved, setSaved] = useState('');

      // ONE handler for every field. The input's `name` attribute
      // says which key to update; computed property [name] does the
      // rest. This one function replaces six inline handlers.
      function handleChange(event) {
        const { name, value } = event.target;
        setForm((current) => ({ ...current, [name]: value }));
      }

      return (
        <div>
          <h1>Shipping</h1>
          {FIELDS.map(({ name, placeholder }) => (
            <input
              key={name}
              name={name}
              placeholder={placeholder}
              value={form[name]}
              onChange={handleChange}
            />
          ))}
          <select name="country" value={form.country} onChange={handleChange}>
            <option>US</option><option>UK</option><option>DE</option>
          </select>

          <button onClick={() => setForm(PROFILE_ADDRESS)}>prefill from profile</button>
          <button onClick={() => setForm(EMPTY_FORM)}>reset</button>
          <button onClick={() => setSaved(JSON.stringify(form))}>save</button>
          <pre>{saved}</pre>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

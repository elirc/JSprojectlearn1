<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 38 — portal modal (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
    .sidebar { border: 1px solid #ccc; border-radius: 8px; padding: 12px;
               overflow: hidden; transform: translateX(0);
               position: relative; z-index: 1; }
    .header { position: relative; z-index: 10; background: #36c; color: #fff;
              padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                      display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 8px; padding: 20px; width: 280px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- the modal layer: a sibling of the app root, last in the body,
       outside every clipping/stacking ancestor by construction -->
  <div id="modal-root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // A reusable Modal: renders its children INTO #modal-root via a
    // portal, no matter where the Modal appears in the component
    // tree. React state/context still flow as if it were inline —
    // only the DOM output moves.
    function Modal({ onClose, children }) {
      // small a11y bonus that belongs with every modal: Esc closes
      // (an effect with cleanup — project 18's pairing)
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      return ReactDOM.createPortal(
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            {children}
          </div>
        </div>,
        document.getElementById('modal-root'),
      );
    }

    function DeleteAccountButton() {
      const [open, setOpen] = useState(false);

      return (
        <span>
          <button onClick={() => setOpen(true)}>Delete account…</button>
          {open && (
            <Modal onClose={() => setOpen(false)}>
              <h3>Really delete?</h3>
              <button onClick={() => setOpen(false)}>cancel</button>{' '}
              <button style={{ color: '#c33' }}>DELETE</button>
            </Modal>
          )}
        </span>
      );
    }

    function App() {
      return (
        <div>
          <div className="header">App header (z-index: 10)</div>
          <h1>Settings</h1>
          <div className="sidebar">
            <p>Danger zone (same hostile CSS as the original)</p>
            <DeleteAccountButton />
          </div>
          <p style={{ color: '#666', fontSize: 14 }}>
            Same sidebar, same overflow:hidden, same transform, same
            z-indexed header — and the modal covers the full viewport
            above everything, because its DOM lives in #modal-root
            where no ancestor can clip or stack it. The component
            tree didn't change; only where the pixels land did.
            (Esc closes it too — listener + cleanup, project 18.)
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 49 — todo, first draft (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          li.done span { text-decoration: line-through; color: #999; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // The capstone's "before": a working todo app that quietly
    // collects one instance of half the mistakes in this track.
    function App() {
      const [todos, setTodos] = useState([]);
      const [draft, setDraft] = useState('');
      const [filter, setFilter] = useState('all');

      // derived state STORED + synced by effect (react#09):
      const [remaining, setRemaining] = useState(0);
      useEffect(() => {
        setRemaining(todos.filter((t) => !t.done).length);
      }, [todos]);

      // persistence bolted on with TWO effects — and a bug: the load
      // effect runs after the first render, so the save effect below
      // has already SAVED THE EMPTY ARRAY over your data if anything
      // re-renders in between; and on the very first visit,
      // localStorage has "undefined" in it (JSON.parse crash bait):
      useEffect(() => {
        const stored = localStorage.getItem('todos-v1');
        if (stored) setTodos(JSON.parse(stored));
      }, []);
      useEffect(() => {
        localStorage.setItem('todos-v1', JSON.stringify(todos));
      }, [todos]);

      function addTodo() {
        if (!draft.trim()) return;
        // index-as-id (react#03's warning): delete one and re-add,
        // and ids collide
        setTodos([...todos, { id: todos.length, text: draft.trim(), done: false }]);
        setDraft('');
      }

      const visible = todos.filter((t) =>
        filter === 'all' ? true : filter === 'active' ? !t.done : t.done);

      return (
        <div>
          <h1>Todos</h1>
          <input value={draft} onChange={(e) => setDraft(e.target.value)}
                 onKeyDown={(e) => e.key === 'Enter' && addTodo()} />
          <button onClick={addTodo}>add</button>
          {['all', 'active', 'done'].map((f) => (
            <button key={f} onClick={() => setFilter(f)} disabled={filter === f}>{f}</button>
          ))}
          <ul>
            {visible.map((t, i) => (
              <li key={i} className={t.done ? 'done' : ''}>
                {/* key={i} on a FILTERED list — the worst version of
                    react#03: indexes shift as items change lists */}
                <span onClick={() =>
                  setTodos(todos.map((x) =>
                    x.id === t.id ? { ...x, done: !x.done } : x))}>
                  {t.text}
                </span>{' '}
                <button onClick={() => setTodos(todos.filter((x) => x.id !== t.id))}>x</button>
              </li>
            ))}
          </ul>
          <p>{remaining} remaining</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

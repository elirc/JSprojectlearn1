<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 49 — todo capstone (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          li.done span { text-decoration: line-through; color: #999; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useReducer } = React;

    // ==== rules: react#13's reducer, verbatim ======================
    const initialState = { todos: [], nextId: 1 };

    function todosReducer(state, action) {
      switch (action.type) {
        case 'added': {
          const text = action.text.trim();
          if (text === '') return state;
          return {
            todos: [...state.todos, { id: state.nextId, text, done: false }],
            nextId: state.nextId + 1,
          };
        }
        case 'toggled':
          return { ...state, todos: state.todos.map((t) =>
            t.id === action.id ? { ...t, done: !t.done } : t) };
        case 'deleted':
          return { ...state, todos: state.todos.filter((t) => t.id !== action.id) };
        case 'clearedDone':
          return { ...state, todos: state.todos.filter((t) => !t.done) };
        default:
          throw new Error(`Unknown action: ${action.type}`);
      }
    }

    // ==== persistence: react#23's hook + a persistent REDUCER ======
    // Lazy third argument to useReducer = guarded load (runs once,
    // corrupted data falls back). Saving is one effect. No
    // load-after-save race: the initial state IS the stored state.
    function usePersistentReducer(key, reducer, defaultState) {
      const [state, dispatch] = useReducer(reducer, defaultState, (fallback) => {
        try {
          const stored = localStorage.getItem(key);
          return stored === null ? fallback : JSON.parse(stored);
        } catch {
          return fallback;
        }
      });

      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(state));
      }, [key, state]);

      return [state, dispatch];
    }

    const FILTERS = {
      all: () => true,
      active: (t) => !t.done,
      done: (t) => t.done,
    };

    function App() {
      const [state, dispatch] = usePersistentReducer('todos-v2', todosReducer, initialState);
      const [draft, setDraft] = useState('');
      const [filter, setFilter] = useState('all');

      // derived, never stored (react#09):
      const visible = state.todos.filter(FILTERS[filter]);
      const remaining = state.todos.filter((t) => !t.done).length;

      function submitDraft() {
        dispatch({ type: 'added', text: draft });
        setDraft('');
      }

      return (
        <div>
          <h1>Todos</h1>
          <input value={draft} onChange={(e) => setDraft(e.target.value)}
                 onKeyDown={(e) => e.key === 'Enter' && submitDraft()}
                 placeholder="what needs doing?" />
          <button onClick={submitDraft}>add</button>
          {Object.keys(FILTERS).map((f) => (
            <button key={f} onClick={() => setFilter(f)} disabled={filter === f}>{f}</button>
          ))}
          <button onClick={() => dispatch({ type: 'clearedDone' })}>clear done</button>
          <ul>
            {visible.map((t) => (
              <li key={t.id} className={t.done ? 'done' : ''}>
                <span onClick={() => dispatch({ type: 'toggled', id: t.id })}>{t.text}</span>{' '}
                <button onClick={() => dispatch({ type: 'deleted', id: t.id })}>x</button>
              </li>
            ))}
          </ul>
          <p>{remaining} remaining</p>
          <p style={{ color: '#666', fontSize: 14 }}>
            The lineage: js#14 (state → render) → react#13 (rules in a
            reducer) → this (persistence + filters). Every piece is a
            track lesson: stable ids from the reducer (03), filters as
            a lookup table (js#06), derived counts (09), guarded lazy
            load (23), one save effect (18/21). Refresh, filter,
            delete, re-add — nothing collides, nothing vanishes.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

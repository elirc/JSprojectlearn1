<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 33 — split contexts (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .panel { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 6px 0; }
          .dark { background: #222; color: #eee; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo } = React;

    // One context PER concern, split by "what changes together"
    // (js#26's grouping rule, applied to contexts). Consumers
    // subscribe to exactly the concern they read.
    const ThemeContext = createContext(null);
    const UserContext = createContext(null);
    const NotificationContext = createContext(0);

    let themeRenders = 0, userRenders = 0, notifRenders = 0;

    function ThemePanel() {
      const { theme } = useContext(ThemeContext);
      themeRenders++;
      return (
        <div className={`panel ${theme}`}>
          theme panel ({theme}) · renders: {themeRenders}
        </div>
      );
    }

    function UserPanel() {
      const user = useContext(UserContext);
      userRenders++;
      return (
        <div className="panel">
          user panel ({user.name}) · renders: {userRenders}
        </div>
      );
    }

    function NotificationBell() {
      const notifications = useContext(NotificationContext);
      notifRenders++;
      return (
        <div className="panel">
          🔔 {notifications} · renders: {notifRenders}
        </div>
      );
    }

    function App() {
      const [theme, setTheme] = useState('light');
      const [user] = useState({ name: 'Ada' });
      const [notifications, setNotifications] = useState(0);

      useEffect(() => {
        const id = setInterval(() => setNotifications((n) => n + 1), 1000);
        return () => clearInterval(id);
      }, []);

      // Stabilize each provider's value (project 30): the theme
      // object is rebuilt only when theme actually changes, so theme
      // consumers wake only for real theme changes.
      const themeValue = useMemo(() => ({ theme, setTheme }), [theme]);

      return (
        <ThemeContext.Provider value={themeValue}>
          <UserContext.Provider value={user}>
            <NotificationContext.Provider value={notifications}>
              <h1>Split contexts</h1>
              <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>
                toggle theme
              </button>
              <ThemePanel />
              <UserPanel />
              <NotificationBell />
              <p style={{ color: '#666', fontSize: 14 }}>
                Now the bell ticks alone: notifications update ONLY
                the bell's counter. Toggle the theme: only the theme
                panel wakes. Each consumer subscribes to exactly what
                it reads. Three providers is mild ceremony — the
                price of precision. (Project 41 wraps this pattern
                into a store.)
              </p>
            </NotificationContext.Provider>
          </UserContext.Provider>
        </ThemeContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

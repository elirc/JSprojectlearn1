<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 28 — memo defeated (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .row { border-bottom: 1px solid #eee; padding: 6px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, memo } = React;

    // A big-ish list where each row is deliberately slow to render
    // (simulating real rows: charts, markdown, avatars...).
    const ITEMS = Array.from({ length: 60 }, (_, i) => ({ id: i, label: `Item ${i}` }));

    let rowRenders = 0;

    function slowdown() {
      const until = performance.now() + 2; // ~2ms per row render
      while (performance.now() < until) {}
    }

    // The author KNEW about React.memo and used it! A memo'd
    // component skips re-rendering when its props are unchanged...
    const Row = memo(function Row({ item, onPick }) {
      rowRenders++;
      slowdown();
      return (
        <div className="row" onClick={() => onPick(item.id)}>
          {item.label}
        </div>
      );
    });

    function App() {
      const [picked, setPicked] = useState(null);
      const [filterText, setFilterText] = useState('');

      // ...but props are compared with Object.is (project 10's
      // reference lesson, other direction). This arrow is a NEW
      // function every render, so every Row's onPick prop "changed"
      // every time. The memo compares, sees a new reference, and
      // re-renders all 60 slow rows on every keystroke:
      const handlePick = (id) => setPicked(id);

      return (
        <div>
          <h1>Item picker</h1>
          <input placeholder="type here and feel the lag"
                 value={filterText} onChange={(e) => setFilterText(e.target.value)} />
          <p>picked: {picked ?? 'nothing'} · total row renders: {rowRenders}</p>
          {ITEMS.map((item) => (
            <Row key={item.id} item={item} onPick={handlePick} />
          ))}
          {/* 60 rows x ~2ms = ~120ms per keystroke, spent re-rendering
              rows whose pixels cannot change. The memo() wrapper is
              working perfectly — it's being FED a fresh prop. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 45 — tangled table (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { cursor: pointer; background: #f4f4f4; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const PEOPLE = [
      { name: 'Ada', role: 'Engineer', score: 97 },
      { name: 'Grace', role: 'Admiral', score: 94 },
      { name: 'Alan', role: 'Logician', score: 91 },
      { name: 'Katherine', role: 'Calculator', score: 99 },
      { name: 'Edsger', role: 'Curmudgeon', score: 88 },
      { name: 'Barbara', role: 'Architect', score: 95 },
      { name: 'Donald', role: 'Author', score: 93 },
    ];

    function App() {
      const [query, setQuery] = useState('');
      const [sortKey, setSortKey] = useState('name');
      const [page, setPage] = useState(0);
      const PAGE_SIZE = 3;

      // The displayed rows live in STATE, kept in sync by an effect
      // (project 09's sin, at scale) — and the sort MUTATES:
      const [rows, setRows] = useState(PEOPLE);

      useEffect(() => {
        let result = PEOPLE.filter((p) =>
          p.name.toLowerCase().includes(query.toLowerCase()));
        result.sort((a, b) => (a[sortKey] < b[sortKey] ? -1 : 1));
        // BUG 1: sort() mutated `result`, which is fine... but an
        // earlier version sorted PEOPLE directly and scrambled the
        // source for every other feature (js#26's classic).
        setRows(result.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE));
      }, [query, sortKey, page]);
      // BUG 2 (live): search for "a", go to page 2, then clear the
      // search. The page number stayed at 2 — but the unfiltered
      // list has different page boundaries, and stale interactions
      // like this show the WRONG rows or an empty page. Filter,
      // sort, and pagination all update the same `rows` state from
      // different directions, and nobody owns the interaction rules.

      const totalPages = Math.ceil(
        PEOPLE.filter((p) => p.name.toLowerCase().includes(query.toLowerCase())).length / PAGE_SIZE,
      ); // ...the filter logic, DUPLICATED, because the effect ate the intermediate

      return (
        <div>
          <h1>People</h1>
          <input placeholder="search names..." value={query}
                 onChange={(e) => setQuery(e.target.value)} />
          <table>
            <thead>
              <tr>
                <th onClick={() => setSortKey('name')}>name</th>
                <th onClick={() => setSortKey('role')}>role</th>
                <th onClick={() => setSortKey('score')}>score</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((p) => (
                <tr key={p.name}><td>{p.name}</td><td>{p.role}</td><td>{p.score}</td></tr>
              ))}
            </tbody>
          </table>
          <p>
            <button disabled={page === 0} onClick={() => setPage(page - 1)}>prev</button>
            {' '}page {page + 1} of {Math.max(totalPages, 1)}{' '}
            <button disabled={page >= totalPages - 1} onClick={() => setPage(page + 1)}>next</button>
          </p>
          <p style={{ color: '#666', fontSize: 14 }}>
            Try: search "a", click to page 2, clear the search — stale
            page state, wrong rows. The pipeline (filter, sort, page)
            exists only as an effect's side-effects on one state blob.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

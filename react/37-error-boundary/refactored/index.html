<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 37 — error boundaries (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .widget { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
          .fallback { border-color: #c33; color: #c33; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, Component } = React;

    // THE ERROR BOUNDARY — the one place class components are still
    // required (there is no hook for componentDidCatch). ~20 lines,
    // written once per app, used everywhere.
    class ErrorBoundary extends Component {
      state = { error: null };

      static getDerivedStateFromError(error) {
        return { error }; // render the fallback on the next pass
      }

      componentDidCatch(error, info) {
        // the reporting hook: send to your error tracker here
        console.error('Boundary caught:', error.message, info.componentStack);
      }

      render() {
        if (this.state.error) {
          return (
            <div className="widget fallback">
              ⚠️ {this.props.label ?? 'This section'} failed to load.
              <button
                style={{ marginLeft: 8 }}
                onClick={() => this.setState({ error: null })}
              >
                retry
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function WeatherWidget() {
      return <div className="widget">☀️ 22°C, sunny</div>;
    }

    function StockWidget({ portfolio }) {
      // same bug, same widget — unchanged on purpose
      return (
        <div className="widget">
          📈 top holding: {portfolio.positions[0].symbol}
        </div>
      );
    }

    function NewsWidget() {
      return <div className="widget">📰 Nothing bad happened today.</div>;
    }

    function App() {
      const [portfolio, setPortfolio] = useState({
        positions: [{ symbol: 'ACME' }],
      });

      return (
        <div>
          <h1>Dashboard</h1>
          <button onClick={() => setPortfolio({})}>
            simulate the empty-portfolio user
          </button>
          <button onClick={() => setPortfolio({ positions: [{ symbol: 'ACME' }] })}>
            fix the data
          </button>

          {/* one boundary PER INDEPENDENT REGION: a widget's crash
              is contained to its own card */}
          <ErrorBoundary label="Weather"><WeatherWidget /></ErrorBoundary>
          <ErrorBoundary label="Stocks"><StockWidget portfolio={portfolio} /></ErrorBoundary>
          <ErrorBoundary label="News"><NewsWidget /></ErrorBoundary>

          <p style={{ color: '#666', fontSize: 14 }}>
            Click "simulate": the stocks card shows a contained
            failure message; weather and news live on. Click "fix the
            data", then "retry": the widget comes back. The bug in
            StockWidget still deserves fixing (js#30: don't hide
            errors!) — componentDidCatch is where it gets REPORTED.
            Boundaries are blast doors, not band-aids.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 08 — duplicated sibling state (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A currency converter: type dollars in one box, see euros in the
    // other. Each box keeps ITS OWN copy of the amount.
    const RATE = 0.92; // USD -> EUR

    function DollarsBox() {
      const [dollars, setDollars] = useState('10');
      return (
        <div className="box">
          <h3>USD</h3>
          <input value={dollars} onChange={(e) => setDollars(e.target.value)} />
        </div>
      );
    }

    function EurosBox() {
      const [euros, setEuros] = useState('9.20');
      return (
        <div className="box">
          <h3>EUR</h3>
          <input value={euros} onChange={(e) => setEuros(e.target.value)} />
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1>Currency converter</h1>
          <DollarsBox />
          <EurosBox />
          <p>
            Type in the USD box... and the EUR box doesn't move. Of
            course it doesn't: <em>each sibling owns a private copy of
            what is conceptually ONE value</em> (the amount). Siblings
            can't reach each other's state — state only flows DOWN.
            The initial values even agree (10 / 9.20) — hand-computed,
            and instantly stale after the first keystroke.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

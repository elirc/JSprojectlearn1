<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 08 — lifted state (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const RATE = 0.92; // USD -> EUR

    // The child is now STATELESS: it displays a value and reports
    // changes. It doesn't know or care what currency it is — that's
    // all props. (Compare project 07: this is a controlled COMPONENT,
    // the same contract as a controlled input, one level up.)
    function CurrencyBox({ label, amount, onAmountChange }) {
      return (
        <div className="box">
          <h3>{label}</h3>
          <input value={amount} onChange={(e) => onAmountChange(e.target.value)} />
        </div>
      );
    }

    function App() {
      // ONE piece of state, owned by the closest common parent:
      // the amount, stored in ONE currency. The other currency is
      // DERIVED — never stored, so never stale (project 09).
      const [dollars, setDollars] = useState('10');

      const euros = format(Number(dollars) * RATE);

      function handleEurosChange(newEuros) {
        // editing the derived box = updating the source of truth
        setDollars(format(Number(newEuros) / RATE));
      }

      function format(n) {
        return Number.isFinite(n) ? String(Math.round(n * 100) / 100) : '';
      }

      return (
        <div>
          <h1>Currency converter</h1>
          <CurrencyBox label="USD" amount={dollars} onAmountChange={setDollars} />
          <CurrencyBox label="EUR" amount={euros} onAmountChange={handleEurosChange} />
          <p>
            Type in either box — both stay in sync, because there is
            only ONE amount. The boxes are two VIEWS of it.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

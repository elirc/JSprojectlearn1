<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 36 — controlled component API (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .star { cursor: pointer; font-size: 28px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // CONTROLLED: the widget owns NO state. It displays `value` and
    // reports wishes via `onChange` — the exact contract of a native
    // <input> (project 07), which is why it composes with everything.
    function StarRating({ value, onChange }) {
      return (
        <span>
          {[1, 2, 3, 4, 5].map((n) => (
            <span key={n} className="star" onClick={() => onChange(n)}>
              {n <= value ? '★' : '☆'}
            </span>
          ))}
        </span>
      );
    }

    function App() {
      const [rating, setRating] = useState(3);

      return (
        <div>
          <h1>Review</h1>
          <p>
            <StarRating value={rating} onChange={setRating} />
            {' '}your rating: {rating}
          </p>

          {/* reset works: one truth, and this button writes it */}
          <button onClick={() => setRating(0)}>reset rating</button>

          {/* two synced widgets: trivially, because BOTH render the
              same state. There's no copy to drift: */}
          <p>
            the same rating, elsewhere on the page:{' '}
            <StarRating value={rating} onChange={setRating} />
          </p>

          {/* and policy stays with the OWNER, where it belongs —
              e.g. cap the rating without touching the widget: */}
          <p>
            capped at 4 for free users:{' '}
            <StarRating value={rating} onChange={(n) => setRating(Math.min(n, 4))} />
          </p>

          <p style={{ color: '#666', fontSize: 14 }}>
            One source of truth; the widget is a pure view of it.
            (If you ALSO want a zero-config mode for casual callers,
            the standard move is dual-mode: use internal state only
            when no `value` prop is given — exactly how native inputs
            treat value vs defaultValue. Build the controlled core
            first; the uncontrolled shell is sugar over it.)
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 25 — useInterval (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SLIDES = ['🌅 sunrise', '🏔 mountain', '🌊 ocean', '🌲 forest'];

    // ==== THE HOOK (Dan Abramov's classic useInterval) ============
    // The problem: the interval wants ONE long-lived timer, but the
    // callback wants the LATEST render's world. Solution: split the
    // two lifetimes.
    //   - a ref carries the latest callback (updated every render —
    //     refs are the mutable box that survives renders, project 26)
    //   - the interval effect deps ONLY on delay, and its tick reads
    //     the callback through the ref
    // Result: timer restarts only when the SPEED changes; the tick
    // always sees fresh state. `delay: null` pauses — declaratively.
    function useInterval(callback, delay) {
      const savedCallback = useRef(callback);

      useEffect(() => {
        savedCallback.current = callback; // always the newest closure
      });

      useEffect(() => {
        if (delay === null) return; // paused: no interval at all
        const id = setInterval(() => savedCallback.current(), delay);
        return () => clearInterval(id);
      }, [delay]);
    }

    function App() {
      const [index, setIndex] = useState(0);
      const [delay, setDelay] = useState(1000);
      const [paused, setPaused] = useState(false);

      useInterval(() => {
        setIndex((i) => (i + 1) % SLIDES.length);
      }, paused ? null : delay);

      return (
        <div>
          <h1>Slideshow</h1>
          <h2 style={{ fontSize: 40 }}>{SLIDES[index]}</h2>
          <p>
            speed: {delay}ms
            <input type="range" min="200" max="2000" step="100" value={delay}
                   onChange={(e) => setDelay(Number(e.target.value))} />
          </p>
          <button onClick={() => setPaused(!paused)}>
            {paused ? 'resume' : 'pause'}
          </button>
          <p style={{ color: '#666', fontSize: 14 }}>
            All slides cycle, the speed slider works live, and pause is
            just passing <code>null</code> as the delay — the hook
            reads like a declaration: "run this every N ms (or don't)".
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

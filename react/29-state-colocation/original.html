<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 29 — state too high (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .panel { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    let dashRenders = 0, chartRenders = 0, tableRenders = 0;

    function slowdown(ms) {
      const until = performance.now() + ms;
      while (performance.now() < until) {}
    }

    // Heavy siblings (not memo'd — like most real components):
    function BigChart() {
      chartRenders++;
      slowdown(15);
      return <div className="panel">📈 BigChart (renders: {chartRenders})</div>;
    }

    function BigTable() {
      tableRenders++;
      slowdown(15);
      return <div className="panel">🗃 BigTable (renders: {tableRenders})</div>;
    }

    // The habit: "state goes at the top." EVERY piece of state in
    // this app lives in Dashboard — including the search box's text,
    // which only the search box cares about.
    function Dashboard() {
      dashRenders++;
      const [searchText, setSearchText] = useState('');

      return (
        <div>
          <h1>Dashboard (renders: {dashRenders})</h1>
          <div className="panel">
            <input
              placeholder="type here — the WHOLE APP re-renders per keystroke"
              value={searchText}
              onChange={(e) => setSearchText(e.target.value)}
            />
            {searchText && <p>searching for: {searchText}</p>}
          </div>
          <BigChart />
          <BigTable />
          <p style={{ color: '#666', fontSize: 14 }}>
            Type a sentence: every keystroke sets state on Dashboard,
            so Dashboard re-renders, so BOTH heavy children re-render
            (~30ms/keystroke). Watch all three counters march in
            lockstep. The chart and table don't read searchText at
            all — they're billed for it anyway, because state lives
            above them.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>

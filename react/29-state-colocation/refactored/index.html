<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 29 — colocated state (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .panel { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    let dashRenders = 0, chartRenders = 0, tableRenders = 0, searchRenders = 0;

    function slowdown(ms) {
      const until = performance.now() + ms;
      while (performance.now() < until) {}
    }

    function BigChart() {
      chartRenders++;
      slowdown(15);
      return <div className="panel">📈 BigChart (renders: {chartRenders})</div>;
    }

    function BigTable() {
      tableRenders++;
      slowdown(15);
      return <div className="panel">🗃 BigTable (renders: {tableRenders})</div>;
    }

    // THE MOVE: push the state DOWN into the only component that
    // reads it. A state change re-renders its owner and below —
    // so make the owner as small as possible.
    function SearchBox() {
      searchRenders++;
      const [searchText, setSearchText] = useState('');

      return (
        <div className="panel">
          <input
            placeholder="type here — only this box re-renders"
            value={searchText}
            onChange={(e) => setSearchText(e.target.value)}
          />
          {searchText && <p>searching for: {searchText}</p>}
          <small>SearchBox renders: {searchRenders}</small>
        </div>
      );
    }

    function Dashboard() {
      dashRenders++;
      return (
        <div>
          <h1>Dashboard (renders: {dashRenders})</h1>
          <SearchBox />
          <BigChart />
          <BigTable />
          <p style={{ color: '#666', fontSize: 14 }}>
            Type a sentence: only SearchBox's counter moves. No memo,
            no useCallback — the renders were removed STRUCTURALLY, by
            making the state's owner small. Colocation is the
            zero-cost version of project 28, and the first thing to
            try. (Lift state up when several components need it —
            project 08; push it down when only one does. Both are the
            same rule: state lives with exactly its readers.)
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>

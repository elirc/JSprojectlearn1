<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 60 — expense splitter, decisions extracted (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
    td, th { border-bottom: 1px solid #eee; padding: 6px; text-align: left; font-size: 15px; }
    .owed { color: #1b5e20; } .owes { color: #8b1a1a; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
    input, select { padding: 6px; font: inherit; }
    .error { color: #8b1a1a; font-size: 14px; }
    pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px;
          font-size: 12px; overflow-x: auto; }
    .note { color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ==== THE DECISIONS — a copy of split.js, which is unit-tested in
    // Node (browsers can't import modules from file:// pages; a bundler
    // would import it). Zero React below this comment, and money is
    // integer cents everywhere (js#32).
    function parseCents(text) {
      const cleaned = String(text).trim().replace(/[$,\s]/g, '');
      if (cleaned === '' || cleaned === '-' || cleaned === '.') return null;
      if (!/^-?\d*(\.\d{0,2})?$/.test(cleaned)) return null;
      const negative = cleaned.startsWith('-');
      const [whole, frac = ''] = cleaned.replace('-', '').split('.');
      const cents = Number(whole || '0') * 100 + Number((frac + '00').slice(0, 2));
      return negative ? -cents : cents;
    }

    function formatCents(cents) {
      const sign = cents < 0 ? '-' : '';
      const abs = Math.abs(cents);
      return `${sign}$${Math.floor(abs / 100)}.${String(abs % 100).padStart(2, '0')}`;
    }

    function splitEvenly(totalCents, n) {
      if (n <= 0) return [];
      const base = Math.trunc(totalCents / n);
      const remainder = totalCents - base * n;
      const step = remainder >= 0 ? 1 : -1;
      const extras = Math.abs(remainder);
      return Array.from({ length: n }, (_, i) => base + (i < extras ? step : 0));
    }

    function computeBalances(people, expenses) {
      const balances = {};
      for (const person of people) balances[person.id] = 0;
      for (const expense of expenses) {
        if (!(expense.paidBy in balances)) continue;
        const participants = expense.participants.filter((id) => id in balances);
        if (participants.length === 0) continue;
        const shares = splitEvenly(expense.amountCents, participants.length);
        participants.forEach((id, i) => { balances[id] -= shares[i]; });
        balances[expense.paidBy] += expense.amountCents;
      }
      return balances;
    }

    function settle(balances) {
      const owing = Object.entries(balances).filter(([, c]) => c < 0)
        .map(([id, c]) => ({ id, cents: -c }))
        .sort((a, b) => b.cents - a.cents || a.id.localeCompare(b.id));
      const owed = Object.entries(balances).filter(([, c]) => c > 0)
        .map(([id, c]) => ({ id, cents: c }))
        .sort((a, b) => b.cents - a.cents || a.id.localeCompare(b.id));
      const transfers = [];
      let i = 0, j = 0;
      while (i < owing.length && j < owed.length) {
        const amount = Math.min(owing[i].cents, owed[j].cents);
        if (amount > 0) transfers.push({ from: owing[i].id, to: owed[j].id, cents: amount });
        owing[i].cents -= amount;
        owed[j].cents -= amount;
        if (owing[i].cents === 0) i++;
        if (owed[j].cents === 0) j++;
      }
      return transfers;
    }

    // ==== THE APP — holds state, renders, and dispatches. It contains
    // no arithmetic at all: search this component for a `+` or a `/`.
    const PEOPLE = [
      { id: 'ana', name: 'Ana' },
      { id: 'ben', name: 'Ben' },
      { id: 'cass', name: 'Cass' },
    ];
    const SEED = [
      { id: 'e1', description: 'Dinner', paidBy: 'ana', amountCents: 1000, participants: ['ana', 'ben', 'cass'] },
      { id: 'e2', description: 'Taxi', paidBy: 'ben', amountCents: 1750, participants: ['ana', 'ben'] },
      { id: 'e3', description: 'Coffee', paidBy: 'cass', amountCents: 7, participants: ['ana', 'ben', 'cass'] },
    ];

    function App() {
      const [expenses, setExpenses] = useState(SEED);
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState('');
      const [paidBy, setPaidBy] = useState('ana');
      const [error, setError] = useState(null);

      // Derived on every render (project 09). Nothing to keep in sync,
      // nothing to forget to recompute, no third copy of the maths.
      const balances = computeBalances(PEOPLE, expenses);
      const transfers = settle(balances);

      function addExpense() {
        const amountCents = parseCents(amount);      // the decision
        if (amountCents === null || amountCents <= 0) {
          setError('Enter an amount like 12.50');    // the app's response
          return;
        }
        setExpenses([...expenses, {
          id: 'e' + Math.random().toString(36).slice(2, 7),
          description: description.trim() || 'Something',
          paidBy,
          amountCents,
          participants: PEOPLE.map((p) => p.id),
        }]);
        setDescription('');
        setAmount('');
        setError(null);
      }

      const nameOf = (id) => PEOPLE.find((p) => p.id === id).name;
      const totalOwed = Object.values(balances).filter((c) => c > 0).reduce((a, b) => a + b, 0);
      const totalMoved = transfers.reduce((a, t) => a + t.cents, 0);
      const drift = Object.values(balances).reduce((a, b) => a + b, 0);

      return (
        <div>
          <h1>Split the bill</h1>
          <p className="note">
            The same three expenses as the original. Ana owes
            <b> $2.12</b> here and $2.10 there; the books balance to
            exactly zero; the transfers move exactly what is owed. Try
            entering <code>ten</code> as an amount.
          </p>

          <table>
            <thead><tr><th>what</th><th>who paid</th><th>how much</th><th></th></tr></thead>
            <tbody>
              {expenses.map((e) => (
                <tr key={e.id}>
                  <td>{e.description}</td>
                  <td>{nameOf(e.paidBy)}</td>
                  <td>{formatCents(e.amountCents)}</td>
                  <td>
                    <button onClick={() => setExpenses(expenses.filter((x) => x.id !== e.id))}>
                      x
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <fieldset>
            <legend>add an expense (split between everyone)</legend>
            <input placeholder="what" value={description}
                   onChange={(e) => setDescription(e.target.value)} />{' '}
            <input placeholder="12.50" value={amount}
                   onChange={(e) => { setAmount(e.target.value); setError(null); }} />{' '}
            <select value={paidBy} onChange={(e) => setPaidBy(e.target.value)}>
              {PEOPLE.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>{' '}
            <button onClick={addExpense}>add</button>
            {error && <div className="error">{error}</div>}
          </fieldset>

          <h3>Balances</h3>
          <table>
            <tbody>
              {PEOPLE.map((p) => (
                <tr key={p.id}>
                  <td>{p.name}</td>
                  <td className={balances[p.id] >= 0 ? 'owed' : 'owes'}>
                    {balances[p.id] >= 0 ? 'is owed ' : 'owes '}
                    {formatCents(Math.abs(balances[p.id]))}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <h3>Settle up</h3>
          {transfers.length === 0
            ? <p className="note">nothing to settle</p>
            : <ul>{transfers.map((t, i) => (
                <li key={i}>
                  {nameOf(t.from)} pays {nameOf(t.to)} {formatCents(t.cents)}
                </li>
              ))}</ul>}

          <h3>Audit</h3>
          <pre>{
`balances (cents) : ${JSON.stringify(balances)}
they sum to      : ${drift}
total owed       : ${formatCents(totalOwed)}
total moved      : ${formatCents(totalMoved)}
transfers        : ${transfers.length} (at most ${PEOPLE.length - 1})`
          }</pre>
          <p className="note">
            Zero drift, and the totals match — not because someone was
            careful in a handler, but because <code>splitEvenly</code>
            hands out the remainder cent by cent and 5000 cases in
            <code> split.test.js</code> say so. The whole component
            below the copied rules contains no arithmetic: it renders
            what the pure functions decided, and its handlers only
            describe what happened.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 60 — expense splitter, math in the handlers (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
    td, th { border-bottom: 1px solid #eee; padding: 6px; text-align: left; font-size: 15px; }
    .owed { color: #1b5e20; } .owes { color: #8b1a1a; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
    input, select { padding: 6px; font: inherit; }
    pre { background: #111; color: #0f0; padding: 10px; border-radius: 6px;
          font-size: 12px; overflow-x: auto; }
    .note { color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // An expense splitter that works. Ana, Ben and Cass go out; the app
    // says who owes whom. Every number on screen was computed inside an
    // event handler, in dollars-as-floats, and stored in state.
    //
    // It is correct today. It is also untestable, and it is losing money.
    const PEOPLE = [
      { id: 'ana', name: 'Ana' },
      { id: 'ben', name: 'Ben' },
      { id: 'cass', name: 'Cass' },
    ];
    const SEED = [
      { id: 'e1', description: 'Dinner', paidBy: 'ana', amount: 10, participants: ['ana', 'ben', 'cass'] },
      { id: 'e2', description: 'Taxi', paidBy: 'ben', amount: 17.5, participants: ['ana', 'ben'] },
      { id: 'e3', description: 'Coffee', paidBy: 'cass', amount: 0.07, participants: ['ana', 'ben', 'cass'] },
    ];

    function App() {
      const [expenses, setExpenses] = useState(SEED);
      const [balances, setBalances] = useState(null);
      const [transfers, setTransfers] = useState([]);
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState('');
      const [paidBy, setPaidBy] = useState('ana');

      function addExpense() {
        const next = [...expenses, {
          id: 'e' + Math.random().toString(36).slice(2, 7),
          description,
          paidBy,
          amount: parseFloat(amount),          // "abc" -> NaN, straight into the books
          participants: PEOPLE.map((p) => p.id),
        }];
        setExpenses(next);
        setDescription('');
        setAmount('');

        // ---- the maths, inline ----------------------------------------
        const bal = {};
        PEOPLE.forEach((p) => { bal[p.id] = 0; });
        next.forEach((e) => {
          const share = Number((e.amount / e.participants.length).toFixed(2));
          e.participants.forEach((id) => { bal[id] -= share; });
          bal[e.paidBy] += e.amount;
        });
        const owing = Object.keys(bal).filter((id) => bal[id] < 0)
          .map((id) => ({ id, amt: -bal[id] })).sort((a, b) => b.amt - a.amt);
        const owed = Object.keys(bal).filter((id) => bal[id] > 0)
          .map((id) => ({ id, amt: bal[id] })).sort((a, b) => b.amt - a.amt);
        const moves = [];
        let i = 0, j = 0;
        while (i < owing.length && j < owed.length) {
          const amt = Math.min(owing[i].amt, owed[j].amt);
          moves.push({ from: owing[i].id, to: owed[j].id, amt });
          owing[i].amt -= amt; owed[j].amt -= amt;
          if (owing[i].amt === 0) i++;
          if (owed[j].amt === 0) j++;
        }
        setBalances(bal);
        setTransfers(moves);
      }

      function deleteExpense(id) {
        const next = expenses.filter((e) => e.id !== id);
        setExpenses(next);

        // ---- the same maths, inline, again ----------------------------
        const bal = {};
        PEOPLE.forEach((p) => { bal[p.id] = 0; });
        next.forEach((e) => {
          const share = Number((e.amount / e.participants.length).toFixed(2));
          e.participants.forEach((pid) => { bal[pid] -= share; });
          bal[e.paidBy] += e.amount;
        });
        const owing = Object.keys(bal).filter((k) => bal[k] < 0)
          .map((k) => ({ id: k, amt: -bal[k] })).sort((a, b) => b.amt - a.amt);
        const owed = Object.keys(bal).filter((k) => bal[k] > 0)
          .map((k) => ({ id: k, amt: bal[k] })).sort((a, b) => b.amt - a.amt);
        const moves = [];
        let i = 0, j = 0;
        while (i < owing.length && j < owed.length) {
          const amt = Math.min(owing[i].amt, owed[j].amt);
          moves.push({ from: owing[i].id, to: owed[j].id, amt });
          owing[i].amt -= amt; owed[j].amt -= amt;
          if (owing[i].amt === 0) i++;
          if (owed[j].amt === 0) j++;
        }
        setBalances(bal);
        setTransfers(moves);
      }

      // Nothing is computed until a handler runs, so the first render
      // needs... the same maths a THIRD time.
      const seeded = (() => {
        const bal = {};
        PEOPLE.forEach((p) => { bal[p.id] = 0; });
        SEED.forEach((e) => {
          const share = Number((e.amount / e.participants.length).toFixed(2));
          e.participants.forEach((id) => { bal[id] -= share; });
          bal[e.paidBy] += e.amount;
        });
        const owing = Object.keys(bal).filter((k) => bal[k] < 0)
          .map((k) => ({ id: k, amt: -bal[k] })).sort((a, b) => b.amt - a.amt);
        const owed = Object.keys(bal).filter((k) => bal[k] > 0)
          .map((k) => ({ id: k, amt: bal[k] })).sort((a, b) => b.amt - a.amt);
        const moves = [];
        let i = 0, j = 0;
        while (i < owing.length && j < owed.length) {
          const amt = Math.min(owing[i].amt, owed[j].amt);
          moves.push({ from: owing[i].id, to: owed[j].id, amt });
          owing[i].amt -= amt; owed[j].amt -= amt;
          if (owing[i].amt === 0) i++;
          if (owed[j].amt === 0) j++;
        }
        return { bal, moves };
      })();

      const shown = balances || seeded.bal;
      const shownMoves = balances ? transfers : seeded.moves;

      const nameOf = (id) => PEOPLE.find((p) => p.id === id).name;
      const paidTotal = Object.values(shown).filter((v) => v > 0).reduce((a, b) => a + b, 0);
      const movedTotal = shownMoves.reduce((a, t) => a + t.amt, 0);

      return (
        <div>
          <h1>Split the bill</h1>
          <p className="note">
            Read the audit box at the bottom before touching anything:
            the balances sum to <b>0.02</b> instead of 0, and the
            transfers move $5.38 to settle $5.40. Two cents have left the
            group. Then try entering <code>ten</code> as an amount and
            watch every number become NaN.
          </p>

          <table>
            <thead><tr><th>what</th><th>who paid</th><th>how much</th><th></th></tr></thead>
            <tbody>
              {expenses.map((e) => (
                <tr key={e.id}>
                  <td>{e.description}</td>
                  <td>{nameOf(e.paidBy)}</td>
                  <td>${e.amount.toFixed(2)}</td>
                  <td><button onClick={() => deleteExpense(e.id)}>x</button></td>
                </tr>
              ))}
            </tbody>
          </table>

          <fieldset>
            <legend>add an expense (split between everyone)</legend>
            <input placeholder="what" value={description}
                   onChange={(e) => setDescription(e.target.value)} />{' '}
            <input placeholder="12.50" value={amount}
                   onChange={(e) => setAmount(e.target.value)} />{' '}
            <select value={paidBy} onChange={(e) => setPaidBy(e.target.value)}>
              {PEOPLE.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>{' '}
            <button onClick={addExpense}>add</button>
          </fieldset>

          <h3>Balances</h3>
          <table>
            <tbody>
              {PEOPLE.map((p) => (
                <tr key={p.id}>
                  <td>{p.name}</td>
                  <td className={shown[p.id] >= 0 ? 'owed' : 'owes'}>
                    {shown[p.id] >= 0 ? 'is owed ' : 'owes '}
                    ${Math.abs(shown[p.id]).toFixed(2)}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <h3>Settle up</h3>
          {shownMoves.length === 0
            ? <p className="note">nothing to settle</p>
            : <ul>{shownMoves.map((t, i) => (
                <li key={i}>{nameOf(t.from)} pays {nameOf(t.to)} ${t.amt.toFixed(2)}</li>
              ))}</ul>}

          <h3>Audit</h3>
          <pre>{
`raw balances : ${JSON.stringify(shown)}
they sum to  : ${Object.values(shown).reduce((a, b) => a + b, 0)}
total owed   : ${paidTotal.toFixed(2)}
total moved  : ${movedTotal.toFixed(2)}`
          }</pre>
          <p className="note">
            That sum should be exactly 0. Every uneven split rounds each
            share down and hands the payer the full amount, so a cent
            disappears per rounding — and the transfers move less money
            than is owed. Nobody will spot it; everybody will be wrong.
            You cannot write a test for any of this, because all of it
            lives inside two event handlers that need a click to run.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

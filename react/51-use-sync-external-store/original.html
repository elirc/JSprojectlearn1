<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 51 — hand-rolled store subscriptions (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .box { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 6px 0; }
          .num { font-size: 30px; font-weight: bold; }
          .bad { color: #b00; font-weight: bold; } .ok { color: #070; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==== AN EXTERNAL STORE =======================================
    // `count` lives in a plain module variable — OUTSIDE React, the
    // way a Redux store, a websocket cache, or navigator.onLine does.
    // React cannot see it change. The only way in is subscribe().
    const listeners = new Set();
    let count = 0;

    const store = {
      getSnapshot: () => count,
      subscribe(listener) {
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
      listenerCount: () => listeners.size,
      update(next) {
        count = typeof next === 'function' ? next(count) : next;
        listeners.forEach((listener) => listener());
      },
      burst() {
        // Five updates as fast as the browser will take them.
        for (let i = 0; i < 5; i++) setTimeout(() => store.update((c) => c + 1), 0);
      },
    };

    // Instrumentation only: each panel records the number it actually
    // painted, so the status line below can tell you, on the page,
    // whether the two panels are showing the same thing right now.
    const painted = { subscribed: count, direct: count };

    // ==== THE HAND-ROLLED SUBSCRIPTION ============================
    // useState + useEffect: the obvious way, and the wrong one. This
    // component keeps a COPY of the store's value in React state and
    // refreshes the copy from an effect — and effects run AFTER the
    // browser paints, so the copy is always at least one paint behind
    // the module variable it is copying.
    function useStoreValue() {
      const [value, setValue] = useState(store.getSnapshot());
      useEffect(() => {
        const unsubscribe = store.subscribe(() => setValue(store.getSnapshot()));
        return unsubscribe;
      }, []);
      return value;
    }

    function SubscribedPanel() {
      const value = useStoreValue();          // React's cached copy
      painted.subscribed = value;
      return (
        <div className="box">
          Subscribed panel — useState + useEffect copy
          <div className="num">{value}</div>
        </div>
      );
    }

    function DirectPanel() {
      // The other half of the tear: this panel reads the mutable
      // module variable DURING render and never subscribes. So it
      // re-renders only when its parent happens to re-render, and in
      // between it keeps showing a number the store left behind.
      const value = store.getSnapshot();
      painted.direct = value;
      return (
        <div className="box">
          Direct-read panel — store.getSnapshot() during render
          <div className="num">{value}</div>
        </div>
      );
    }

    function LeakyPanel() {
      const [value, setValue] = useState(store.getSnapshot());
      useEffect(() => {
        // BUG: subscribes and returns nothing. React has no cleanup
        // to call, so unmounting this panel leaves the listener in
        // the Set forever — still woken on every single update, still
        // pushing state into a component that no longer exists.
        store.subscribe(() => setValue(store.getSnapshot()));
      }, []);
      return (
        <div className="box">
          Leaky panel — subscribes, never unsubscribes
          <div className="num">{value}</div>
        </div>
      );
    }

    function Status({ showLeaky }) {
      useStoreValue();                        // so this line stays live
      const agree = painted.subscribed === painted.direct;

      // Instrumentation: listeners are added in a commit-time effect,
      // so read the count AFTER each commit. Setting the same number
      // twice bails out, so this settles instead of looping.
      const [live, setLive] = useState(store.listenerCount());
      useEffect(() => { setLive(store.listenerCount()); });

      // Components that are mounted AND subscribed right now:
      // SubscribedPanel, this Status line, and LeakyPanel if visible.
      const expected = 2 + (showLeaky ? 1 : 0);
      if (live > expected) {
        console.warn(`LEAK: ${live} listeners still subscribed for ${expected} mounted subscribers`);
      }

      return (
        <div>
          <p className={agree ? 'ok' : 'bad'}>
            panels agree?{' '}
            {agree
              ? '✅ yes'
              : `❌ no — subscribed panel shows ${painted.subscribed}, direct panel shows ${painted.direct}`}
          </p>
          <p className={live > expected ? 'bad' : 'ok'}>
            live listeners: {live} — mounted subscribers: {expected}
            {live > expected ? ' ← LEAK (also logged to the console)' : ''}
          </p>
        </div>
      );
    }

    function App() {
      const [showLeaky, setShowLeaky] = useState(true);
      const [, forceRender] = useState(0);    // App does NOT subscribe

      return (
        <div>
          <h1>Live counter</h1>
          <button onClick={() => store.update((c) => c + 1)}>+1</button>{' '}
          <button onClick={() => store.burst()}>burst: 5 rapid updates</button>{' '}
          <button onClick={() => forceRender((n) => n + 1)}>re-render App</button>{' '}
          <button onClick={() => setShowLeaky((v) => !v)}>
            {showLeaky ? 'hide' : 'show'} leaky panel
          </button>

          <SubscribedPanel />
          <DirectPanel />
          {showLeaky && <LeakyPanel />}
          <Status showLeaky={showLeaky} />

          <p style={{ color: '#666', fontSize: 14 }}>
            One store, two readers, two answers. Press "+1" or "burst"
            and the page tears: the subscribed panel climbs while the
            direct-read panel sits on a number the store abandoned —
            it never subscribed, so nothing tells it to re-render.
            Press "re-render App" and it silently catches up, which is
            worse: correctness by luck. Then hide the leaky panel and
            watch the listener count refuse to come back down — that
            effect returned no cleanup, so React had nothing to call
            on unmount (project 18), and a dead component is still
            woken on every update.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

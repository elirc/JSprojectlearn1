<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 42 — view in state (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          nav button { margin-right: 8px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const ARTICLES = [
      { id: 'keys', title: 'Why keys matter' },
      { id: 'effects', title: 'Effects are for syncing' },
      { id: 'state', title: 'Derive, don\'t store' },
    ];

    // "Routing": which view to show lives in ordinary state.
    function App() {
      const [view, setView] = useState('home');       // 'home' | 'articles' | 'article'
      const [articleId, setArticleId] = useState(null);

      function openArticle(id) {
        setArticleId(id);
        setView('article');
      }

      return (
        <div>
          <nav>
            <button onClick={() => setView('home')}>Home</button>
            <button onClick={() => setView('articles')}>Articles</button>
          </nav>

          {view === 'home' && <h1>Welcome!</h1>}

          {view === 'articles' && (
            <div>
              <h1>Articles</h1>
              <ul>
                {ARTICLES.map((a) => (
                  <li key={a.id}>
                    <a href="#" onClick={(e) => { e.preventDefault(); openArticle(a.id); }}>
                      {a.title}
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {view === 'article' && (
            <div>
              <h1>{ARTICLES.find((a) => a.id === articleId)?.title}</h1>
              <p>Imagine profound content here.</p>
              <button onClick={() => setView('articles')}>back</button>
            </div>
          )}

          <p style={{ color: '#666', fontSize: 14 }}>
            Navigate to an article, then:
            (1) press F5 — you're back on Home; the app forgot where
            you were, because view state dies with the page.
            (2) press the browser BACK button — you leave the site
            entirely; back/forward know nothing about these "pages".
            (3) try to send a friend a link to an article — you can't;
            the address bar says the same thing on every screen.
            Screens that users think of as PLACES deserve addresses.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

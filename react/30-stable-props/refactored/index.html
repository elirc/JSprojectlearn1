<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 30 — stable props (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .panel { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback, memo } = React;

    let chartRenders = 0;

    function slowdown(ms) {
      const until = performance.now() + ms;
      while (performance.now() < until) {}
    }

    const Chart = memo(function Chart({ series, options, onZoom }) {
      chartRenders++;
      slowdown(20);
      return (
        <div className="panel">
          📈 Chart of [{series.join(', ')}] ({options.color}, log={String(options.logScale)})
          <br /><small>chart renders: {chartRenders}</small>
        </div>
      );
    });

    // Fix 1 — truly constant values: HOIST them out of the component.
    // Module scope renders zero times; nothing is fresher than never
    // rebuilt. Always the first choice when the value doesn't depend
    // on props or state.
    const SERIES = [3, 1, 4, 1, 5];
    const CHART_OPTIONS = { color: 'blue', logScale: false };

    function App() {
      const [tick, setTick] = useState(0);
      const [color, setColor] = useState('blue');

      // Fix 2 — values built FROM state: useMemo keeps the reference
      // until the inputs actually change (project 27's second job):
      const options = useMemo(
        () => ({ ...CHART_OPTIONS, color }),
        [color],
      );

      // Fix 3 — functions: useCallback (project 28):
      const handleZoom = useCallback(() => console.log('zoom'), []);

      return (
        <div>
          <h1>Metrics (tick: {tick})</h1>
          <button onClick={() => setTick(tick + 1)}>
            tick (unrelated to the chart)
          </button>{' '}
          <button onClick={() => setColor(color === 'blue' ? 'red' : 'blue')}>
            change chart color (related!)
          </button>

          <Chart series={SERIES} options={options} onZoom={handleZoom} />

          <p style={{ color: '#666', fontSize: 14 }}>
            Click "tick" repeatedly: the chart counter doesn't move.
            Click "change color": it re-renders exactly once — a real
            change, honored. The toolkit by prop type:
            constants → hoist to module scope ·
            state-derived objects/arrays → useMemo ·
            functions → useCallback.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

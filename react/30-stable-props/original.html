<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 30 — inline props break memo (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .panel { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, memo } = React;

    let chartRenders = 0;

    function slowdown(ms) {
      const until = performance.now() + ms;
      while (performance.now() < until) {}
    }

    // A heavy chart, correctly memo'd. Its author did everything right.
    const Chart = memo(function Chart({ series, options, onZoom }) {
      chartRenders++;
      slowdown(20);
      return (
        <div className="panel">
          📈 Chart of [{series.join(', ')}] ({options.color}, log={String(options.logScale)})
          <br /><small>chart renders: {chartRenders}</small>
        </div>
      );
    });

    function App() {
      const [tick, setTick] = useState(0); // unrelated state: a clock

      return (
        <div>
          <h1>Metrics (tick: {tick})</h1>
          <button onClick={() => setTick(tick + 1)}>
            tick (unrelated to the chart)
          </button>

          <Chart
            series={[3, 1, 4, 1, 5]}          // fresh ARRAY every render
            options={{ color: 'blue', logScale: false }}  // fresh OBJECT every render
            onZoom={() => console.log('zoom')} // fresh FUNCTION every render
          />
          {/* All three props are rebuilt per render. Their CONTENTS
              never change; their REFERENCES always do. memo compares
              references (Object.is) — so this memo has never once
              skipped a render. Click "tick": the chart's counter
              climbs with it, 20ms a pop.

              This is the memo-killer trio:
                arrays  [3,1,4]        -> new every render
                objects {color:'blue'} -> new every render
                arrows  () => ...      -> new every render
              None of them LOOK stateful. All of them are fresh. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 27 — expensive render (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A prime-number explorer with a notes field. Finding primes up
    // to N is genuinely expensive. Typing a note... recomputes them.
    function countPrimesUpTo(limit) {
      // deliberately naive so it's measurably slow (~hundreds of ms)
      let count = 0;
      for (let n = 2; n <= limit; n++) {
        let isPrime = true;
        for (let f = 2; f * f <= n; f++) {
          if (n % f === 0) { isPrime = false; break; }
        }
        if (isPrime) count++;
      }
      return count;
    }

    function App() {
      const [limit, setLimit] = useState(200000);
      const [notes, setNotes] = useState('');

      // Runs on EVERY render — including renders caused by typing
      // in the notes box, which has nothing to do with primes:
      const started = performance.now();
      const primeCount = countPrimesUpTo(limit);
      const tookMs = (performance.now() - started).toFixed(0);

      return (
        <div>
          <h1>Prime explorer</h1>
          <p>
            limit: {limit.toLocaleString()}
            <input type="range" min="10000" max="2000000" step="10000"
                   value={limit} onChange={(e) => setLimit(Number(e.target.value))} />
          </p>
          <p>{primeCount.toLocaleString()} primes (computed in {tookMs}ms this render)</p>

          <p>notes (type a sentence — feel every keystroke):</p>
          <textarea rows="3" cols="50" value={notes}
                    onChange={(e) => setNotes(e.target.value)} />
          <p style={{ color: '#666', fontSize: 14 }}>
            Every keystroke re-renders (correct! notes changed) and the
            render re-runs the prime count (WASTE — limit didn't
            change). Derive-in-render (project 09) is the right default,
            but this derivation costs ~{tookMs}ms, and the keyboard
            pays it.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

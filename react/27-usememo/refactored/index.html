<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 27 — useMemo (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function countPrimesUpTo(limit) {
      let count = 0;
      for (let n = 2; n <= limit; n++) {
        let isPrime = true;
        for (let f = 2; f * f <= n; f++) {
          if (n % f === 0) { isPrime = false; break; }
        }
        if (isPrime) count++;
      }
      return count;
    }

    function App() {
      const [limit, setLimit] = useState(200000);
      const [notes, setNotes] = useState('');
      const [computeCount, setComputeCount] = useState(0);

      // useMemo = derive-in-render (project 09) plus a cache keyed by
      // the deps: recompute only when `limit` changes; otherwise
      // reuse last render's answer. Same deps rule as useEffect —
      // everything the computation reads goes in the array.
      const primeCount = useMemo(() => {
        setTimeout(() => setComputeCount((c) => c + 1), 0); // count real runs
        return countPrimesUpTo(limit);
      }, [limit]);

      return (
        <div>
          <h1>Prime explorer</h1>
          <p>
            limit: {limit.toLocaleString()}
            <input type="range" min="10000" max="2000000" step="10000"
                   value={limit} onChange={(e) => setLimit(Number(e.target.value))} />
          </p>
          <p>
            {primeCount.toLocaleString()} primes
            (computed {computeCount} time{computeCount === 1 ? '' : 's'} total)
          </p>

          <p>notes (type freely — instant now):</p>
          <textarea rows="3" cols="50" value={notes}
                    onChange={(e) => setNotes(e.target.value)} />

          <p style={{ color: '#666', fontSize: 14 }}>
            Typing re-renders, but the memo sees `limit` unchanged and
            returns the cached count — watch "computed N times" stay
            put while you type, and tick up only when the slider moves.
          </p>
          <p style={{ color: '#666', fontSize: 14 }}>
            When NOT to useMemo: for the cheap stuff. Wrapping
            <code> items.filter(...)</code> over 20 rows adds
            complexity (and its own bookkeeping cost) to save
            microseconds. The workflow: derive plainly (project 09),
            and memoize the specific values that measurably hurt —
            it's js#27's memoize with deps instead of arguments as
            the cache key, one slot deep.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

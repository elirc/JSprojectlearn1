<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 52 — a modal in looks only (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .box { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 6px 0; }
          .row { margin: 8px 0; }
          /* A LOUD focus ring, on purpose: this project is about watching
             focus move. Never ship `outline: none` without a replacement. */
          :focus { outline: 3px solid #0a58ca; outline-offset: 2px; }
          .tracker { position: sticky; top: 0; background: #fffbe6;
                     border: 1px solid #e0c200; border-radius: 8px;
                     padding: 8px; margin-bottom: 10px; font-family: monospace; }
          .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); }
          .dialog { position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
                    width: 320px; background: #fff; border-radius: 8px; padding: 16px; }
          .dialog .x { float: right; border: none; background: none; font-size: 18px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A dialog that LOOKS right: dim backdrop, centred card, a heading,
    // two buttons. Every pixel is in place. It is also unusable without
    // a mouse — and invisible to a screen reader — because a dialog is
    // not a look, it's three jobs: focus, keyboard, and roles.

    // ==== The pedagogical device: what has focus right now? =========
    // Reads document.activeElement on every focusin, so you can WATCH
    // the tab order instead of trusting a description of it.
    function describeFocus() {
      const el = document.activeElement;
      if (!el || el === document.body) return '<body> (nothing focused)';
      const label = el.getAttribute('aria-label') || el.value || el.textContent || '';
      return `<${el.tagName.toLowerCase()}> ${label.trim().slice(0, 30)}`;
    }

    function FocusTracker() {
      const [focused, setFocused] = useState(describeFocus);
      useEffect(() => {
        const update = () => setFocused(describeFocus());
        document.addEventListener('focusin', update);
        return () => document.removeEventListener('focusin', update);
      }, []);
      return <div className="tracker">focus: {focused}</div>;
    }

    // ==== The page behind the "modal" ===============================
    function SettingsPanel({ onOpenDialog }) {
      return (
        <div className="box">
          <h2>Settings</h2>
          <div className="row">
            <label htmlFor="email">Email </label>
            <input id="email" type="email" defaultValue="ada@example.org" />
          </div>
          <div className="row">
            <label htmlFor="theme">Theme </label>
            <select id="theme" defaultValue="light">
              <option value="light">light</option>
              <option value="dark">dark</option>
            </select>
          </div>
          <div className="row">
            <button onClick={onOpenDialog}>Edit profile…</button>{' '}
            <button>Save settings</button>{' '}
            <a href="#help">Help</a>
          </div>
        </div>
      );
    }

    // ==== The "modal": a positioned div, and nothing more ===========
    // No role, no aria-modal, no aria-labelledby: assistive technology
    // is told nothing at all. It renders inline, so it inherits the
    // page's tab order rather than owning one.
    function FakeModal({ onClose }) {
      return (
        <div>
          <div className="backdrop" onClick={onClose}></div>
          <div className="dialog">
            {/* An icon button with no aria-label: a screen reader
                announces it as "×, button" — a multiplication sign. */}
            <button className="x" onClick={onClose}>×</button>
            <h3>Edit profile</h3>
            <div className="row">
              <label htmlFor="displayName">Display name </label>
              <input id="displayName" defaultValue="Ada" />
            </div>
            <button onClick={onClose}>Save</button>{' '}
            <button onClick={onClose}>Cancel</button>
          </div>
        </div>
      );
    }

    function App() {
      const [open, setOpen] = useState(false);

      // Opening only flips a boolean. Nobody moves focus, so it stays
      // on the "Edit profile…" button BEHIND the grey layer — and
      // closing leaves focus on a button React just unmounted, which
      // drops it back to <body>.
      return (
        <div>
          <h1>Account</h1>
          <FocusTracker />
          <SettingsPanel onOpenDialog={() => setOpen(true)} />
          {open && <FakeModal onClose={() => setOpen(false)} />}
          <p style={{ color: '#666', fontSize: 14 }}>
            Put the mouse down and use the keyboard. Tab to "Edit
            profile…" and press Enter, then press Tab five times and
            watch the tracker: "Save settings" → "Help" → × → Display
            name → Save. The first two are behind the dim layer —
            invisible, unreachable by mouse, and yours to type into.
            Keep tabbing past Cancel and you fall out of the dialog
            again, back through the browser's toolbar to the Email
            field. Shift+Tab from Display name walks out immediately.
            Escape does nothing. Close with a mouse click and the
            tracker reads &lt;body&gt;: your place on the page is gone.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

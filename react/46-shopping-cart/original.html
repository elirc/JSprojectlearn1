<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 46 — float cart (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          li { margin: 4px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // js#32's floating-point cart... in React, with js#32 never read.
    const PRODUCTS = [
      { id: 'coffee', name: 'Coffee beans', price: 10.35 },
      { id: 'filter', name: 'Filters', price: 0.10 },
      { id: 'mug', name: 'Mug', price: 14.95 },
    ];

    function App() {
      const [cart, setCart] = useState([]); // [{id, name, price, qty}]

      function add(product) {
        const existing = cart.find((line) => line.id === product.id);
        if (existing) {
          existing.qty += 1;     // MUTATION (project 10!) — "mostly works"
          setCart([...cart]);    // ...because of this shallow-copy kludge
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      }

      // Money math in floats, accumulated:
      const subtotal = cart.reduce((sum, line) => sum + line.price * line.qty, 0);
      const discount = subtotal > 30 ? subtotal * 0.1 : 0;
      const total = subtotal - discount;

      return (
        <div>
          <h1>Shop</h1>
          {PRODUCTS.map((p) => (
            <button key={p.id} onClick={() => add(p)}>
              add {p.name} (${p.price})
            </button>
          ))}
          <ul>
            {cart.map((line) => (
              <li key={line.id}>{line.name} x{line.qty}</li>
            ))}
          </ul>
          <p>subtotal: ${subtotal}</p>
          <p>discount: ${discount}</p>
          <h3>total: ${total}</h3>
          <p style={{ color: '#666', fontSize: 14 }}>
            Add 3x coffee + 2x filters: subtotal
            $31.249999999999996. The 10% discount then inherits the
            dust, and the customer stares at a total with 15 decimal
            places. Patching with toFixed(2) would hide it on screen
            while the WRONG number goes to the payment API (js#32's
            whole lesson). Also spot the in-place `existing.qty += 1`
            mutation — project 10's bug pattern, "working" only
            because of the shallow-copy kludge next to it.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

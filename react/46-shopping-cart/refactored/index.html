<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 46 — cents cart (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          li { margin: 4px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useReducer } = React;

    // ==== js#32's money module (integer cents; Intl at the edge) ==
    function formatCents(cents) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
        .format(cents / 100);
    }

    function applyDiscountCents(cents, percent) {
      return cents - Math.round((cents * percent) / 100);
    }

    // Prices STORED as integer cents — floats never enter the data:
    const PRODUCTS = [
      { id: 'coffee', name: 'Coffee beans', priceCents: 1035 },
      { id: 'filter', name: 'Filters', priceCents: 10 },
      { id: 'mug', name: 'Mug', priceCents: 1495 },
    ];

    // ==== the cart reducer (react#13, immutably — react#10) =======
    function cartReducer(cart, action) {
      switch (action.type) {
        case 'added': {
          const existing = cart.find((line) => line.id === action.product.id);
          if (existing) {
            return cart.map((line) =>
              line.id === action.product.id ? { ...line, qty: line.qty + 1 } : line);
          }
          return [...cart, { ...action.product, qty: 1 }];
        }
        case 'removed':
          return cart.filter((line) => line.id !== action.id);
        default:
          throw new Error(`Unknown action: ${action.type}`);
      }
    }

    function App() {
      const [cart, dispatch] = useReducer(cartReducer, []);

      // Derived money, exact to the cent (project 09 + js#32):
      const subtotalCents = cart.reduce(
        (sum, line) => sum + line.priceCents * line.qty, 0);
      const discountedCents = subtotalCents > 3000
        ? applyDiscountCents(subtotalCents, 10)
        : subtotalCents;
      const discountCents = subtotalCents - discountedCents;

      return (
        <div>
          <h1>Shop</h1>
          {PRODUCTS.map((p) => (
            <button key={p.id} onClick={() => dispatch({ type: 'added', product: p })}>
              add {p.name} ({formatCents(p.priceCents)})
            </button>
          ))}
          <ul>
            {cart.map((line) => (
              <li key={line.id}>
                {line.name} x{line.qty} — {formatCents(line.priceCents * line.qty)}
                {' '}<button onClick={() => dispatch({ type: 'removed', id: line.id })}>x</button>
              </li>
            ))}
          </ul>
          <p>subtotal: {formatCents(subtotalCents)}</p>
          <p>discount: {formatCents(discountCents)}</p>
          <h3>total: {formatCents(discountedCents)}</h3>
          <p style={{ color: '#666', fontSize: 14 }}>
            3x coffee + 2x filters = exactly $31.25 — integers all the
            way down, Intl formatting at the display edge only. The
            reducer is pure and immutable (line totals via map, no
            in-place qty bumps), so it could lift into js#13-style
            Node tests or project 41's store unchanged.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

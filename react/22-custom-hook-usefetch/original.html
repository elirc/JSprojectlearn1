<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 22 — duplicated fetch logic (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .widget { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // fake API
    function api(path) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (path === '/profile') resolve({ name: 'Ada', role: 'Engineer' });
          else if (path === '/stats') resolve({ commits: 1042, reviews: 87 });
          else if (path === '/alerts') reject(new Error('alerts service down'));
          else reject(new Error('404'));
        }, 500),
      );
    }

    // THREE widgets. The same ~15 lines of fetch plumbing pasted into
    // each, with the drift you'd expect:
    function ProfileWidget() {
      const [request, setRequest] = useState({ status: 'idle' });
      useEffect(() => {
        let stale = false;
        setRequest({ status: 'loading' });
        api('/profile')
          .then((data) => { if (!stale) setRequest({ status: 'success', data }); })
          .catch((error) => { if (!stale) setRequest({ status: 'error', error: error.message }); });
        return () => { stale = true; };
      }, []);
      if (request.status === 'loading') return <div className="widget">loading profile...</div>;
      if (request.status === 'error') return <div className="widget">error: {request.error}</div>;
      if (request.status !== 'success') return null;
      return <div className="widget"><strong>{request.data.name}</strong> — {request.data.role}</div>;
    }

    function StatsWidget() {
      const [request, setRequest] = useState({ status: 'idle' });
      useEffect(() => {
        setRequest({ status: 'loading' });
        api('/stats') // <- pasted, then "simplified": the stale flag
          .then((data) => setRequest({ status: 'success', data }))     // got dropped.
          .catch((error) => setRequest({ status: 'error', error: error.message }));
      }, []);       // the race protection quietly died in this copy
      if (request.status === 'loading') return <div className="widget">loading stats...</div>;
      if (request.status === 'error') return <div className="widget">error: {request.error}</div>;
      if (request.status !== 'success') return null;
      return <div className="widget">{request.data.commits} commits · {request.data.reviews} reviews</div>;
    }

    function AlertsWidget() {
      const [request, setRequest] = useState({ status: 'idle' });
      useEffect(() => {
        let stale = false;
        setRequest({ status: 'loading' });
        api('/alerts')
          .then((data) => { if (!stale) setRequest({ status: 'success', data }); })
          .catch(() => { /* pasted, then MODIFIED: errors swallowed! */ });
        return () => { stale = true; };
      }, []);
      if (request.status === 'loading') return <div className="widget">loading alerts... (forever — the error was eaten)</div>;
      if (request.status !== 'success') return null;
      return <div className="widget">alerts: {JSON.stringify(request.data)}</div>;
    }

    function App() {
      return (
        <div>
          <h1>Dashboard</h1>
          <ProfileWidget />
          <StatsWidget />
          <AlertsWidget />
          <p style={{ color: '#666', fontSize: 14 }}>
            Three copies of the same plumbing, three mutations: one
            lost its race guard, one swallows errors (watch it
            "load" forever). Copy-paste doesn't just duplicate code —
            it FORKS it, and the forks rot independently (js#04).
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

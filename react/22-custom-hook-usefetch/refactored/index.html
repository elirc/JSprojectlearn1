<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 22 — useFetch hook (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .widget { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function api(path) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (path === '/profile') resolve({ name: 'Ada', role: 'Engineer' });
          else if (path === '/stats') resolve({ commits: 1042, reviews: 87 });
          else if (path === '/alerts') reject(new Error('alerts service down'));
          else reject(new Error('404'));
        }, 500),
      );
    }

    // ==== THE CUSTOM HOOK ========================================
    // A custom hook is just a function that calls hooks — the same
    // extract-the-duplication move as js#27's memoize, applied to
    // component logic. The fetch plumbing (status object from
    // project 20, race guard from project 19) now exists ONCE.
    // Every consumer gets the correct version; none can drift.
    function useFetch(path) {
      const [request, setRequest] = useState({ status: 'idle' });

      useEffect(() => {
        let stale = false;
        setRequest({ status: 'loading' });
        api(path)
          .then((data) => { if (!stale) setRequest({ status: 'success', data }); })
          .catch((error) => { if (!stale) setRequest({ status: 'error', error: error.message }); });
        return () => { stale = true; };
      }, [path]); // path is a dep: navigate the hook to a new URL and it refetches

      return request;
    }

    // Each hook CALL gets its own private state (three widgets =
    // three independent requests) — same isolation as js#28's
    // per-wrapper closures, provided by React per call site.

    // ==== WIDGETS: one line of data logic each ===================
    function ProfileWidget() {
      const request = useFetch('/profile');
      if (request.status !== 'success') return <StatusLine request={request} label="profile" />;
      return <div className="widget"><strong>{request.data.name}</strong> — {request.data.role}</div>;
    }

    function StatsWidget() {
      const request = useFetch('/stats');
      if (request.status !== 'success') return <StatusLine request={request} label="stats" />;
      return <div className="widget">{request.data.commits} commits · {request.data.reviews} reviews</div>;
    }

    function AlertsWidget() {
      const request = useFetch('/alerts');
      if (request.status !== 'success') return <StatusLine request={request} label="alerts" />;
      return <div className="widget">alerts: {JSON.stringify(request.data)}</div>;
    }

    function StatusLine({ request, label }) {
      if (request.status === 'loading') return <div className="widget">loading {label}...</div>;
      if (request.status === 'error') return <div className="widget" style={{ color: '#c33' }}>error: {request.error}</div>;
      return null;
    }

    function App() {
      return (
        <div>
          <h1>Dashboard</h1>
          <ProfileWidget />
          <StatsWidget />
          <AlertsWidget />
          <p style={{ color: '#666', fontSize: 14 }}>
            The alerts error now SHOWS (nothing swallowed it), every
            widget has the race guard, and a fix to useFetch fixes all
            three at once — plus the fourth widget you'll add next week.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

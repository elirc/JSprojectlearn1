<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 35 — config-object tabs (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
    .tabbar button { padding: 8px 16px; border: none; background: none; cursor: pointer; }
    .tabbar button.active { border-bottom: 2px solid #36c; font-weight: bold; }
    .tabpanel { border: 1px solid #ccc; border-radius: 0 8px 8px 8px; padding: 12px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A Tabs component configured entirely through a prop. It
    // started reasonable — {label, content} — and then reality
    // arrived, one config key at a time.
    function Tabs({ tabs }) {
      const [activeIndex, setActiveIndex] = useState(0);
      return (
        <div>
          <div className="tabbar">
            {tabs.map((tab, i) => (
              <button
                key={i}
                className={i === activeIndex ? 'active' : ''}
                disabled={tab.disabled}
                onClick={() => setActiveIndex(i)}
              >
                {tab.icon ? tab.icon + ' ' : ''}{tab.label}
                {tab.badge != null ? ` (${tab.badge})` : ''}
              </button>
            ))}
          </div>
          <div className="tabpanel">{tabs[activeIndex].content}</div>
        </div>
      );
    }

    function App() {
      const [drafts] = useState(3);

      // The config object. Content is JSX-in-an-array; every visual
      // nuance (icon, badge, disabled) became a KEY the Tabs
      // component must know how to render. Want a tooltip on one
      // tab? A spinner in a label? A divider between groups? Each
      // is a new key + new rendering branch inside Tabs. The caller
      // WRITES a data structure to DESCRIBE the JSX they wish they
      // could just write.
      const tabs = [
        { label: 'Inbox', icon: '📥', badge: 12, content: <p>Inbox messages here.</p> },
        { label: 'Drafts', badge: drafts, content: <p>{drafts} unsent drafts.</p> },
        { label: 'Archive', disabled: true, content: <p>Archived mail.</p> },
        { label: 'Settings', icon: '⚙️', content: <p>Knobs and switches.</p> },
      ];

      return (
        <div>
          <h1>Mail</h1>
          <Tabs tabs={tabs} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 35 — compound tabs (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
    .tabbar button { padding: 8px 16px; border: none; background: none; cursor: pointer; }
    .tabbar button.active { border-bottom: 2px solid #36c; font-weight: bold; }
    .tabpanel { border: 1px solid #ccc; border-radius: 0 8px 8px 8px; padding: 12px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useContext, createContext } = React;

    // COMPOUND COMPONENTS: Tabs owns the shared state (which tab is
    // active) and shares it with its pieces via context — the family
    // secret channel. The pieces (Tab, TabPanel) are ordinary JSX the
    // caller arranges freely. Same architecture as <select>/<option>.
    const TabsContext = createContext(null);

    function Tabs({ defaultTab, children }) {
      const [activeTab, setActiveTab] = useState(defaultTab);
      return (
        <TabsContext.Provider value={{ activeTab, setActiveTab }}>
          {children}
        </TabsContext.Provider>
      );
    }

    function TabList({ children }) {
      return <div className="tabbar">{children}</div>;
    }

    function Tab({ id, disabled, children }) {
      const { activeTab, setActiveTab } = useContext(TabsContext);
      return (
        <button
          className={id === activeTab ? 'active' : ''}
          disabled={disabled}
          onClick={() => setActiveTab(id)}
        >
          {children}
        </button>
      );
    }

    function TabPanel({ id, children }) {
      const { activeTab } = useContext(TabsContext);
      if (id !== activeTab) return null;
      return <div className="tabpanel">{children}</div>;
    }

    function App() {
      const [drafts] = useState(3);

      return (
        <div>
          <h1>Mail</h1>
          {/* The caller WRITES JSX instead of describing it. Icons,
              badges, spinners, tooltips — no config keys needed;
              a tab's label is children (project 06's lesson, applied
              to a component FAMILY): */}
          <Tabs defaultTab="inbox">
            <TabList>
              <Tab id="inbox">📥 Inbox <strong>(12)</strong></Tab>
              <Tab id="drafts">Drafts ({drafts})</Tab>
              <Tab id="archive" disabled>Archive</Tab>
              <Tab id="settings">⚙️ Settings</Tab>
            </TabList>

            <TabPanel id="inbox"><p>Inbox messages here.</p></TabPanel>
            <TabPanel id="drafts"><p>{drafts} unsent drafts.</p></TabPanel>
            <TabPanel id="archive"><p>Archived mail.</p></TabPanel>
            <TabPanel id="settings"><p>Knobs and switches.</p></TabPanel>
          </Tabs>
          <p style={{ color: '#666', fontSize: 14 }}>
            The pieces coordinate (click a Tab, the right TabPanel
            appears) without the caller wiring anything — the shared
            state travels through TabsContext, invisibly. And the
            markup is free: wrap TabList in a header, put an ad
            between two panels, whatever — Tabs doesn't care where
            its children sit.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

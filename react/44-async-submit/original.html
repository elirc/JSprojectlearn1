<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 44 — double submit (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          textarea { width: 100%; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // The "server": slow (1.5s), and it dutifully processes EVERY
    // request it receives. It also keeps a ledger.
    let ordersPlaced = 0;
    function placeOrder(note) {
      return new Promise((resolve) =>
        setTimeout(() => {
          ordersPlaced++;
          resolve({ orderNumber: 1000 + ordersPlaced, note });
        }, 1500),
      );
    }

    function App() {
      const [note, setNote] = useState('');
      const [confirmation, setConfirmation] = useState(null);

      async function handleSubmit(e) {
        e.preventDefault();
        // Nothing stops a second click while the first is in flight.
        const result = await placeOrder(note);
        setConfirmation(result);
      }

      return (
        <form onSubmit={handleSubmit}>
          <h1>Checkout</h1>
          <textarea rows="2" placeholder="delivery note..."
                    value={note} onChange={(e) => setNote(e.target.value)} />
          <p>
            <button type="submit">Place order ($499)</button>
          </p>
          {confirmation && <p>✅ order #{confirmation.orderNumber} placed</p>}
          <p style={{ color: '#c33' }}>orders the server has processed: {ordersPlaced}</p>

          <p style={{ color: '#666', fontSize: 14 }}>
            Click "Place order". Nothing visibly happens for 1.5s — so
            do what every user does: click again. And again. Each
            click fires ANOTHER request; the ledger above counts them.
            Three clicks = three $499 orders. This is js#48's "what
            can the user do during the meanwhile?" — and the answer
            here is "buy the same thing repeatedly". The submit
            button needs to know a request is in flight, and it
            doesn't.
          </p>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

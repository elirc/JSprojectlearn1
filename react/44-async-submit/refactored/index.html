<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 44 — pending state (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          textarea { width: 100%; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    let ordersPlaced = 0;
    function placeOrder(note) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (Math.random() < 0.25) { reject(new Error('payment gateway timeout')); return; }
          ordersPlaced++;
          resolve({ orderNumber: 1000 + ordersPlaced, note });
        }, 1500),
      );
    }

    function App() {
      const [note, setNote] = useState('');
      // The submission is a little state machine (project 20's
      // status shape, write-side): idle -> submitting -> done|error
      const [submission, setSubmission] = useState({ status: 'idle' });

      async function handleSubmit(e) {
        e.preventDefault();
        if (submission.status === 'submitting') return; // the phase check (js#48)

        setSubmission({ status: 'submitting' });
        try {
          const result = await placeOrder(note);
          setSubmission({ status: 'done', confirmation: result });
        } catch (err) {
          setSubmission({ status: 'error', message: err.message });
        }
      }

      const isSubmitting = submission.status === 'submitting';

      if (submission.status === 'done') {
        return (
          <div>
            <h1>Thank you!</h1>
            <p>✅ order #{submission.confirmation.orderNumber} placed</p>
            <p style={{ color: '#2a2' }}>orders the server has processed: {ordersPlaced}</p>
          </div>
        );
      }

      return (
        <form onSubmit={handleSubmit}>
          <h1>Checkout</h1>
          <textarea rows="2" placeholder="delivery note..."
                    value={note} onChange={(e) => setNote(e.target.value)}
                    disabled={isSubmitting} />
          <p>
            {/* the three defenses, layered:
                1. disabled -> the browser blocks clicks
                2. label change -> the human stops trying
                3. the phase check in the handler -> belt & braces
                   (keyboards, double-fires, future refactors) */}
            <button type="submit" disabled={isSubmitting}>
              {isSubmitting ? 'Placing order…' : 'Place order ($499)'}
            </button>
          </p>
          {submission.status === 'error' && (
            <p style={{ color: '#c33' }}>
              {submission.message} — nothing was charged, try again
            </p>
          )}
          <p style={{ color: '#2a2' }}>orders the server has processed: {ordersPlaced}</p>

          <p style={{ color: '#666', fontSize: 14 }}>
            Mash the button all you like: one order. The demo also
            fails 25% of the time so you can see the error state
            return you to a RETRYABLE form — pending isn't just
            blocking, it's the full submit lifecycle. (Belt-and-
            suspenders in real systems: the server ALSO dedupes via
            an idempotency key. UI guards are for UX; server guards
            are for money.)
          </p>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

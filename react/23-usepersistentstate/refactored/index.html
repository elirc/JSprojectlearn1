<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 23 — usePersistentState (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          body.dark { background: #222; color: #eee; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==== THE HOOK: useState that survives refresh ================
    // Same signature as useState plus a storage key. All the
    // persistence policy lives here, once:
    //   - lazy init (the function passed to useState runs ONCE, not
    //     every render — the original re-read storage per render)
    //   - JSON for any serializable value, not just strings
    //   - corrupted/missing data falls back to the default (js#14's
    //     guarded load; storage is user-editable, treat it as input)
    //   - saving is automatic: state changes -> effect writes through
    function usePersistentState(key, defaultValue) {
      const [value, setValue] = useState(() => {
        try {
          const stored = localStorage.getItem(key);
          return stored === null ? defaultValue : JSON.parse(stored);
        } catch {
          return defaultValue; // corrupted entry: fall back, don't crash
        }
      });

      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(value));
      }, [key, value]);

      return [value, setValue];
    }

    // ==== THE APP: persistence is now a one-word decision =========
    function App() {
      const [theme, setTheme] = usePersistentState('theme', 'light');
      const [fontSize, setFontSize] = usePersistentState('fontSize', 16);
      const [username, setUsername] = usePersistentState('username', '');
      // ^ setting 3 didn't forget persistence — it couldn't. Using
      // the hook IS the persistence.

      useEffect(() => {
        document.body.className = theme === 'dark' ? 'dark' : '';
      }, [theme]);

      return (
        <div style={{ fontSize }}>
          <h1>Settings</h1>
          <p>
            theme: {theme}{' '}
            <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>
              toggle
            </button>
          </p>
          <p>
            font size: {fontSize}
            <button onClick={() => setFontSize(fontSize + 2)}>+</button>
            <button onClick={() => setFontSize(fontSize - 2)}>-</button>
          </p>
          <p>
            name: <input value={username} onChange={(e) => setUsername(e.target.value)} />
            <em> (refresh — it's still here)</em>
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

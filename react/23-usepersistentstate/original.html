<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 23 — scattered localStorage (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          body.dark { background: #222; color: #eee; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Settings that should survive refresh. localStorage calls
    // sprinkled wherever someone remembered to add them.
    function App() {
      // setting 1: theme — reads storage on EVERY render (slow-ish,
      // and JSON.parse can throw on corrupted data: unguarded)
      const [theme, setTheme] = useState(
        localStorage.getItem('theme') || 'light',
      );

      function toggleTheme() {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next);
        localStorage.setItem('theme', next); // save is manual, here...
      }

      // setting 2: font size — saved in a DIFFERENT place (an effect)
      const [fontSize, setFontSize] = useState(
        Number(localStorage.getItem('fontSize')) || 16,
      );
      useEffect(() => {
        localStorage.setItem('fontSize', fontSize);
      }, [fontSize]);

      // setting 3: username — whoever added it forgot persistence
      // entirely. Type a name, refresh: gone. The pattern lived in
      // the other two settings, but there was nothing to REUSE, only
      // something to REMEMBER.
      const [username, setUsername] = useState('');

      useEffect(() => {
        document.body.className = theme === 'dark' ? 'dark' : '';
      }, [theme]);

      return (
        <div style={{ fontSize }}>
          <h1>Settings</h1>
          <p>
            theme: {theme} <button onClick={toggleTheme}>toggle</button>
          </p>
          <p>
            font size: {fontSize}
            <button onClick={() => setFontSize(fontSize + 2)}>+</button>
            <button onClick={() => setFontSize(fontSize - 2)}>-</button>
          </p>
          <p>
            name: <input value={username} onChange={(e) => setUsername(e.target.value)} />
            <em> (refresh the page — this one vanishes)</em>
          </p>
          {/* Three settings, three different persistence strategies
              (manual save / effect save / no save), zero shared code.
              Also: store "fontSize" as the string "abc" by hand in
              devtools and reload — Number('abc') is NaN and the UI
              breaks. No guards anywhere. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

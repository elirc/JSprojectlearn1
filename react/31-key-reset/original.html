<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 31 — syncing props to state (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
          textarea { width: 100%; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const USERS = [
      { id: 1, name: 'Ada', bio: 'First programmer.' },
      { id: 2, name: 'Grace', bio: 'Compiler inventor.' },
    ];

    // A bio editor with a draft (editable copy of the user's bio).
    // Problem: when the SELECTED USER changes, the draft must reset.
    function BioEditor({ user }) {
      // v1 shipped with just this line — and switching users kept
      // the OLD draft (state initializers run once, on mount):
      const [draft, setDraft] = useState(user.bio);

      // v2 "fixed" it with the infamous sync effect:
      useEffect(() => {
        setDraft(user.bio);
      }, [user.id]);
      // This works... mostly. But:
      // 1. It renders the WRONG content first (old draft), then
      //    corrects itself — switch users fast and you can catch
      //    Ada's bio flashing under Grace's name.
      // 2. Unsaved edits are silently destroyed with no chance to
      //    warn — the effect fires after the switch already happened.
      // 3. It's a state<-prop sync effect — project 21 said those
      //    are always suspicious. Correct: this one's a design smell.

      return (
        <div className="card">
          <h3>{user.name}</h3>
          <textarea rows="3" value={draft} onChange={(e) => setDraft(e.target.value)} />
          <p><small>draft: "{draft}"</small></p>
        </div>
      );
    }

    function App() {
      const [selectedId, setSelectedId] = useState(1);
      const user = USERS.find((u) => u.id === selectedId);

      return (
        <div>
          <h1>Bio editor</h1>
          {USERS.map((u) => (
            <button key={u.id} onClick={() => setSelectedId(u.id)}
                    disabled={u.id === selectedId}>
              {u.name}
            </button>
          ))}
          <BioEditor user={user} />
          <p style={{ color: '#666', fontSize: 14 }}>
            Edit Ada's bio, then click Grace: your edit vanishes via a
            brief flash of the stale draft. The component is being
            REUSED across users while its state pretends to belong to
            one of them.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 31 — reset with key (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
          textarea { width: 100%; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const USERS = [
      { id: 1, name: 'Ada', bio: 'First programmer.' },
      { id: 2, name: 'Grace', bio: 'Compiler inventor.' },
    ];

    // The editor is now allowed to be SIMPLE: initialize the draft
    // once and never worry about user switches. No sync effect, no
    // user.id watching — because this component instance will only
    // ever see ONE user. The parent guarantees it (see below).
    function BioEditor({ user }) {
      const [draft, setDraft] = useState(user.bio);

      return (
        <div className="card">
          <h3>{user.name}</h3>
          <textarea rows="3" value={draft} onChange={(e) => setDraft(e.target.value)} />
          <p><small>draft: "{draft}"</small></p>
        </div>
      );
    }

    function App() {
      const [selectedId, setSelectedId] = useState(1);
      const user = USERS.find((u) => u.id === selectedId);

      return (
        <div>
          <h1>Bio editor</h1>
          {USERS.map((u) => (
            <button key={u.id} onClick={() => setSelectedId(u.id)}
                    disabled={u.id === selectedId}>
              {u.name}
            </button>
          ))}

          {/* THE FIX — one attribute: key={user.id}. Project 03
              taught that keys are identity; here we USE that on
              purpose. When the key changes, React doesn't update the
              component — it unmounts the old instance (state and
              all) and mounts a brand-new one, which initializes its
              draft from the new user. "Different key = different
              thing, start over." */}
          <BioEditor key={user.id} user={user} />

          <p style={{ color: '#666', fontSize: 14 }}>
            Switch users: fresh draft, instantly, no flash of stale
            content — the wrong-content frame never renders because
            the old instance never renders with the new user. The
            sync effect is gone; the editor got SIMPLER, not smarter.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

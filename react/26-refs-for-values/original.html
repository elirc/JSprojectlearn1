<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 26 — state for non-render values (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // A "click speed test": click as fast as you can; we track the
    // time of the previous click to compute the gap. Everything went
    // into useState, because state is where values go... right?
    let appRenders = 0;

    function App() {
      appRenders++;

      const [gap, setGap] = useState(null);
      const [bestGap, setBestGap] = useState(null);

      // Mistake 1: a value only read inside handlers — never rendered —
      // stored as STATE. Every write re-renders the whole app for a
      // value no pixel depends on:
      const [lastClickTime, setLastClickTime] = useState(null);

      // Mistake 2: mousemove position, also state. Move your mouse
      // over the box and watch the render counter melt:
      const [mouseX, setMouseX] = useState(0);

      function handleClick() {
        const now = performance.now();
        if (lastClickTime !== null) {
          const thisGap = now - lastClickTime;
          setGap(thisGap);
          if (bestGap === null || thisGap < bestGap) setBestGap(thisGap);
        }
        setLastClickTime(now);
        // Subtle bug too: because setLastClickTime schedules a render
        // but `lastClickTime` in THIS closure is old (project 11),
        // double-clicking extremely fast can compute a gap from a
        // stale click time. Values used only imperatively don't fit
        // the render-snapshot model — they fight it.
      }

      return (
        <div>
          <h1>Click speed test</h1>
          <div
            onMouseMove={(e) => setMouseX(e.clientX)}
            style={{ border: '1px solid #ccc', padding: 20, borderRadius: 8 }}
          >
            <button onClick={handleClick} style={{ fontSize: 20, padding: '12px 24px' }}>
              CLICK ME FAST
            </button>
            <p>last gap: {gap === null ? '—' : `${gap.toFixed(0)}ms`}</p>
            <p>best gap: {bestGap === null ? '—' : `${bestGap.toFixed(0)}ms`}</p>
          </div>
          <p style={{ color: '#c33' }}>
            App renders: {appRenders} — wiggle your mouse over the box
            and watch this climb by hundreds. mouseX is rendered
            nowhere; lastClickTime is rendered nowhere; both re-render
            everything on every change.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

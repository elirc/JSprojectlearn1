<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 26 — refs for non-render values (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    let appRenders = 0;

    function App() {
      appRenders++;

      // Rendered values -> STATE (changing them should repaint):
      const [gap, setGap] = useState(null);
      const [bestGap, setBestGap] = useState(null);

      // Values used only inside handlers -> REFS. A ref is a mutable
      // box that survives renders: writing .current re-renders
      // NOTHING, and reading .current always gives the latest value
      // (no snapshot, no staleness — project 11 doesn't apply).
      const lastClickTime = useRef(null);
      const lastMouseX = useRef(0);

      function handleClick() {
        const now = performance.now();
        if (lastClickTime.current !== null) {
          const thisGap = now - lastClickTime.current; // always current — even
          setGap(thisGap);                             // on hyper-fast double-clicks
          setBestGap((best) => (best === null || thisGap < best ? thisGap : best));
        }
        lastClickTime.current = now; // write: no render, none needed
      }

      return (
        <div>
          <h1>Click speed test</h1>
          <div
            onMouseMove={(e) => { lastMouseX.current = e.clientX; }}
            style={{ border: '1px solid #ccc', padding: 20, borderRadius: 8 }}
          >
            <button onClick={handleClick} style={{ fontSize: 20, padding: '12px 24px' }}>
              CLICK ME FAST
            </button>
            <p>last gap: {gap === null ? '—' : `${gap.toFixed(0)}ms`}</p>
            <p>best gap: {bestGap === null ? '—' : `${bestGap.toFixed(0)}ms`}</p>
          </div>
          <p style={{ color: '#2a2' }}>
            App renders: {appRenders} — wiggle the mouse all you like.
            Renders happen only when a DISPLAYED value (gap / best)
            changes.
          </p>
          <p style={{ color: '#666', fontSize: 14 }}>
            The sorting rule: does the screen need to change when this
            value changes? Yes -&gt; useState. No (timer ids, previous
            values, latest-callback boxes, DOM nodes) -&gt; useRef.
            And never READ a ref during render — a value the screen
            depends on belongs in state.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

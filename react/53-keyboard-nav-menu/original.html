<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 53 — mouse-only menu (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 620px; margin: 40px auto; }
          .menu { position: relative; display: inline-block; }
          .trigger { border: 1px solid #ccc; border-radius: 6px; padding: 8px 14px;
                     background: #f7f7f7; cursor: pointer; user-select: none; }
          .list { position: absolute; top: 100%; left: 0; margin-top: 8px; width: 200px;
                  border: 1px solid #ccc; border-radius: 6px; background: #fff;
                  box-shadow: 0 2px 8px rgba(0,0,0,.15); padding: 4px 0; }
          .item { padding: 8px 14px; cursor: pointer; }
          .item:hover { background: #dceaff; }   /* hover, and ONLY hover */
          .status { font-family: monospace; font-size: 13px; color: #444;
                    background: #f4f4f4; padding: 6px 10px; border-radius: 4px; margin: 6px 0; }
          .disabled { color: #aaa; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A dropdown menu that is a joy with a mouse and impossible without
    // one. Everything here is an EVENT HANDLER reacting to the pointer;
    // nothing is state describing "which item is active", so there is
    // nothing for a key press to move.
    const ITEMS = [
      { label: 'Rename', disabled: false },
      { label: 'Duplicate', disabled: false },
      { label: 'Export as CSV', disabled: false },
      { label: 'Delete (disabled)', disabled: true },
    ];

    function describe(el) {
      if (!el || el === document.body) return '<body> (nothing focused)';
      const text = (el.textContent || '').trim().slice(0, 24);
      return `<${el.tagName.toLowerCase()}> ${text}`;
    }

    // A focus tracker, so you can watch Tab skip the whole menu.
    function FocusTracker() {
      const [where, setWhere] = useState(describe(document.activeElement));
      useEffect(() => {
        const onFocus = () => setWhere(describe(document.activeElement));
        document.addEventListener('focusin', onFocus);
        document.addEventListener('focusout', onFocus);
        return () => {
          document.removeEventListener('focusin', onFocus);
          document.removeEventListener('focusout', onFocus);
        };
      }, []);
      return <div className="status">focus: {where}</div>;
    }

    function Menu({ onPick }) {
      const [open, setOpen] = useState(false);

      return (
        <div>
          {/* Hover to open, un-hover to close: a pointer-only contract. */}
          <div className="menu"
               onMouseEnter={() => setOpen(true)}
               onMouseLeave={() => setOpen(false)}>
            {/* A div dressed as a button: no focus, no Enter, no aria-expanded. */}
            <div className="trigger">Actions ▾</div>
            {open && (
              <div className="list">
                {ITEMS.map((item) => (
                  // divs with onClick: invisible to Tab, invisible to a
                  // screen reader, and the disabled one fires anyway.
                  <div key={item.label}
                       className={'item' + (item.disabled ? ' disabled' : '')}
                       onClick={() => onPick(item.label)}>
                    {item.label}
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="status">
            open: {String(open)} | activeIndex: — (there isn't one; the
            highlight is CSS :hover)
          </div>
        </div>
      );
    }

    function App() {
      const [picked, setPicked] = useState('nothing yet');
      return (
        <div>
          <h1>Document actions</h1>
          <p>
            <button>before the menu</button>{' '}
            <button>after the menu</button>
          </p>
          <Menu onPick={setPicked} />
          <FocusTracker />
          <p>Last action: <b>{picked}</b></p>
          <p style={{ color: '#666', fontSize: 14 }}>
            Put the mouse down and try to use this menu. Tab goes
            straight from "before" to "after" — the trigger is a div, so
            it is not a tab stop; the items are divs, so they are not
            either. Enter and the arrow keys do nothing, because no state
            here answers "which item is active?". Even with a mouse:
            open the menu and move diagonally toward "Export" — cutting
            the corner leaves the wrapper, onMouseLeave fires, and the
            menu vanishes mid-reach. And "Delete (disabled)" is grey, but
            clicking it still fires the action.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

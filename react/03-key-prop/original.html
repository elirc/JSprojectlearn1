<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 03 — index keys (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          .row { margin: 6px 0; } input { margin-left: 8px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Guest list: each row has the guest's name and an input for
    // their meal choice. Keys are array indexes — the linter said we
    // needed keys, and index made the warning go away. Ship it.
    function App() {
      const [guests, setGuests] = useState([
        { id: 101, name: 'Ada' },
        { id: 102, name: 'Grace' },
        { id: 103, name: 'Alan' },
      ]);

      function removeGuest(id) {
        setGuests(guests.filter((g) => g.id !== id));
      }

      return (
        <div>
          <h1>Dinner guests</h1>
          <p>
            1. Type a meal next to EACH guest (e.g. Ada: fish,
            Grace: pasta, Alan: steak).<br />
            2. Remove <strong>Grace</strong> (the middle row).<br />
            3. Look at Alan's meal. <em>He has Grace's pasta now.</em>
          </p>
          {guests.map((guest, index) => (
            <div className="row" key={index}>
              <button onClick={() => removeGuest(guest.id)}>x</button>
              <strong> {guest.name}</strong>
              <input placeholder="meal choice" />
            </div>
          ))}
          {/* Why: React matches old and new rows BY KEY. After the
              delete, "key=1" used to be Grace and is now Alan — so
              React thinks row 1 merely changed its name label, and
              KEEPS the row's DOM (including the uncontrolled input
              with Grace's pasta typed in it). The state didn't move;
              the labels did. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

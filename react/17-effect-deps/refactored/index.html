<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 17 — correct deps (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    let requestCount = 0;
    function fetchUser(id) {
      requestCount++;
      return new Promise((resolve) =>
        setTimeout(() => resolve({ id, name: `User #${id}`, requestCount }), 300),
      );
    }

    function App() {
      const [userId, setUserId] = useState(1);
      const [user, setUser] = useState(null);

      useEffect(() => {
        fetchUser(userId).then((u) => setUser(u));
      }, [userId]);
      // The deps array answers ONE question: "re-run this effect when
      // WHICH values change?" This effect synchronizes `user` with
      // `userId`, so: [userId].
      //   - every render (no array):   sync storm  <- Bug A
      //   - never again ([]):          frozen sync <- Bug B
      //   - when userId changes:       correct
      // The honest rule: every render-scope value the effect READS
      // belongs in the array. If that re-runs it more than you want,
      // don't lie in the array — restructure (updaters: project 11,
      // refs: project 25, or delete the effect: project 21).

      return (
        <div>
          <h1>User viewer</h1>
          <button onClick={() => setUserId(1)}>user 1</button>{' '}
          <button onClick={() => setUserId(2)}>user 2</button>
          <p>{user ? user.name : 'loading...'}</p>
          <p style={{ color: '#2a2' }}>
            total requests: {user ? user.requestCount : 0} — exactly one
            per user change. Click between users and count along.
          </p>
          <p style={{ color: '#666', fontSize: 14 }}>
            (Two more things this fetch effect still needs — cleanup
            and race protection. Projects 18 and 19 add them; the
            deps lesson stands alone here.)
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

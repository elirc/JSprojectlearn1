<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 17 — effect deps (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A fake API so this file runs offline. ~300ms per "request",
    // and it COUNTS how many requests you've made. Watch the counter.
    let requestCount = 0;
    function fetchUser(id) {
      requestCount++;
      return new Promise((resolve) =>
        setTimeout(() => resolve({ id, name: `User #${id}`, requestCount }), 300),
      );
    }

    function App() {
      const [userId, setUserId] = useState(1);
      const [user, setUser] = useState(null);

      // ---- Bug A: NO deps array at all. ----
      useEffect(() => {
        fetchUser(userId).then((u) => setUser(u));
      });
      // No array means "run after EVERY render". And this effect
      // CAUSES a render (setUser)... which runs the effect... which
      // sets state... A perpetual fetch machine. Open the page and
      // watch "total requests" climb forever — hundreds of requests
      // to display one user. In production this is a self-DoS
      // (js#42's unbounded lesson, self-inflicted).

      return (
        <div>
          <h1>User viewer</h1>
          <button onClick={() => setUserId(1)}>user 1</button>{' '}
          <button onClick={() => setUserId(2)}>user 2</button>
          <p>{user ? user.name : 'loading...'}</p>
          <p style={{ color: '#c33' }}>
            total requests: {user ? user.requestCount : 0} (and climbing —
            it should be 1 per button click)
          </p>
          {/* The other classic (Bug B) is deps: [] — "run once" —
              which STOPS refetching when userId changes: click
              "user 2" and the name never updates. Between "storm"
              and "frozen" lies the correct answer: [userId]. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

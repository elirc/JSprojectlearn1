<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 21 — no effect needed (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      // Two states — the two things the USER controls. Note what's
      // absent below: useEffect. This component doesn't import it.
      const [quantity, setQuantity] = useState(1);
      const [coupon, setCoupon] = useState('');
      const PRICE = 40;

      // The "effect chain" was just ARITHMETIC. Three consts, computed
      // in order, always mutually consistent, one render per change:
      const subtotal = quantity * PRICE;
      const discount = coupon === 'SAVE10' ? 0.1 : 0;
      const total = subtotal * (1 - discount);

      return (
        <div>
          <h1>Checkout</h1>
          <p>
            Quantity: {quantity}{' '}
            <button onClick={() => setQuantity(quantity + 1)}>+</button>
          </p>
          <input placeholder="coupon (try SAVE10)" value={coupon}
                 onChange={(e) => setCoupon(e.target.value)} />
          <p>Subtotal: ${subtotal}</p>
          <p>Discount: {discount * 100}%</p>
          <h3>Total: ${total}</h3>

          <p style={{ color: '#666', fontSize: 14 }}>
            When IS an effect right? When you synchronize with
            something OUTSIDE React: a server (17-20), a timer (18),
            the document title, localStorage (23), a browser API (25).
            The test: "outside world involved?" No -&gt; compute it
            (here) or do it in the event handler. Yes -&gt; effect,
            with deps and cleanup.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

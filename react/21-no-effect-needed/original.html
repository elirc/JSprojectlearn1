<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 21 — effects for everything (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A checkout summary by someone who learned "useEffect = where
    // logic goes". Every derived fact gets state + an effect.
    function App() {
      const [quantity, setQuantity] = useState(1);
      const [coupon, setCoupon] = useState('');
      const PRICE = 40;

      // Effect #1: "sync" the subtotal
      const [subtotal, setSubtotal] = useState(PRICE);
      useEffect(() => {
        setSubtotal(quantity * PRICE);
      }, [quantity]);

      // Effect #2: "sync" the discount with the coupon
      const [discount, setDiscount] = useState(0);
      useEffect(() => {
        setDiscount(coupon === 'SAVE10' ? 0.1 : 0);
      }, [coupon]);

      // Effect #3: "sync" the total with both of those
      const [total, setTotal] = useState(PRICE);
      useEffect(() => {
        setTotal(subtotal * (1 - discount));
      }, [subtotal, discount]);

      // Count the renders for one quantity click: render (quantity)
      // -> effect 1 sets subtotal -> render -> effect 3 sets total
      // -> render. THREE renders, two of which show HALF-UPDATED
      // numbers to anyone looking closely (subtotal new, total old).
      // The effects form a dependency CHAIN the author must keep
      // topologically sorted in their head. Add tax? A fourth
      // state + effect, wired into the chain in the right place.

      return (
        <div>
          <h1>Checkout</h1>
          <p>
            Quantity: {quantity}{' '}
            <button onClick={() => setQuantity(quantity + 1)}>+</button>
          </p>
          <input placeholder="coupon (try SAVE10)" value={coupon}
                 onChange={(e) => setCoupon(e.target.value)} />
          <p>Subtotal: ${subtotal}</p>
          <p>Discount: {discount * 100}%</p>
          <h3>Total: ${total}</h3>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

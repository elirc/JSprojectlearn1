<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 39 — pessimistic UI (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .post { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
          button { font-size: 16px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // The "server": slow (1.2s), and it fails 30% of the time.
    function likeOnServer(postId, liked) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (Math.random() < 0.3) reject(new Error('network hiccup'));
          else resolve({ postId, liked });
        }, 1200),
      );
    }

    function Post({ title }) {
      const [liked, setLiked] = useState(false);
      const [pending, setPending] = useState(false);
      const [error, setError] = useState(null);

      // PESSIMISTIC: wait for the server before showing anything.
      async function toggleLike() {
        setPending(true);
        setError(null);
        try {
          const result = await likeOnServer(1, !liked);
          setLiked(result.liked); // UI updates 1.2s after the click
        } catch (e) {
          setError(e.message);
        } finally {
          setPending(false);
        }
      }

      return (
        <div className="post">
          <strong>{title}</strong>
          <p>
            <button onClick={toggleLike} disabled={pending}>
              {liked ? '❤️' : '🤍'} {pending ? '(saving…)' : ''}
            </button>
            {error && <span style={{ color: '#c33' }}> {error} — try again</span>}
          </p>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1>Feed</h1>
          <Post title="Why modulo is underrated" />
          <Post title="A defence of the humble spreadsheet" />
          <p style={{ color: '#666', fontSize: 14 }}>
            Click a heart: NOTHING happens for 1.2 seconds — the
            button just greys out and says "saving…". Every like is a
            little wait. It's *correct* (the UI never shows an unsaved
            like), but it FEELS broken: users double-click, assume the
            app is slow, and stop liking things. For a low-stakes,
            usually-succeeds, easily-reversed action, making the user
            wait for the round trip is the wrong trade.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

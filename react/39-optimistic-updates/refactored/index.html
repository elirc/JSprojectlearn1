<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 39 — optimistic UI (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .post { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
          button { font-size: 16px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    function likeOnServer(postId, liked) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (Math.random() < 0.3) reject(new Error('network hiccup'));
          else resolve({ postId, liked });
        }, 1200),
      );
    }

    function Post({ title }) {
      const [liked, setLiked] = useState(false);
      const [error, setError] = useState(null);
      // Track the newest attempt so an old failure can't roll back a
      // newer click (the race lesson from project 19, write-side):
      const attemptRef = useRef(0);

      // OPTIMISTIC: update the UI NOW, tell the server in the
      // background, ROLL BACK if it objects.
      async function toggleLike() {
        const next = !liked;
        const attempt = ++attemptRef.current;

        setLiked(next);       // 1. instant feedback
        setError(null);

        try {
          await likeOnServer(1, next);           // 2. sync in background
        } catch (e) {
          if (attempt !== attemptRef.current) return; // a newer click superseded us
          setLiked(!next);    // 3. server said no: put it back
          setError(`couldn't save — ${e.message}`);
        }
      }

      return (
        <div className="post">
          <strong>{title}</strong>
          <p>
            <button onClick={toggleLike}>
              {liked ? '❤️' : '🤍'}
            </button>
            {error && <span style={{ color: '#c33' }}> {error}</span>}
          </p>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1>Feed</h1>
          <Post title="Why modulo is underrated" />
          <Post title="A defence of the humble spreadsheet" />
          <p style={{ color: '#666', fontSize: 14 }}>
            Click a heart: instant. ~30% of the time, a second later
            it quietly flips back with a note — the rollback. That's
            the optimistic trade: instant feedback for the common
            case, honest correction for the rare one. Right for likes,
            stars, toggles, reorders. WRONG for payments, deletes, or
            anything the user can't shrug off — those deserve the
            original's pessimistic pattern (and project 44's pending
            state).
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

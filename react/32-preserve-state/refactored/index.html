<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 32 — state survives tabs (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
          .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
          textarea { width: 100%; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Two honest fixes, both shown:

    // Fix A (used here): LIFT the precious state above the toggle.
    // The reply lives in App, which never unmounts; ReplyTab is a
    // controlled component (project 36's contract). Tab switches
    // can't touch state they don't own.
    function ReplyTab({ reply, onReplyChange }) {
      return (
        <div className="card">
          <p>Your reply:</p>
          <textarea rows="4" value={reply} onChange={(e) => onReplyChange(e.target.value)}
                    placeholder="type a long, thoughtful reply..." />
        </div>
      );
    }

    function DetailsTab() {
      return (
        <div className="card">
          <p>Customer: Ada Lovelace · Plan: Enterprise · Mood: patient, for now</p>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('reply');
      const [reply, setReply] = useState('');

      return (
        <div>
          <h1>Ticket #42</h1>
          <button onClick={() => setTab('reply')} disabled={tab === 'reply'}>Reply</button>
          <button onClick={() => setTab('details')} disabled={tab === 'details'}>Details</button>

          {/* Fix B (also shown): keep it MOUNTED, hide with CSS.
              display:none removes pixels but not the component —
              state, scroll position, and focus all survive. Good for
              heavy tabs you don't want to re-create per switch. */}
          <div style={{ display: tab === 'reply' ? 'block' : 'none' }}>
            <ReplyTab reply={reply} onReplyChange={setReply} />
          </div>
          {tab === 'details' && <DetailsTab />}

          <p style={{ color: '#666', fontSize: 14 }}>
            Type, switch, return: the reply survives — doubly (lifted
            state AND css-hidden). In your own code pick ONE:
            lift the state (A) when the data matters beyond the tab;
            hide with CSS (B) when the whole subtree should persist
            cheaply. And keep using unmount (project 04's `&&`) when
            throwing state away is what you WANT — that's project 31.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

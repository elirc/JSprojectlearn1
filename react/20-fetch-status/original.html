<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 20 — three booleans (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // A fake API: even ids succeed, odd ids fail.
    function fetchReport(id) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (id % 2 === 0) resolve(`Report #${id}: all systems nominal`);
          else reject(new Error(`Report #${id} not found`));
        }, 600),
      );
    }

    function App() {
      const [reportId, setReportId] = useState(2);
      // The classic trio — three independent booleans-ish for ONE fact:
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);
      const [data, setData] = useState(null);

      useEffect(() => {
        setIsLoading(true);
        // forgot: setError(null). Remember this line.
        fetchReport(reportId)
          .then((d) => { setData(d); setIsLoading(false); })
          .catch((e) => { setError(e.message); setIsLoading(false); });
          // forgot: setData(null) on error, too.
      }, [reportId]);

      return (
        <div>
          <h1>Report viewer</h1>
          <button onClick={() => setReportId(2)}>report 2 (ok)</button>{' '}
          <button onClick={() => setReportId(3)}>report 3 (fails)</button>{' '}
          <button onClick={() => setReportId(4)}>report 4 (ok)</button>

          {isLoading && <p>Loading...</p>}
          {error && <p style={{ color: 'red' }}>Error: {error}</p>}
          {data && <p>{data}</p>}

          <p style={{ color: '#666', fontSize: 14 }}>
            Click 3 (fails), then 4 (succeeds): the ERROR STAYS on
            screen next to the fresh data — two "truths" at once.
            Click 3 again after 4: stale report 4 shows WITH the error
            AND "Loading...". Three flags = 2x2x2 combinations for a
            request that is only ever in ONE of four states. The
            handlers must reset every OTHER flag on every transition,
            and this one forgot two of those resets. Almost every
            hand-rolled fetch does.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 20 — one status (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function fetchReport(id) {
      return new Promise((resolve, reject) =>
        setTimeout(() => {
          if (id % 2 === 0) resolve(`Report #${id}: all systems nominal`);
          else reject(new Error(`Report #${id} not found`));
        }, 600),
      );
    }

    function App() {
      const [reportId, setReportId] = useState(2);

      // ONE object for one fact. `status` names which of the four
      // states the request is in; data/error ride along and are
      // REPLACED WHOLESALE on every transition — stale leftovers
      // can't survive because nothing is patched field-by-field.
      // (This is a discriminated union — the TypeScript track's
      // project 10 makes the compiler enforce it.)
      const [request, setRequest] = useState({ status: 'idle' });

      useEffect(() => {
        let stale = false; // project 19's race guard, included from now on
        setRequest({ status: 'loading' });

        fetchReport(reportId)
          .then((data) => { if (!stale) setRequest({ status: 'success', data }); })
          .catch((error) => { if (!stale) setRequest({ status: 'error', error: error.message }); });

        return () => { stale = true; };
      }, [reportId]);

      return (
        <div>
          <h1>Report viewer</h1>
          <button onClick={() => setReportId(2)}>report 2 (ok)</button>{' '}
          <button onClick={() => setReportId(3)}>report 3 (fails)</button>{' '}
          <button onClick={() => setReportId(4)}>report 4 (ok)</button>

          <RequestView request={request} />

          <p style={{ color: '#666', fontSize: 14 }}>
            Click 3, then 4, then 3 — exactly one thing shows at every
            moment, because exactly one state EXISTS at every moment.
            No reset lines were needed; there is nothing to reset.
          </p>
        </div>
      );
    }

    // Rendering one-state-at-a-time is a switch, not flag algebra
    // (early-return ladder — project 04):
    function RequestView({ request }) {
      switch (request.status) {
        case 'idle': return <p>Pick a report.</p>;
        case 'loading': return <p>Loading...</p>;
        case 'error': return <p style={{ color: 'red' }}>Error: {request.error}</p>;
        case 'success': return <p>{request.data}</p>;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

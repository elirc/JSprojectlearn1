<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 11 — stale closures (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          h2 { font-size: 40px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [count, setCount] = useState(0);

      // Bug 1: a one-second ticker that counts 0 -> 1 and STOPS.
      useEffect(() => {
        const id = setInterval(() => {
          setCount(count + 1);
          // `count` here is the count from the render when this
          // effect ran — the FIRST render, where count was 0. The
          // interval closure captured that 0 forever. So every tick
          // computes 0 + 1. The display goes to 1 and freezes.
        }, 1000);
        return () => clearInterval(id);
      }, []); // <- empty deps: effect runs once, closure frozen once

      // Bug 2: +3 that only gives +1.
      function plusThree() {
        setCount(count + 1);
        setCount(count + 1);
        setCount(count + 1);
        // All three lines read the SAME `count` from this render.
        // If count is 5: set(6), set(6), set(6). One increment.
        // setCount doesn't change the local variable — it schedules
        // a re-render; `count` stays whatever it was all function long.
      }

      return (
        <div>
          <h1>Ticker</h1>
          <h2>{count}</h2>
          <p>(the auto-ticker froze at 1, seconds ago)</p>
          <button onClick={plusThree}>+3 (actually +1)</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 11 — updater functions (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          h2 { font-size: 40px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [count, setCount] = useState(0);

      useEffect(() => {
        const id = setInterval(() => {
          // The UPDATER FORM: pass a function, and React calls it
          // with the CURRENT state at update time. No captured
          // variable involved — nothing to go stale. The ticker
          // ticks forever, and the effect can honestly keep its
          // empty deps (it uses no render-scope values at all).
          setCount((current) => current + 1);
        }, 1000);
        return () => clearInterval(id);
      }, []);

      function plusThree() {
        // Each updater receives the result of the previous one:
        // 5 -> 6 -> 7 -> 8. Three increments, as advertised.
        setCount((current) => current + 1);
        setCount((current) => current + 1);
        setCount((current) => current + 1);
      }

      return (
        <div>
          <h1>Ticker</h1>
          <h2>{count}</h2>
          <p>(ticking forever, and +3 really adds 3)</p>
          <button onClick={plusThree}>+3</button>

          <p style={{ color: '#666', fontSize: 14 }}>
            Mental model: a render is a snapshot. Every variable in a
            component function — including <code>count</code> — is
            frozen at that render's value. Handlers and effects created
            during that render close over the snapshot. When the NEXT
            state must be computed from the CURRENT state, don't read
            the snapshot — use <code>set(current =&gt; next)</code> and
            let React hand you the live value.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 14 — event handler mistakes (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          button { margin: 4px; } .row { margin: 6px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [log, setLog] = useState([]);
      const [armed, setArmed] = useState(false);
      const say = (msg) => setLog((l) => [...l, msg]);

      return (
        <div>
          <h1>Event handler bloopers</h1>

          {/* Blooper 1: CALLING the handler instead of passing it.
              This fires on RENDER, not on click — and because it
              sets state, it re-renders, which calls it again...
              React bails with an error. (Commented out so the page
              survives; uncomment to meet the infinite loop.) */}
          {/* <button onClick={say('boom')}>calls on render!</button> */}

          {/* Blooper 2: the "fixed" version someone writes next —
              works, but for the WRONG stated reason; see README. */}
          <button onClick={() => say('clicked')}>log a click</button>

          {/* Blooper 3: passing an argument by calling... again: */}
          <div className="row">
            {['small', 'medium', 'large'].map((size) => (
              // this LOOKS like "call say when clicked"... but the
              // authors wrote onClick={say(size)} first, got the
              // infinite render, then cargo-culted arrow functions
              // everywhere without understanding why.
              <button key={size} onClick={() => say(`chose ${size}`)}>{size}</button>
            ))}
          </div>

          {/* Blooper 4: a submit button inside a form, no
              preventDefault — the page RELOADS and the log vanishes: */}
          <form onSubmit={() => say('submitted (you will never read this)')}>
            <button type="submit">submit (reloads the page!)</button>
          </form>

          {/* Blooper 5: nested click targets, no stopPropagation
              thinking — clicking DISARM also triggers the row's
              select handler: */}
          <div className="row"
               style={{ border: '1px solid #ccc', padding: 8, cursor: 'pointer' }}
               onClick={() => say('row selected')}>
            row (click selects) — armed: {String(armed)}
            <button onClick={() => { setArmed(false); say('disarmed'); }}>
              disarm (also selects the row!)
            </button>
          </div>

          <pre>{log.join('\n')}</pre>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

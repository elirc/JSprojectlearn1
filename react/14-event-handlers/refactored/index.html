<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 14 — event handlers done right (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          button { margin: 4px; } .row { margin: 6px 0; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [log, setLog] = useState([]);
      const [armed, setArmed] = useState(true);
      const say = (msg) => setLog((l) => [...l, msg]);

      // The one rule that explains everything below:
      //   onClick wants A FUNCTION (to call later),
      //   onClick={f}        passes f            -> called on click. right.
      //   onClick={f()}      passes f's RESULT   -> f ran during render. wrong.
      //   onClick={() => f(x)} passes a function -> f(x) on click. right,
      //                        and it's HOW you pass arguments.

      function handleLogClick() {
        say('clicked');
      }

      function handleChooseSize(size) {
        say(`chose ${size}`);
      }

      function handleSubmit(event) {
        event.preventDefault(); // the form's default is NAVIGATION —
        say('submitted');       // opt out, then do your thing
      }

      function handleDisarm(event) {
        event.stopPropagation(); // this click is MINE — don't also
        setArmed(false);         // trigger the row's select handler
        say('disarmed');
      }

      return (
        <div>
          <h1>Event handlers, working</h1>

          <button onClick={handleLogClick}>log a click</button>

          <div className="row">
            {['small', 'medium', 'large'].map((size) => (
              <button key={size} onClick={() => handleChooseSize(size)}>
                {size}
              </button>
            ))}
          </div>

          <form onSubmit={handleSubmit}>
            <button type="submit">submit (no reload)</button>
          </form>

          <div className="row"
               style={{ border: '1px solid #ccc', padding: 8, cursor: 'pointer' }}
               onClick={() => say('row selected')}>
            row (click selects) — armed: {String(armed)}
            <button onClick={handleDisarm}>disarm (only disarms)</button>
          </div>

          <pre>{log.join('\n')}</pre>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 16 — boolean wizard (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          .step { border: 1px solid #ccc; border-radius: 8px; padding: 12px; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // A checkout wizard tracked with one boolean per screen, plus a
    // couple more for good measure. Sound familiar? (js#40, but now
    // the inconsistent state is USER-VISIBLE as broken UI.)
    function App() {
      const [showCart, setShowCart] = useState(true);
      const [showShipping, setShowShipping] = useState(false);
      const [showPayment, setShowPayment] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [isDone, setIsDone] = useState(false);

      function goToShipping() {
        setShowCart(false);
        setShowShipping(true);
        // every navigation must remember to flip the RIGHT pair of
        // booleans. Miss one and two screens show at once.
      }

      function goToPayment() {
        setShowShipping(false);
        setShowPayment(true);
      }

      function backToShipping() {
        setShowPayment(false);
        setShowShipping(true);
      }

      function goToConfirm() {
        setShowPayment(false);
        // BUG (a realistic one): whoever added the confirm screen
        // forgot setShowConfirm(true) here. Click "review order":
        // every boolean is false — the wizard renders NOTHING. A
        // blank screen, no error, at the exact moment the user was
        // about to pay.
      }

      function finish() {
        setShowConfirm(false);
        setIsDone(true);
      }

      return (
        <div>
          <h1>Checkout</h1>
          {/* progress indicator? "which step are we on" doesn't
              exist as a value — you'd have to if-chain the booleans. */}
          {showCart && (
            <div className="step">
              <h3>1. Cart</h3>
              <button onClick={goToShipping}>continue</button>
            </div>
          )}
          {showShipping && (
            <div className="step">
              <h3>2. Shipping</h3>
              <button onClick={goToPayment}>continue</button>
            </div>
          )}
          {showPayment && (
            <div className="step">
              <h3>3. Payment</h3>
              <button onClick={backToShipping}>back</button>{' '}
              <button onClick={goToConfirm}>review order</button>
            </div>
          )}
          {showConfirm && (
            <div className="step">
              <h3>4. Confirm</h3>
              <button onClick={finish}>place order</button>
            </div>
          )}
          {isDone && <h3>✅ Order placed!</h3>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

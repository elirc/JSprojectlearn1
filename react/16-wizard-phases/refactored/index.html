<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 16 — phase wizard (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
          .step { border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
          .crumbs span { margin-right: 8px; color: #bbb; }
          .crumbs .here { color: #000; font-weight: bold; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // The wizard's flow as DATA (js#40's transition table, in a UI).
    // One state value; impossible to show two screens at once because
    // there is only one "where we are".
    const STEPS = ['cart', 'shipping', 'payment', 'confirm', 'done'];

    const SCREENS = {
      cart: { title: '1. Cart', next: 'shipping' },
      shipping: { title: '2. Shipping', next: 'payment', back: 'cart' },
      payment: { title: '3. Payment', next: 'confirm', back: 'shipping' },
      confirm: { title: '4. Confirm', next: 'done', back: 'payment' },
    };

    function App() {
      const [step, setStep] = useState('cart');

      if (step === 'done') return <h3>✅ Order placed!</h3>;

      const screen = SCREENS[step];

      return (
        <div>
          <h1>Checkout</h1>

          {/* a progress indicator is trivial when "where we are" is a
              value — derived, like everything should be (project 09): */}
          <p className="crumbs">
            {STEPS.slice(0, -1).map((s) => (
              <span key={s} className={s === step ? 'here' : ''}>
                {SCREENS[s].title}
              </span>
            ))}
          </p>

          <div className="step">
            <h3>{screen.title}</h3>
            {screen.back && (
              <button onClick={() => setStep(screen.back)}>back</button>
            )}{' '}
            <button onClick={() => setStep(screen.next)}>
              {step === 'confirm' ? 'place order' : 'continue'}
            </button>
          </div>

          <p style={{ color: '#666', fontSize: 14 }}>
            The original's blank-screen bug can't be written here:
            navigation is <code>setStep(screen.next)</code>, and
            <code>next</code> comes from the table. There is no pair of
            booleans to half-flip. Adding a step = one row in SCREENS.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

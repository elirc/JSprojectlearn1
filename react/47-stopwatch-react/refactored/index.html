<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 47 — clock-derived stopwatch (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; text-align: center; margin-top: 60px; }
          h2 { font-size: 48px; font-family: monospace; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // js#46's fix, translated to React state:
    //   state = WHEN things happened (timestamps), not "how much
    //   time" — elapsed is DERIVED from the clock at render time.
    function App() {
      // { running, startedAt, accumulatedMs } — the js#46 shape:
      const [watch, setWatch] = useState({
        running: false, startedAt: null, accumulatedMs: 0,
      });
      // one dummy state whose ONLY job is causing repaints:
      const [, setRepaint] = useState(0);

      // the interval carries ZERO time information — it just asks
      // React to redraw so the derived value gets re-read:
      useEffect(() => {
        if (!watch.running) return;
        const id = setInterval(() => setRepaint((n) => n + 1), 100);
        return () => clearInterval(id);
      }, [watch.running]);

      function startStop() {
        setWatch((w) =>
          w.running
            ? { running: false, startedAt: null,
                accumulatedMs: w.accumulatedMs + (Date.now() - w.startedAt) }
            : { ...w, running: true, startedAt: Date.now() });
      }

      function reset() {
        setWatch({ running: false, startedAt: null, accumulatedMs: 0 });
      }

      // derived, from the CLOCK — exact no matter how late the
      // repaint tick arrives (project 09 meets js#46):
      const elapsedMs = watch.accumulatedMs +
        (watch.running ? Date.now() - watch.startedAt : 0);

      const mins = Math.floor(elapsedMs / 60000);
      const secs = Math.floor((elapsedMs % 60000) / 1000);
      const tenths = Math.floor((elapsedMs % 1000) / 100);

      return (
        <div>
          <h1>Stopwatch</h1>
          <h2>
            {String(mins).padStart(2, '0')}:
            {String(secs).padStart(2, '0')}.
            {tenths}
          </h2>
          <button onClick={startStop}>{watch.running ? 'stop' : 'start'}</button>{' '}
          <button onClick={reset}>reset</button>
          <p style={{ color: '#666', fontSize: 14 }}>
            Background the tab for two minutes: the repaints stop (the
            browser throttles them) but TIME doesn't live in the
            repaints — come back and the very next render derives the
            true elapsed from Date.now(). Late ticks cost display
            smoothness, never correctness. Pause banks the exact
            milliseconds (no fraction-of-a-tick lost).
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

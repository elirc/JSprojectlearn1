<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 15 — classList poking (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
    .section { border: 1px solid #ccc; border-radius: 8px; margin: 8px 0; }
    .section h3 { margin: 0; padding: 10px; cursor: pointer; background: #f4f4f4; }
    .section .body { padding: 10px; }
    .section.collapsed .body { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    // An accordion built by someone who learned jQuery first: grab
    // the element, toggle a class. React renders it once; after
    // that, WE own the DOM. What could go wrong.
    function Section({ title, children }) {
      const ref = useRef(null);

      function toggle() {
        ref.current.classList.toggle('collapsed'); // invisible to React
      }

      return (
        <div className="section" ref={ref}>
          <h3 onClick={toggle}>{title}</h3>
          <div className="body">{children}</div>
        </div>
      );
    }

    function App() {
      const [showAll, setShowAll] = useState(true);

      return (
        <div>
          <h1>FAQ</h1>
          <button onClick={() => setShowAll(!showAll)}>
            re-render app (toggles a filter)
          </button>
          <p style={{ color: '#666', fontSize: 14 }}>
            1. Collapse a section (works!).<br />
            2. There's no way to add "collapse all" — the collapsed
            state lives in classLists React can't see.<br />
            3. The section count below is a lie waiting to happen:
            nothing can derive "2 of 3 open" from class attributes.
          </p>
          {showAll && <Section title="What is this?">A FAQ.</Section>}
          <Section title="Why is the sky blue?">Rayleigh scattering.</Section>
          <Section title="Tabs or spaces?">Yes.</Section>
          {/* Click "re-render app" after collapsing the FIRST
              section, twice: the section unmounts and remounts, and
              comes back EXPANDED — the classList was on a DOM node
              React just threw away and rebuilt. State stored in the
              DOM has the lifetime of the DOM, and React recycles the
              DOM whenever it likes. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 02 — list from data (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style> body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
          li.done { text-decoration: line-through; color: #999; }
          li { cursor: pointer; } </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const STEPS = [
      { id: 'tests', label: 'Run the tests' },
      { id: 'changelog', label: 'Update the changelog' },
      { id: 'tag', label: 'Tag the release' },
      { id: 'announce', label: 'Tell the team' },
    ];

    function App() {
      // ONE piece of state: the set of done ids. The list itself is
      // data; state only records what the user did to it.
      const [doneIds, setDoneIds] = useState(new Set());

      function toggle(id) {
        setDoneIds((current) => {
          const next = new Set(current);       // copy, never mutate (js#26)
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      }

      return (
        <div>
          <h1>Release checklist</h1>
          {/* derived, so it can never disagree with the list: */}
          <p>{doneIds.size} of {STEPS.length} done</p>
          <ul>
            {STEPS.map((step) => (
              <li
                key={step.id}
                className={doneIds.has(step.id) ? 'done' : ''}
                onClick={() => toggle(step.id)}
              >
                {step.label}
              </li>
            ))}
          </ul>
          <button onClick={() => setDoneIds(new Set())}>Reset all</button>
          {/* "Reset all" was ONE line. In the original it's four
              setter calls that must grow with every new step. */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 01 — one giant component (original)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .badge { background: #36c; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ONE component renders the entire team page. It works! But every
    // piece of UI is welded to every other piece — the avatar markup
    // is pasted three times, the online-badge logic is pasted three
    // times, and adding a fourth member means copy-pasting 15 lines
    // and editing them carefully (spot the bug already in member 3).
    function App() {
      const [filter, setFilter] = useState('');

      return (
        <div>
          <h1>Team</h1>
          <input
            placeholder="filter by name..."
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />

          {'Ada'.toLowerCase().includes(filter.toLowerCase()) && (
            <div className="card">
              <img src="https://i.pravatar.cc/48?u=ada" width="48" style={{ borderRadius: 24, verticalAlign: 'middle' }} />
              <strong style={{ marginLeft: 8 }}>Ada Lovelace</strong>
              <span style={{ marginLeft: 8 }} className="badge">online</span>
              <p>First programmer. Writes notes longer than the program.</p>
            </div>
          )}

          {'Grace'.toLowerCase().includes(filter.toLowerCase()) && (
            <div className="card">
              <img src="https://i.pravatar.cc/48?u=grace" width="48" style={{ borderRadius: 24, verticalAlign: 'middle' }} />
              <strong style={{ marginLeft: 8 }}>Grace Hopper</strong>
              <p>Invented the compiler. Found the first actual bug.</p>
            </div>
          )}

          {'Alan'.toLowerCase().includes(filter.toLowerCase()) && (
            <div className="card">
              <img src="https://i.pravatar.cc/48?u=alan" width="48" style={{ borderRadius: 12, verticalAlign: 'middle' }} />
              {/* ^ radius 12, not 24 — the copy-paste drifted. Nobody will
                  notice until a designer files "avatar 3 looks square". */}
              <strong style={{ marginLeft: 8 }}>Alan Turing</strong>
              <span style={{ marginLeft: 8 }} className="badge">online</span>
              <p>Decides whether things halt. Usually they don't.</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

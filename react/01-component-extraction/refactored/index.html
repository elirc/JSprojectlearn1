<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>React 01 — extracted components (refactored)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .badge { background: #36c; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Content is DATA (the JS track's oldest lesson)...
    const TEAM = [
      { id: 'ada', name: 'Ada Lovelace', online: true,
        bio: 'First programmer. Writes notes longer than the program.' },
      { id: 'grace', name: 'Grace Hopper', online: false,
        bio: 'Invented the compiler. Found the first actual bug.' },
      { id: 'alan', name: 'Alan Turing', online: true,
        bio: "Decides whether things halt. Usually they don't." },
    ];

    // ...and each piece of UI is a COMPONENT: a function from props to
    // JSX. The avatar exists ONCE — its border radius cannot drift.
    function Avatar({ userId }) {
      return (
        <img
          src={`https://i.pravatar.cc/48?u=${userId}`}
          width="48"
          style={{ borderRadius: 24, verticalAlign: 'middle' }}
        />
      );
    }

    function MemberCard({ member }) {
      return (
        <div className="card">
          <Avatar userId={member.id} />
          <strong style={{ marginLeft: 8 }}>{member.name}</strong>
          {member.online && <span style={{ marginLeft: 8 }} className="badge">online</span>}
          <p>{member.bio}</p>
        </div>
      );
    }

    // App now reads like a table of contents: a filter input and a
    // list of member cards. Adding a member = adding a data row.
    function App() {
      const [filter, setFilter] = useState('');

      const visibleMembers = TEAM.filter((member) =>
        member.name.toLowerCase().includes(filter.toLowerCase()),
      );

      return (
        <div>
          <h1>Team</h1>
          <input
            placeholder="filter by name..."
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />
          {visibleMembers.map((member) => (
            <MemberCard key={member.id} member={member} />
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Router (original)</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="#/">Home</a>
    <a href="#/users">Users</a>
    <a href="#/users/7">Ada</a>
    <a href="#/about">About</a>
  </nav>
  <div id="app"></div>

  <script>
    var USERS = { 7: "Ada Lovelace", 8: "Grace Hopper" };

    // Problem 1: the router IS a switch statement over exact strings.
    // "#/users/7" can't match anything — parameterized URLs are
    // impossible, so every user needs a hand-written case (see the
    // sad workaround below).
    function route() {
      var hash = location.hash;

      // Problem 2: matching, rendering, and data access are one
      // blob per case. None of it is testable — the "router" only
      // exists inside a browser event handler.
      switch (hash) {
        case "":
        case "#/":
          document.getElementById("app").innerHTML = "<h1>Home</h1>";
          break;
        case "#/users":
          var html = "<h1>Users</h1><ul>";
          for (var id in USERS) {
            html += '<li><a href="#/users/' + id + '">' + USERS[id] + "</a></li>";
          }
          document.getElementById("app").innerHTML = html + "</ul>";
          break;
        // The workaround for Problem 1 — a case per user, forever:
        case "#/users/7":
          document.getElementById("app").innerHTML = "<h1>" + USERS[7] + "</h1>";
          break;
        case "#/users/8":
          document.getElementById("app").innerHTML = "<h1>" + USERS[8] + "</h1>";
          break;
        case "#/about":
          document.getElementById("app").innerHTML = "<h1>About</h1>";
          break;
        // Problem 3: unknown URL? Fall through to... nothing. The
        // old page silently stays on screen with a wrong URL above
        // it. No 404 state exists.
      }
    }

    window.onhashchange = route;
    route();
    // Problem 4 (subtle): typing #/users/9 shows... whatever was
    // there before. And "#/Users" (capital U) is a different string,
    // so it breaks too. Exact-string routing is a pile of these.
  </script>
</body>
</html>

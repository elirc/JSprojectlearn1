<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Connect Four (original)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #board { border-collapse: collapse; margin: 20px auto; }
    #board td { width: 50px; height: 50px; border: 2px solid #226;
                border-radius: 50%; background: #eee; cursor: pointer; }
    td.red { background: #c33; } td.yellow { background: #cc2; }
  </style>
</head>
<body>
  <h1>Connect Four</h1>
  <p id="status">Red's turn</p>
  <table id="board"></table>

  <script>
    var board = []; // 6 rows x 7 cols of "", "red", "yellow"
    var current = "red";
    var gameOver = false;

    // build the table and the array together
    var table = document.getElementById("board");
    for (var r = 0; r < 6; r++) {
      board.push(["", "", "", "", "", "", ""]);
      var tr = document.createElement("tr");
      for (var c = 0; c < 7; c++) {
        var td = document.createElement("td");
        td.id = "cell-" + r + "-" + c;
        td.onclick = makeHandler(c);
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }

    function makeHandler(c) {
      // ONE function does everything: drop, draw, check win, check
      // draw, flip turns, update status. ~80 lines of tangled concerns.
      return function () {
        if (gameOver) return;

        // find the lowest empty row in this column
        var row = -1;
        for (var r = 5; r >= 0; r--) {
          if (board[r][c] == "") { row = r; break; }
        }
        if (row == -1) return; // column full

        board[row][c] = current;
        document.getElementById("cell-" + row + "-" + c).className = current;

        // --- win check: four nearly identical loops, hand-written ---
        var won = false;
        // horizontal
        for (var start = 0; start <= 3; start++) {
          if (board[row][start] == current && board[row][start + 1] == current &&
              board[row][start + 2] == current && board[row][start + 3] == current) {
            won = true;
          }
        }
        // vertical
        for (var start = 0; start <= 2; start++) {
          if (board[start][c] == current && board[start + 1][c] == current &&
              board[start + 2][c] == current && board[start + 3][c] == current) {
            won = true;
          }
        }
        // diagonal down-right
        for (var r2 = 0; r2 <= 2; r2++) {
          for (var c2 = 0; c2 <= 3; c2++) {
            if (board[r2][c2] == current && board[r2 + 1][c2 + 1] == current &&
                board[r2 + 2][c2 + 2] == current && board[r2 + 3][c2 + 3] == current) {
              won = true;
            }
          }
        }
        // diagonal down-left
        for (var r3 = 0; r3 <= 2; r3++) {
          for (var c3 = 3; c3 <= 6; c3++) {
            if (board[r3][c3] == current && board[r3 + 1][c3 - 1] == current &&
                board[r3 + 2][c3 - 2] == current && board[r3 + 3][c3 - 3] == current) {
              won = true;
            }
          }
        }
        // (Did you spot it? The horizontal check only scans row `row`
        // columns 0-3... wait, no, start 0..3 covers all windows. But
        // would YOU bet money on all four loops being right? Neither
        // would we. And there's no way to test them without clicking.)

        if (won) {
          gameOver = true;
          document.getElementById("status").innerText = current + " wins!";
          return;
        }

        // draw check
        var full = true;
        for (var c4 = 0; c4 < 7; c4++) {
          if (board[0][c4] == "") full = false;
        }
        if (full) {
          gameOver = true;
          document.getElementById("status").innerText = "Draw!";
          return;
        }

        current = current == "red" ? "yellow" : "red";
        document.getElementById("status").innerText = current + "'s turn";
      };
    }
  </script>
</body>
</html>

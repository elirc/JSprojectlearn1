<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bar chart (original)</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    canvas { border: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Monthly expenses</h1>
  <canvas id="chart" width="480" height="280"></canvas>

  <script>
    // Where is the data? Smeared through the drawing code. Where is the
    // scale? Also in the drawing code — as the number 8, chosen because
    // it happened to fit the six numbers below on the day this was written.
    const ctx = document.getElementById("chart").getContext("2d");

    // ---- gridlines, hand-placed -------------------------------------
    // 0 / 500 / 1000 / 1500, because today's biggest bar is 1450. The y
    // values 240, 177.5, 115, 52.5 are "240 minus value / 8", computed
    // by hand, in my head, once.
    ctx.font = "12px sans-serif";
    ctx.strokeStyle = "#e6e6e6";
    ctx.fillStyle = "#777";
    ctx.beginPath(); ctx.moveTo(50, 240);   ctx.lineTo(460, 240);   ctx.stroke();
    ctx.fillText("0", 30, 244);
    ctx.beginPath(); ctx.moveTo(50, 177.5); ctx.lineTo(460, 177.5); ctx.stroke();
    ctx.fillText("500", 18, 181);
    ctx.beginPath(); ctx.moveTo(50, 115);   ctx.lineTo(460, 115);   ctx.stroke();
    ctx.fillText("1000", 12, 119);
    ctx.beginPath(); ctx.moveTo(50, 52.5);  ctx.lineTo(460, 52.5);  ctx.stroke();
    ctx.fillText("1500", 12, 56);

    // ---- the bars, one hand-written block per month -----------------
    // x jumps by 68 each time, also by hand. 240 is the baseline. The
    // height is "the number divided by 8". Read one block and you have
    // read all six.
    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(60, 240 - 150, 40, 150);      // Jan: 1200 / 8 = 150
    ctx.fillStyle = "#333";
    ctx.fillText("Jan", 66, 258);

    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(128, 240 - 117.5, 40, 117.5); // Feb: 940 / 8
    ctx.fillStyle = "#333";
    ctx.fillText("Feb", 134, 258);

    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(196, 240 - 181, 40, 181);     // Mar: 1450 / 8
    ctx.fillStyle = "#333";
    ctx.fillText("Mar", 202, 258);

    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(264, 240 - 97.5, 40, 97.5);   // Apr: 780 / 8
    ctx.fillStyle = "#333";
    ctx.fillText("Apr", 270, 258);

    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(332, 240 - 140, 40, 140);     // May: 1120 / 8
    ctx.fillStyle = "#333";
    ctx.fillText("May", 338, 258);

    ctx.fillStyle = "#4e79a7";
    ctx.fillRect(400, 240 - 126.25, 40, 126.25); // Jun: 1010 / 8
    ctx.fillStyle = "#333";
    ctx.fillText("Jun", 406, 258);

    // ---- now try to CHANGE anything ---------------------------------
    // 1. A big month: make Mar 4200. Its bar is 4200/8 = 525px tall on a
    //    280px canvas. It silently draws off the top; the "1500" label
    //    still sits there lying about the scale. Nothing errors.
    // 2. A seventh month: the next x is 468, and the canvas is 480 wide
    //    with a 20px right margin. Half of Jul falls off the edge.
    // 3. A refund month (-300): 240 - (-37.5) = 277.5 with height -37.5.
    //    Negative heights draw upward in canvas, so the bar lands in the
    //    wrong place with no warning.
    // 4. Resize the canvas to 640x360: every one of the 30 numbers above
    //    is now wrong, and you must recompute them all by hand.
    // 5. Ask "how tall is the Mar bar?" from a test. You can't — the
    //    answer only exists as pixels already painted on a canvas.
  </script>
</body>
</html>

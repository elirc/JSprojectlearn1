<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bar chart (refactored)</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
    canvas { border: 1px solid #eee; }
    button { margin-right: 6px; }
    #controls { margin-bottom: 10px; }
    #readout { font: 12px/1.6 monospace; color: #555; white-space: pre; }
  </style>
</head>
<body>
  <h1>Monthly expenses</h1>

  <div id="controls">
    <button data-set="steady">steady year</button>
    <button data-set="spike">a 4200 spike</button>
    <button data-set="thirteen">13 months</button>
    <button data-set="refunds">with refunds</button>
    <button data-set="empty">no data</button>
    <button id="resize">toggle size</button>
  </div>

  <canvas id="chart" width="640" height="320"></canvas>
  <div id="readout"></div>

  <script>
    // --- inline copy of refactored/chart.js (tested in chart.test.js;
    //     file:// pages can't import modules) ------------------------
    const DEFAULT_PADDING = { top: 24, right: 16, bottom: 34, left: 52 };

    function normalizePadding(padding) {
      if (padding === undefined) return { ...DEFAULT_PADDING };
      if (typeof padding === 'number') {
        if (!Number.isFinite(padding) || padding < 0) {
          throw new RangeError(`padding must be a non-negative number, got ${padding}`);
        }
        return { top: padding, right: padding, bottom: padding, left: padding };
      }
      return { ...DEFAULT_PADDING, ...padding };
    }

    function niceStep(rawStep) {
      if (!(rawStep > 0)) return 1;
      const magnitude = 10 ** Math.floor(Math.log10(rawStep));
      const normalized = rawStep / magnitude;
      const nice = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
      return nice * magnitude;
    }

    function computeTicks(min, max, count = 4) {
      if (max === min) return [min];
      const step = niceStep((max - min) / Math.max(1, count));
      const start = Math.ceil(min / step) * step;
      const ticks = [];
      for (let i = 0; start + i * step <= max + step * 1e-9; i++) {
        ticks.push(Number((start + i * step).toPrecision(12)));
      }
      return ticks;
    }

    function computeLayout(data, options = {}) {
      const {
        width = 480, height = 280, padding,
        barRatio = 0.68, tickCount = 4, formatValue = String,
      } = options;

      if (!Array.isArray(data)) throw new TypeError('data must be an array of { label, value }');
      if (!Number.isFinite(width) || width <= 0) throw new RangeError(`width must be a positive number, got ${width}`);
      if (!Number.isFinite(height) || height <= 0) throw new RangeError(`height must be a positive number, got ${height}`);
      if (!(barRatio > 0 && barRatio <= 1)) throw new RangeError(`barRatio must be in (0, 1], got ${barRatio}`);

      const pad = normalizePadding(padding);
      const plot = {
        x: pad.left, y: pad.top,
        width: Math.max(0, width - pad.left - pad.right),
        height: Math.max(0, height - pad.top - pad.bottom),
      };

      let min = 0;
      let max = 0;
      data.forEach((point, index) => {
        if (!Number.isFinite(point?.value)) {
          throw new TypeError(`data[${index}].value must be a finite number, got ${point?.value}`);
        }
        if (point.value < min) min = point.value;
        if (point.value > max) max = point.value;
      });

      const span = max - min;
      const yOf = (value) =>
        span === 0 ? plot.y + plot.height : plot.y + plot.height * ((max - value) / span);
      const baselineY = yOf(0);

      const slot = data.length === 0 ? 0 : plot.width / data.length;
      const barWidth = slot * barRatio;

      const bars = data.map((point, index) => {
        const valueY = yOf(point.value);
        const x = plot.x + index * slot + (slot - barWidth) / 2;
        return {
          label: String(point.label ?? ''), value: point.value,
          x, width: barWidth,
          y: Math.min(valueY, baselineY),
          height: Math.abs(valueY - baselineY),
          centerX: x + barWidth / 2,
          negative: point.value < 0,
        };
      });

      const ticks = computeTicks(min, max, tickCount).map((value) => ({
        value, label: formatValue(value), y: yOf(value),
      }));

      return { width, height, padding: pad, plot, min, max, baselineY, bars, ticks };
    }

    function draw(ctx, layout, style = {}) {
      const {
        barColor = '#4e79a7', negativeColor = '#e15759', gridColor = '#e6e6e6',
        axisColor = '#999', textColor = '#333', background = '#fff',
        font = '12px sans-serif',
      } = style;

      ctx.clearRect(0, 0, layout.width, layout.height);
      if (background) { ctx.fillStyle = background; ctx.fillRect(0, 0, layout.width, layout.height); }

      ctx.font = font;
      ctx.textBaseline = 'middle';

      for (const tick of layout.ticks) {
        ctx.strokeStyle = tick.value === 0 ? axisColor : gridColor;
        ctx.beginPath();
        ctx.moveTo(layout.plot.x, tick.y);
        ctx.lineTo(layout.plot.x + layout.plot.width, tick.y);
        ctx.stroke();
        ctx.fillStyle = textColor;
        ctx.textAlign = 'right';
        ctx.fillText(tick.label, layout.plot.x - 8, tick.y);
      }

      for (const bar of layout.bars) {
        ctx.fillStyle = bar.negative ? negativeColor : barColor;
        ctx.fillRect(bar.x, bar.y, bar.width, bar.height);
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.fillText(bar.label, bar.centerX, layout.plot.y + layout.plot.height + 16);
      }
    }

    // ============ 1. DATA — plain numbers, no pixels ================
    const month = (label, value) => ({ label, value });
    const DATASETS = {
      steady: [
        month('Jan', 1200), month('Feb', 940), month('Mar', 1450),
        month('Apr', 780), month('May', 1120), month('Jun', 1010),
      ],
      spike: [
        month('Jan', 1200), month('Feb', 940), month('Mar', 4200),
        month('Apr', 780), month('May', 1120), month('Jun', 1010),
      ],
      thirteen: Array.from({ length: 13 }, (_, i) =>
        month(`m${i + 1}`, 600 + ((i * 317) % 900))),
      refunds: [
        month('Jan', 1200), month('Feb', -300), month('Mar', 1450),
        month('Apr', -180), month('May', 1120), month('Jun', 1010),
      ],
      empty: [],
    };

    // ============ 2. STATE =========================================
    let data = DATASETS.steady;
    let size = { width: 640, height: 320 };

    // ============ 3. RENDER — layout first, drawing second =========
    function render() {
      const canvas = document.getElementById('chart');
      canvas.width = size.width;
      canvas.height = size.height;

      const layout = computeLayout(data, {
        ...size,
        formatValue: (v) => `$${v}`,
      });
      draw(canvas.getContext('2d'), layout);

      // The layout is inspectable DATA — you can print it, diff it, or
      // assert on it. Pixels can do none of those things.
      document.getElementById('readout').textContent = layout.bars.length === 0
        ? 'no bars (empty data is a legal chart)'
        : layout.bars
            .map((b) => `${b.label.padEnd(4)} $${String(b.value).padStart(5)}  ` +
                        `x=${b.x.toFixed(1)} y=${b.y.toFixed(1)} h=${b.height.toFixed(1)}`)
            .join('\n');
    }

    // ============ 4. WIRING ========================================
    for (const button of document.querySelectorAll('[data-set]')) {
      button.onclick = () => { data = DATASETS[button.dataset.set]; render(); };
    }
    document.getElementById('resize').onclick = () => {
      size = size.width === 640 ? { width: 420, height: 240 } : { width: 640, height: 320 };
      render();
    };

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sierpinski (refactored)</title>
  <style> body { font-family: sans-serif; text-align: center; } </style>
</head>
<body>
  <h1>Sierpinski triangle</h1>
  <p><label>Depth: <input type="range" id="depth" min="0" max="8" value="6">
     <span id="depthLabel">6</span></label></p>
  <canvas id="canvas" width="600" height="520"></canvas>

  <script>
    const CONFIG = {
      color: '#336',
      // A point is just { x, y }. Working with point objects instead
      // of six loose coordinates is most of this refactor.
    };

    /** Midpoint of two points — the fractal's only piece of math. */
    const midpoint = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    /**
     * The recursion, readable at last:
     * a triangle at depth 0 is drawn; otherwise it splits into the
     * three corner sub-triangles built from its midpoints. (The
     * middle triangle is the hole — it's simply never drawn.)
     */
    function drawSierpinski(ctx, [a, b, c], depth) {
      if (depth === 0) {
        fillTriangle(ctx, [a, b, c]);
        return;
      }
      const ab = midpoint(a, b);
      const bc = midpoint(b, c);
      const ca = midpoint(c, a);
      drawSierpinski(ctx, [a, ab, ca], depth - 1);
      drawSierpinski(ctx, [ab, b, bc], depth - 1);
      drawSierpinski(ctx, [ca, bc, c], depth - 1);
    }

    function fillTriangle(ctx, [a, b, c]) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.fill();
    }

    /** An equilateral triangle fitted to the canvas — derived, not magic. */
    function fittedTriangle(width) {
      const height = width * Math.sqrt(3) / 2;
      return [
        { x: width / 2, y: 0 },
        { x: 0, y: height },
        { x: width, y: height },
      ];
    }

    // ---- wiring ----
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('depth');

    function render() {
      const depth = Number(slider.value);
      document.getElementById('depthLabel').textContent = depth;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = CONFIG.color;
      drawSierpinski(ctx, fittedTriangle(canvas.width), depth);
    }

    slider.oninput = render;
    render();
  </script>
</body>
</html>

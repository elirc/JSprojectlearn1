<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sierpinski (original)</title>
</head>
<body>
  <canvas id="c" width="600" height="520"></canvas>
  <script>
    var ctx = document.getElementById("c").getContext("2d");

    // one function: recursion + drawing + hardcoded everything
    function tri(x1, y1, x2, y2, x3, y3, d) {
      if (d == 0) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.fill();
        return;
      }
      // midpoints, computed inline six times — one typo in any of
      // these twelve coordinate expressions = a glitched fractal
      tri(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2, (x1 + x3) / 2, (y1 + y3) / 2, d - 1);
      tri((x1 + x2) / 2, (y1 + y2) / 2, x2, y2, (x2 + x3) / 2, (y2 + y3) / 2, d - 1);
      tri((x1 + x3) / 2, (y1 + y3) / 2, (x2 + x3) / 2, (y2 + y3) / 2, x3, y3, d - 1);
    }

    ctx.fillStyle = "#336";
    // magic corner coordinates: change the canvas size and re-derive
    // all six numbers by hand (520 ≈ 600 * sqrt(3)/2, but who knows that?)
    tri(300, 0, 0, 520, 600, 520, 6);
    // want a different depth? edit the 6 and refresh. want to explain
    // to someone which argument the 6 IS? count commas.
  </script>
</body>
</html>

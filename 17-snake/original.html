<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snake (original)</title>
  <style> body { text-align: center; font-family: sans-serif; }
          canvas { border: 2px solid #333; } </style>
</head>
<body>
  <h1>Snake</h1>
  <p id="score">Score: 0</p>
  <canvas id="game" width="400" height="400"></canvas>

  <script>
    // Ten globals, all mutated from three different places.
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var snake = [{ x: 10, y: 10 }];
    var dx = 1;
    var dy = 0;
    var foodX = 15;
    var foodY = 10;
    var score = 0;
    var dead = false;
    var changedThisTick = false;

    document.addEventListener("keydown", function (e) {
      // reversal guard, duplicated per key... and buggy without
      // changedThisTick: press Up then Left within one tick and the
      // second press sneaks past the guard -> instant self-collision.
      if (changedThisTick) return;
      if (e.key == "ArrowUp" && dy != 1) { dx = 0; dy = -1; changedThisTick = true; }
      if (e.key == "ArrowDown" && dy != -1) { dx = 0; dy = 1; changedThisTick = true; }
      if (e.key == "ArrowLeft" && dx != 1) { dx = -1; dy = 0; changedThisTick = true; }
      if (e.key == "ArrowRight" && dx != -1) { dx = 1; dy = 0; changedThisTick = true; }
    });

    setInterval(function () {
      if (dead) return;
      changedThisTick = false;

      // move: logic and drawing interleaved, board size hardcoded as
      // magic 20s and 400s that must agree with the canvas attributes
      var head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
        dead = true;
        document.getElementById("score").innerText = "GAME OVER! Score: " + score;
        return;
      }
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x == head.x && snake[i].y == head.y) {
          dead = true;
          document.getElementById("score").innerText = "GAME OVER! Score: " + score;
          return;
        }
      }

      snake.unshift(head); // MUTATES the snake...

      if (head.x == foodX && head.y == foodY) {
        score = score + 1;
        document.getElementById("score").innerText = "Score: " + score;
        foodX = Math.floor(Math.random() * 20); // might land ON the snake!
        foodY = Math.floor(Math.random() * 20);
      } else {
        snake.pop(); // ...from a second place
      }

      // drawing, in the same function as the rules
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = "#c33";
      ctx.fillRect(foodX * 20, foodY * 20, 20, 20);
      ctx.fillStyle = "#2a2";
      for (var j = 0; j < snake.length; j++) {
        ctx.fillRect(snake[j].x * 20, snake[j].y * 20, 20, 20);
      }
    }, 120);
    // Want a pause button? A restart without reloading the page? A
    // replay of the last game? Everything is tangled in one interval
    // callback mutating globals — good luck.
  </script>
</body>
</html>

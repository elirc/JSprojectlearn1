<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Expenses (refactored)</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    li { padding: 2px 0; }
    #error { color: #b00; min-height: 1em; font-size: 13px; }
    canvas { border: 1px solid #eee; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Expenses</h1>
  <input id="desc" placeholder="what">
  <input id="amount" placeholder="how much" size="8">
  <select id="cat"><option>food</option><option>transport</option><option>fun</option></select>
  <button id="add">Add</button>
  <div id="error"></div>
  <ul id="list"></ul>
  <div id="total"></div>
  <canvas id="chart" width="520" height="160"></canvas>

  <script>
    // --- inline copy of refactored/derive.js (tested in
    //     derive.test.js; file:// pages can't import modules) --------
    const SCHEMA_VERSION = 1;

    function parseAmount(text) {
      const m = String(text).trim().match(/^\$?(\d+)(?:\.(\d{1,2}))?$/);
      if (!m) return null;
      const cents = Number(m[1]) * 100 + Number((m[2] ?? '0').padEnd(2, '0'));
      return cents > 0 ? cents : null;
    }

    function deriveTotals(expenses) {
      const byCategory = {};
      let totalCents = 0;
      for (const e of expenses) {
        totalCents += e.cents;
        byCategory[e.category] = (byCategory[e.category] ?? 0) + e.cents;
      }
      return { totalCents, byCategory };
    }

    function chartData(expenses) {
      const { totalCents, byCategory } = deriveTotals(expenses);
      return Object.entries(byCategory)
        .map(([category, cents]) => ({
          category, cents,
          fraction: totalCents === 0 ? 0 : cents / totalCents,
        }))
        .sort((a, b) => b.cents - a.cents);
    }

    function loadState(rawText) {
      if (!rawText) return { version: SCHEMA_VERSION, expenses: [] };
      let parsed;
      try { parsed = JSON.parse(rawText); } catch { return { version: SCHEMA_VERSION, expenses: [] }; }
      if (parsed?.version !== SCHEMA_VERSION || !Array.isArray(parsed.expenses)) {
        return { version: SCHEMA_VERSION, expenses: [] };
      }
      const valid = parsed.expenses.filter(
        (e) => typeof e?.description === 'string' &&
               Number.isInteger(e?.cents) && e.cents > 0 &&
               typeof e?.category === 'string',
      );
      return { version: SCHEMA_VERSION, expenses: valid };
    }

    function formatCents(cents) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
        .format(cents / 100);
    }

    // ============ STATE ============================================
    const STORAGE_KEY = 'expenses-v1';
    let state = loadState(localStorage.getItem(STORAGE_KEY));

    function dispatch(mutate) {
      mutate(state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); // save + render,
      render();                                                 // never forgotten (project 59)
    }

    // ============ ACTIONS ==========================================
    document.getElementById('add').onclick = () => {
      const description = document.getElementById('desc').value.trim();
      const cents = parseAmount(document.getElementById('amount').value);
      const category = document.getElementById('cat').value;

      if (!description) return showError('Description is required.');
      if (cents === null) return showError('Amount must be a positive number like 12.50.');
      showError('');

      dispatch((s) => s.expenses.push({ description, cents, category }));
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    };

    function showError(msg) {
      document.getElementById('error').textContent = msg;
    }

    // ============ RENDERING ========================================
    function render() {
      const ul = document.getElementById('list');
      ul.innerHTML = '';
      for (const e of state.expenses) {
        const li = document.createElement('li');
        li.textContent = `${e.description} — ${formatCents(e.cents)} (${e.category})`;
        ul.appendChild(li);
      }
      const { totalCents } = deriveTotals(state.expenses);
      document.getElementById('total').textContent = `total: ${formatCents(totalCents)}`;
      drawChart(chartData(state.expenses));
    }

    // A hand-drawn bar chart: data -> pixels, no library. The rows
    // arrive sorted with precomputed fractions — the canvas code
    // only does GEOMETRY (the decide/do split again).
    function drawChart(rows) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (rows.length === 0) return;

      const pad = 8, labelW = 90, valueW = 70;
      const barMaxW = canvas.width - labelW - valueW - pad * 2;
      const rowH = Math.min(32, (canvas.height - pad * 2) / rows.length);
      const colors = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#76b7b2'];

      ctx.font = '13px sans-serif';
      ctx.textBaseline = 'middle';
      rows.forEach((row, i) => {
        const y = pad + i * rowH;
        ctx.fillStyle = '#333';
        ctx.textAlign = 'left';
        ctx.fillText(row.category, pad, y + rowH / 2);
        ctx.fillStyle = colors[i % colors.length];
        // scale by fraction of the LARGEST bar so the biggest fills the space
        const w = barMaxW * (row.cents / rows[0].cents);
        ctx.fillRect(pad + labelW, y + rowH * 0.15, w, rowH * 0.7);
        ctx.fillStyle = '#333';
        ctx.fillText(
          `${formatCents(row.cents)} (${Math.round(row.fraction * 100)}%)`,
          pad + labelW + w + 6, y + rowH / 2,
        );
      });
    }

    render();
  </script>
</body>
</html>

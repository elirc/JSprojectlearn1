<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spreadsheet (refactored)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 32px auto; }
    table { border-collapse: collapse; }
    th { background: #eee; font-size: 12px; width: 96px; }
    td, th { border: 1px solid #ccc; padding: 2px; }
    input { width: 88px; border: 0; padding: 4px; font: inherit; }
    input:focus { outline: 2px solid #48c; }
    .val { display: block; font: 11px monospace; color: #777; padding: 0 4px 2px; }
    .val.err { color: #b00; }
    p.note { color: #555; font-size: 13px; line-height: 1.5; }
    #order { font: 11px monospace; color: #444; background: #f6f6f6;
             padding: 6px; border: 1px solid #ddd; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Mini spreadsheet</h1>
  <p class="note">
    Type a number, or a formula like <code>=A1+B2*2</code>. A1 shows 11
    immediately — chains are correct on the first keystroke, not the third —
    and D1/E1 refer to each other, so they say <code>#CYCLE!</code> instead of
    counting to infinity.
  </p>
  <table id="grid"></table>
  <p class="note">Recompute order (dependencies first, computed fresh each time):</p>
  <div id="order"></div>

  <script>
    // --- inline copy of refactored/engine.js (tested in engine.test.js;
    //     file:// pages can't import modules) -----------------------
    class FormulaError extends Error {
      constructor(marker) { super(marker); this.name = 'FormulaError'; }
    }
    const CYCLE = '#CYCLE!';
    const BAD_FORMULA = '#ERROR!';
    const DIVIDE_BY_ZERO = '#DIV/0!';

    function tokenize(formula) {
      const tokens = [];
      let position = 0;
      while (position < formula.length) {
        const char = formula[position];
        if (char === ' ') {
          position++;
        } else if (char >= '0' && char <= '9') {
          let text = '';
          while (position < formula.length && /[0-9.]/.test(formula[position])) text += formula[position++];
          const value = Number(text);
          if (!Number.isFinite(value)) throw new SyntaxError(`Bad number "${text}"`);
          tokens.push({ type: 'number', value });
        } else if (/[A-Za-z]/.test(char)) {
          let letters = '';
          while (position < formula.length && /[A-Za-z]/.test(formula[position])) letters += formula[position++];
          let digits = '';
          while (position < formula.length && /[0-9]/.test(formula[position])) digits += formula[position++];
          if (digits === '') throw new SyntaxError(`Unknown name "${letters}"`);
          tokens.push({ type: 'ref', name: (letters + digits).toUpperCase() });
        } else if ('+-*/()'.includes(char)) {
          tokens.push({ type: char });
          position++;
        } else {
          throw new SyntaxError(`Unexpected character "${char}" at position ${position}`);
        }
      }
      return tokens;
    }

    function referencesOf(formula) {
      return [...new Set(tokenize(formula).filter((t) => t.type === 'ref').map((t) => t.name))];
    }

    function parse(tokens) {
      let position = 0;
      const peek = () => tokens[position];
      function expression() {
        let node = term();
        while (peek()?.type === '+' || peek()?.type === '-') {
          const op = tokens[position++].type;
          node = { type: 'binary', op, left: node, right: term() };
        }
        return node;
      }
      function term() {
        let node = factor();
        while (peek()?.type === '*' || peek()?.type === '/') {
          const op = tokens[position++].type;
          node = { type: 'binary', op, left: node, right: factor() };
        }
        return node;
      }
      function factor() {
        const token = peek();
        if (token === undefined) throw new SyntaxError('Unexpected end of formula');
        if (token.type === 'number') { position++; return { type: 'number', value: token.value }; }
        if (token.type === 'ref') { position++; return { type: 'ref', name: token.name }; }
        if (token.type === '-') { position++; return { type: 'negate', operand: factor() }; }
        if (token.type === '(') {
          position++;
          const inner = expression();
          if (peek()?.type !== ')') throw new SyntaxError('Missing closing parenthesis');
          position++;
          return inner;
        }
        throw new SyntaxError(`Unexpected "${token.type}"`);
      }
      const tree = expression();
      if (position < tokens.length) throw new SyntaxError('Unexpected input after formula');
      return tree;
    }

    function computeOrder(cells) {
      const names = Object.keys(cells);
      const known = new Set(names);
      const dependsOn = new Map();
      const feeds = new Map();
      for (const name of names) feeds.set(name, []);
      for (const name of names) {
        const raw = String(cells[name] ?? '').trim();
        let refs = [];
        if (raw.startsWith('=')) {
          try { refs = referencesOf(raw.slice(1)).filter((ref) => known.has(ref)); } catch { refs = []; }
        }
        dependsOn.set(name, refs);
        for (const ref of refs) feeds.get(ref).push(name);
      }
      const waitingFor = new Map(names.map((name) => [name, dependsOn.get(name).length]));
      const ready = names.filter((name) => waitingFor.get(name) === 0);
      const order = [];
      while (ready.length > 0) {
        const name = ready.shift();
        order.push(name);
        for (const dependent of feeds.get(name)) {
          const left = waitingFor.get(dependent) - 1;
          waitingFor.set(dependent, left);
          if (left === 0) ready.push(dependent);
        }
      }
      const ordered = new Set(order);
      return { order, cyclic: names.filter((name) => !ordered.has(name)) };
    }

    function evaluateNode(node, values) {
      if (node.type === 'number') return node.value;
      if (node.type === 'ref') {
        const value = values[node.name];
        if (value === undefined) return 0;
        if (typeof value === 'string') throw new FormulaError(value);
        return value;
      }
      if (node.type === 'negate') return -evaluateNode(node.operand, values);
      const left = evaluateNode(node.left, values);
      const right = evaluateNode(node.right, values);
      switch (node.op) {
        case '+': return left + right;
        case '-': return left - right;
        case '*': return left * right;
        case '/':
          if (right === 0) throw new FormulaError(DIVIDE_BY_ZERO);
          return left / right;
        default: throw new SyntaxError(`Unknown operator "${node.op}"`);
      }
    }

    function evaluateSheet(cells) {
      const { order, cyclic } = computeOrder(cells);
      const values = {};
      for (const name of cyclic) values[name] = CYCLE;
      for (const name of order) {
        const raw = String(cells[name] ?? '').trim();
        if (raw === '') {
          values[name] = 0;
        } else if (!raw.startsWith('=')) {
          const number = Number(raw);
          values[name] = Number.isFinite(number) ? number : BAD_FORMULA;
        } else {
          try {
            values[name] = evaluateNode(parse(tokenize(raw.slice(1))), values);
          } catch (error) {
            values[name] = error instanceof FormulaError ? error.message : BAD_FORMULA;
          }
        }
      }
      return values;
    }

    // ============================================================
    // 1. STATE — the sheet is a plain object of raw text. Not the
    //    inputs: those are just a way to type into it. You could
    //    JSON.stringify this and mail it to someone.
    // ============================================================
    const COLUMNS = ['A', 'B', 'C', 'D', 'E'];
    const ROWS = [1, 2, 3, 4, 5];
    const NAMES = ROWS.flatMap((row) => COLUMNS.map((column) => column + row));

    const cells = Object.fromEntries(NAMES.map((name) => [name, '']));
    cells.A1 = '=B1+1';   // the chain the original could not get right
    cells.B1 = '=C1*2';
    cells.C1 = '5';
    cells.D1 = '=E1+1';   // the cycle the original could not see
    cells.E1 = '=D1+1';

    // ============================================================
    // 2. THE GRID — built once. Inputs hold text the user is editing;
    //    the grey line under each one is drawn from the engine.
    // ============================================================
    const grid = document.getElementById('grid');

    function headerCell(text) {
      const th = document.createElement('th');
      th.textContent = text;
      return th;
    }

    const header = grid.insertRow();
    header.append(headerCell(''), ...COLUMNS.map(headerCell));

    const inputs = {};
    const outputs = {};
    for (const row of ROWS) {
      const tr = grid.insertRow();
      tr.append(headerCell(row));
      for (const column of COLUMNS) {
        const name = column + row;
        const cell = tr.insertCell();
        const input = document.createElement('input');
        input.value = cells[name];
        input.oninput = () => {
          cells[name] = input.value; // change the DATA...
          render();                  // ...then redraw everything from it
        };
        const out = document.createElement('span');
        out.className = 'val';
        cell.append(input, out);
        inputs[name] = input;
        outputs[name] = out;
      }
    }

    // ============================================================
    // 3. RENDER — a function OF the state. One call to the engine
    //    computes the whole sheet, in dependency order, once.
    // ============================================================
    function render() {
      const values = evaluateSheet(cells);
      for (const name of NAMES) {
        const raw = cells[name].trim();
        const value = values[name];
        const isError = typeof value === 'string';
        outputs[name].textContent = raw === '' ? '' : String(value);
        outputs[name].className = isError ? 'val err' : 'val';
      }
      const { order, cyclic } = computeOrder(cells);
      const used = order.filter((name) => cells[name].trim() !== '');
      document.getElementById('order').textContent =
        used.join(' → ') + (cyclic.length ? `   [stuck in a cycle: ${cyclic.join(', ')}]` : '');
    }

    render(); // first paint
  </script>
</body>
</html>

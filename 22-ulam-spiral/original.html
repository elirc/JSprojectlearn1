<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ulam spiral (original)</title>
</head>
<body>
  <canvas id="c" width="404" height="404"></canvas>
  <script>
    // Ulam spiral: write 1, 2, 3... in a square spiral, mark the
    // primes. Diagonal streaks appear — a real unsolved-math mystery.

    var ctx = document.getElementById("c").getContext("2d");

    var x = 50;         // grid position, mixed with...
    var y = 50;
    var px = 202;       // ...pixel position, tracked IN PARALLEL
    var py = 202;
    var dir = 0;        // 0=right 1=up 2=left 3=down
    var steps = 1;      // current leg length
    var stepsDone = 0;  // steps taken on this leg
    var legs = 0;       // legs finished (every 2 legs, length grows)

    for (var n = 1; n <= 10000; n++) {
      // prime check, inline, every iteration
      var prime = n >= 2;
      for (var i = 2; i < n; i++) {
        if (n % i == 0) { prime = false; break; }
      }

      if (prime) {
        ctx.fillRect(px, py, 3, 3);
      }

      // walk one cell in the current direction — grid AND pixels,
      // updated in parallel; forget one line and they silently drift
      if (dir == 0) { x++; px += 4; }
      if (dir == 1) { y--; py -= 4; }
      if (dir == 2) { x--; px -= 4; }
      if (dir == 3) { y++; py += 4; }

      // spiral bookkeeping: five counters that must stay in sync.
      // (Why do legs come in pairs? The code sure won't tell you.)
      stepsDone++;
      if (stepsDone == steps) {
        stepsDone = 0;
        dir = (dir + 1) % 4;
        legs++;
        if (legs % 2 == 0) {
          steps++;
        }
      }
    }
    // Everything happens in one loop: primality, spiral-walking, and
    // pixel-painting, tangled across seven mutable variables. To test
    // whether the spiral coordinates are right you would... look at
    // the picture and squint?
  </script>
</body>
</html>

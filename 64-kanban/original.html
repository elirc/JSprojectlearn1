<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kanban (original)</title>
  <style>
    body { font-family: sans-serif; display: flex; gap: 16px; padding: 24px; }
    .col { background: #f0f0f0; border-radius: 6px; padding: 8px; width: 200px; min-height: 240px; }
    .card { background: white; border: 1px solid #ccc; border-radius: 4px;
            padding: 8px; margin: 6px 0; cursor: grab; }
    h2 { font-size: 15px; margin: 4px; }
  </style>
</head>
<body>
  <div class="col" id="todo"><h2>Todo</h2>
    <div class="card" draggable="true">design the logo</div>
    <div class="card" draggable="true">write the pitch</div>
  </div>
  <div class="col" id="doing"><h2>Doing</h2>
    <div class="card" draggable="true">build the site</div>
  </div>
  <div class="col" id="done"><h2>Done</h2></div>

  <script>
    // Problem 1: THE DOM IS THE DATABASE. The cards exist only as
    // divs. Refresh the page: gone. Want to save, sync, undo, count
    // cards per column? You'd have to SCRAPE YOUR OWN UI. (Project
    // 14 said "state lives in data, not the DOM" — with drag & drop
    // it's tempting to regress, because the browser moves nodes for
    // free.)
    var dragged = null;

    document.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("dragstart", function () {
        // Problem 2: the payload is a live DOM node in a global.
        // Nothing identifies WHICH card logically — there are no
        // ids, so two cards with the same text are indistinguishable.
        dragged = card;
      });
    });

    document.querySelectorAll(".col").forEach(function (col) {
      // Problem 3: cargo-cult event code. preventDefault in dragover
      // is REQUIRED for drop to fire at all — but nobody here knows
      // that; it was copied from Stack Overflow. When it breaks,
      // nobody knows why either.
      col.addEventListener("dragover", function (e) { e.preventDefault(); });

      col.addEventListener("drop", function () {
        // Problem 4: appendChild MOVES the node — mutation as the
        // only record of the move. No insert position (always drops
        // at the bottom), no way to veto an invalid move, and any
        // other view of this data (a counter, a chart) is now stale
        // with no event to tell it so.
        col.appendChild(dragged);
      });
    });

    // Problem 5: new cards? Editing? Persistence? Each would be
    // ANOTHER pile of createElement + listener wiring, because there
    // is no render path — the page was hand-written as HTML above.
  </script>
</body>
</html>

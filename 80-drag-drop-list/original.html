<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drag to reorder (original)</title>
  <style>
    body { font-family: sans-serif; max-width: 460px; margin: 32px auto; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 10px;
         margin: 6px 0; cursor: grab; }
    li.dragging { opacity: 0.4; }
    pre { background: #f4f4f4; border: 1px solid #ddd; padding: 10px; font-size: 13px;
          white-space: pre-wrap; min-height: 40px; }
    button { font: inherit; margin: 4px 4px 0 0; }
    p.note { color: #555; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>My day, in order</h1>
  <ul id="list"></ul>

  <button id="print">Print state</button>
  <button id="save">Save order</button>
  <button id="reload">Reload page</button>
  <pre id="out"></pre>

  <p class="note">
    Drag a couple of items around. Then click <b>Print state</b>: the array and
    the screen say different things. Click <b>Save order</b> and then
    <b>Reload page</b> — your reordering vanishes, because what got saved was
    the array, and the array never heard about the drag.
  </p>

  <script>
    // The list starts as data...
    var items = ["Wake up", "Coffee", "Code", "Lunch", "Code more", "Sleep"];

    var saved = localStorage.getItem("day-order");
    if (saved) items = JSON.parse(saved);

    // ...and then we hand it to the DOM and never speak of it again.
    var list = document.getElementById("list");
    for (var i = 0; i < items.length; i++) {
      var li = document.createElement("li");
      li.textContent = items[i];
      li.draggable = true;
      list.appendChild(li);
    }

    // PROBLEM 1: the payload is a live DOM node in a global. Which ITEM is
    // being dragged? There's no id — only "that element over there".
    var dragged = null;

    list.addEventListener("dragstart", function (event) {
      dragged = event.target;
      dragged.className = "dragging";
    });

    list.addEventListener("dragend", function () {
      if (dragged) dragged.className = "";
      dragged = null;
    });

    list.addEventListener("dragover", function (event) {
      event.preventDefault(); // required, or "drop" never fires
      var over = event.target.closest("li");
      if (!over || over === dragged) return;

      // PROBLEM 2 (the big one): reordering by MUTATING THE DOM. This line
      // moves the element, and moving the element IS the only record of the
      // move. The `items` array above still says the original order — the
      // screen and the state have quietly forked, and nothing will ever
      // reconcile them.
      list.insertBefore(dragged, over);

      // PROBLEM 3: this fires many times per second WHILE the pointer moves,
      // so the list rearranges itself under the cursor, which changes what
      // the cursor is over, which fires it again. That's the flicker.
    });

    // PROBLEM 4: to answer "what order is the list in?" we have to interview
    // the page, because the page is the only one who knows.
    document.getElementById("print").onclick = function () {
      var onScreen = [];
      for (var i = 0; i < list.children.length; i++) {
        onScreen.push(list.children[i].textContent);
      }
      document.getElementById("out").textContent =
        "items array: " + items.join(" → ") + "\n" +
        "on screen:   " + onScreen.join(" → ") + "\n\n" +
        (items.join() === onScreen.join()
          ? "(they agree — you haven't dragged anything yet)"
          : "THE STATE AND THE SCREEN DISAGREE.");
    };

    // PROBLEM 5: every feature built on the state is now wrong. Saving saves
    // the stale array. So do "send to server", "undo", "sort", "export"...
    document.getElementById("save").onclick = function () {
      localStorage.setItem("day-order", JSON.stringify(items));
      document.getElementById("out").textContent =
        "Saved: " + items.join(" → ") + "\n(...which is not what's on screen.)";
    };

    document.getElementById("reload").onclick = function () {
      location.reload();
    };

    // Could we fix it by scraping the DOM on save? Yes — and then the DOM is
    // officially the database (project 14's disease), every feature starts
    // with an archaeology dig, and the reordering logic still lives inside a
    // pointer event where no test can ever reach it.
  </script>
</body>
</html>

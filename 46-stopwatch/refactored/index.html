<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stopwatch (refactored)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #display { font-size: 48px; font-family: monospace; }
    ol { display: inline-block; text-align: left; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Stopwatch</h1>
  <div id="display"></div>
  <button id="startStop">Start</button>
  <button id="lap" disabled>Lap</button>
  <button id="reset">Reset</button>
  <ol id="laps"></ol>

  <script>
    // ============ STATE ==========================================
    // THE PRINCIPLE: never count ticks — RECORD WHEN THINGS HAPPENED
    // and derive elapsed time from the clock. The clock can't drift.
    //
    //   elapsed = accumulatedMs + (running ? now - startedAt : 0)
    //
    // accumulatedMs collects completed run-segments (so pause/resume
    // is exact); startedAt anchors the current segment.
    let state = {
      running: false,
      startedAt: null,     // timestamp when the current segment began
      accumulatedMs: 0,    // total of all finished segments
      laps: [],
    };

    function elapsedMs(now = Date.now()) {
      return state.accumulatedMs + (state.running ? now - state.startedAt : 0);
    }

    // ============ ACTIONS ========================================
    function startStop() {
      if (state.running) {
        state.accumulatedMs += Date.now() - state.startedAt; // bank the segment
        state.running = false;
        state.startedAt = null;
      } else {
        state.startedAt = Date.now();
        state.running = true;
      }
      render();
    }

    function lap() {
      if (state.running) state.laps.push(elapsedMs());
      render();
    }

    function reset() {
      state = { running: false, startedAt: null, accumulatedMs: 0, laps: [] };
      render();
    }

    // ============ RENDERING ======================================
    // A pure formatter (project 23's pipeline lesson): ms -> "mm:ss.t"
    function formatElapsed(ms) {
      const mins = Math.floor(ms / 60000);
      const secs = Math.floor((ms % 60000) / 1000);
      const tenths = Math.floor((ms % 1000) / 100);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(mins)}:${pad(secs)}.${tenths}`;
    }

    function render() {
      document.getElementById('display').textContent = formatElapsed(elapsedMs());
      document.getElementById('startStop').textContent =
        state.running ? 'Stop' : 'Start';
      document.getElementById('lap').disabled = !state.running;

      const list = document.getElementById('laps');
      list.innerHTML = '';
      for (const lapMs of state.laps) {
        const li = document.createElement('li');
        li.textContent = formatElapsed(lapMs);
        list.appendChild(li);
      }
    }

    // ============ THE TICK =======================================
    // The interval's ONLY job is redrawing. It carries no time
    // information — so its jitter, and background-tab throttling,
    // affect display smoothness but NEVER correctness. Come back to
    // a throttled tab and the very next tick shows the true time.
    setInterval(render, 100);

    document.getElementById('startStop').onclick = startStop;
    document.getElementById('lap').onclick = lap;
    document.getElementById('reset').onclick = reset;
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Todo (refactored)</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { margin-left: 8px; }
  </style>
</head>
<body>
  <h1>Todos</h1>
  <input id="newTodo" placeholder="What needs doing?">
  <button id="addButton">Add</button>
  <ul id="list"></ul>
  <p id="counter"></p>

  <script>
    // ============================================================
    // 1. STATE — the single source of truth. Plain data. The DOM is
    //    never asked what the todos are; it only displays them.
    // ============================================================
    let todos = load(); // [{ id, text, done }]
    let nextId = todos.reduce((max, t) => Math.max(max, t.id), 0) + 1;

    // ============================================================
    // 2. ACTIONS — the only code allowed to change state. Each one
    //    changes the data, then calls render(). That's the entire
    //    update protocol: change state -> re-render.
    // ============================================================
    function addTodo(text) {
      if (text.trim() === '') return;
      todos.push({ id: nextId++, text: text.trim(), done: false });
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find((t) => t.id === id);
      todo.done = !todo.done;
      render();
    }

    function removeTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      render();
    }

    // ============================================================
    // 3. RENDER — a function OF the state. Wipes and redraws the
    //    list from data. Because everything on screen is derived
    //    from `todos`, nothing can be out of sync: the counter is
    //    computed from the same array the list is drawn from.
    //    (Frameworks like React optimize this exact pattern; the
    //    mental model is identical.)
    // ============================================================
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      for (const todo of todos) {
        const li = document.createElement('li');
        li.className = todo.done ? 'done' : '';

        const span = document.createElement('span');
        span.textContent = todo.text; // textContent: no HTML injection
        span.onclick = () => toggleTodo(todo.id);

        const del = document.createElement('button');
        del.textContent = 'x';
        del.onclick = () => removeTodo(todo.id);

        li.append(span, del);
        list.append(li);
      }

      const remaining = todos.filter((t) => !t.done).length;
      document.getElementById('counter').textContent = `${remaining} items left`;

      save(); // persistence is trivial: state is already plain data
    }

    // ============================================================
    // 4. PERSISTENCE — serialize the state, not the page.
    // ============================================================
    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function load() {
      try {
        return JSON.parse(localStorage.getItem('todos')) ?? [];
      } catch {
        return [];
      }
    }

    // ============================================================
    // 5. WIRING — connect DOM events to actions.
    // ============================================================
    const input = document.getElementById('newTodo');
    document.getElementById('addButton').onclick = () => {
      addTodo(input.value);
      input.value = '';
    };
    input.onkeydown = (event) => {
      if (event.key === 'Enter') {
        addTodo(input.value);
        input.value = '';
      }
    };

    render(); // first paint
  </script>
</body>
</html>

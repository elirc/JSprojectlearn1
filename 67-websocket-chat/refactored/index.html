<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; }
    #log div { padding: 2px 0; }
    .system { color: #888; font-style: italic; }
    #status { font-size: 13px; color: #888; min-height: 1em; }
    input { width: 100%; font-size: 16px; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Chat</h1>
  <div id="status"></div>
  <div id="log"></div>
  <input id="msg" placeholder="type and press Enter" autofocus>

  <script>
    // The browser side: the built-in WebSocket API — the same
    // protocol our server.js implements by hand — plus the one thing
    // every real client needs and demos skip: RECONNECTION with
    // backoff (project 43's policy, in the browser).
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const input = document.getElementById('msg');

    let ws = null;
    let attempt = 0;

    function connect() {
      status.textContent = attempt === 0 ? 'connecting…' : `reconnecting (attempt ${attempt + 1})…`;
      ws = new WebSocket(`ws://${location.host}`);

      ws.onopen = () => {
        attempt = 0; // a good connection resets the backoff clock
        status.textContent = 'connected';
      };

      ws.onmessage = (event) => {
        const line = document.createElement('div');
        line.textContent = event.data; // textContent: chat is user input (project 35)
        if (event.data.startsWith('* ')) line.className = 'system';
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      };

      // onclose fires for BOTH clean closes and dropped connections —
      // and after onerror, too, so reconnection logic lives here only.
      ws.onclose = () => {
        const delay = Math.min(500 * 2 ** attempt, 8000);
        attempt++;
        status.textContent = `disconnected — retrying in ${delay / 1000}s`;
        setTimeout(connect, delay);
      };
    }

    input.onkeydown = (e) => {
      // readyState check: sends while disconnected throw — queue-or-drop
      // is a POLICY; here we drop with feedback.
      if (e.key !== 'Enter' || !input.value.trim()) return;
      if (ws?.readyState !== WebSocket.OPEN) {
        status.textContent = 'not connected — message not sent';
        return;
      }
      ws.send(input.value.trim());
      input.value = '';
    };

    connect();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Collab todos</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    li { padding: 4px 0; cursor: pointer; list-style: none; }
    li.done span { text-decoration: line-through; color: #999; }
    li.pending { opacity: 0.55; }  /* optimistic, awaiting the server echo */
    #status { font-size: 13px; color: #888; min-height: 1em; }
    input { width: 100%; font-size: 16px; padding: 8px; box-sizing: border-box; }
    button.del { float: right; }
  </style>
</head>
<body>
  <h1>Shared todos</h1>
  <div id="status"></div>
  <input id="new" placeholder="add a todo, press Enter" autofocus>
  <ul id="list"></ul>

  <script>
    // --- inline copy of refactored/sync.js (tested in sync.test.js;
    //     file:// pages can't import modules) ------------------------
    function initialState() { return { todos: [], version: 0 }; }

    function optimisticAdd(state, { tag, title }) {
      return {
        ...state,
        todos: [...state.todos, { id: `pending-${tag}`, title, done: false, pending: true }],
      };
    }

    function optimisticToggle(state, id) {
      return {
        ...state,
        todos: state.todos.map((t) => (t.id === id ? { ...t, done: !t.done, pending: true } : t)),
      };
    }

    function applyEvent(state, event, myTags = new Set()) {
      if (event.version <= state.version) return state;
      let todos;
      if (event.type === 'deleted') {
        todos = state.todos.filter((t) => t.id !== event.todoId);
      } else if (myTags.has(event.originTag)) {
        const placeholderId = `pending-${event.originTag}`;
        let replaced = false;
        todos = state.todos.map((t) => {
          if (t.id === placeholderId || t.id === event.todo.id) {
            replaced = true;
            return event.todo;
          }
          return t;
        });
        if (!replaced) todos = [...todos, event.todo];
        todos = todos.filter((t, i) => todos.findIndex((u) => u.id === t.id) === i);
      } else {
        const exists = state.todos.some((t) => t.id === event.todo.id);
        todos = exists
          ? state.todos.map((t) => (t.id === event.todo.id ? event.todo : t))
          : [...state.todos, event.todo];
      }
      return { todos, version: event.version };
    }

    // ============ WIRING ===========================================
    let state = initialState();
    const myTags = new Set();
    let tagCounter = 0;
    const newTag = () => {
      const tag = `${Math.random().toString(36).slice(2, 8)}-${tagCounter++}`;
      myTags.add(tag);
      return tag;
    };

    function setState(next) { state = next; render(); }

    // Writes go over HTTP (validated, error-shaped). If the server
    // says no, we simply re-sync from the log — rollback by replay.
    async function send(method, path, body) {
      try {
        const res = await fetch(path, {
          method,
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error((await res.json()).error);
      } catch (err) {
        document.getElementById('status').textContent = `rejected: ${err.message} — resyncing`;
        const events = await (await fetch(`/events?since=0`)).json();
        setState(events.reduce((s, e) => applyEvent(s, e, myTags), initialState()));
      }
    }

    document.getElementById('new').onkeydown = (e) => {
      const title = e.target.value.trim();
      if (e.key !== 'Enter' || !title) return;
      const tag = newTag();
      setState(optimisticAdd(state, { tag, title })); // instant UI...
      send('POST', '/todos', { title, originTag: tag }); // ...server catches up
      e.target.value = '';
    };

    function toggle(todo) {
      if (todo.pending) return; // wait for the real id
      const tag = newTag();
      setState(optimisticToggle(state, todo.id));
      send('PUT', `/todos/${todo.id}`, { done: !todo.done, originTag: tag });
    }

    function removeTodo(todo) {
      if (todo.pending) return;
      const tag = newTag();
      setState({ ...state, todos: state.todos.filter((t) => t.id !== todo.id), version: state.version });
      send('DELETE', `/todos/${todo.id}`, { originTag: tag });
    }

    // Reads arrive over the socket — everyone's edits, ours included,
    // in server order. Reconnects ask for a replay (?since=version):
    // project 67's reconnect loop + this catch-up = no missed events.
    let attempt = 0;
    function connect() {
      const ws = new WebSocket(`ws://${location.host}/?since=${state.version}`);
      ws.onopen = () => { attempt = 0; document.getElementById('status').textContent = 'live'; };
      ws.onmessage = (e) => setState(applyEvent(state, JSON.parse(e.data), myTags));
      ws.onclose = () => {
        const delay = Math.min(500 * 2 ** attempt++, 8000);
        document.getElementById('status').textContent = `disconnected — retrying in ${delay / 1000}s`;
        setTimeout(connect, delay);
      };
    }

    // ============ RENDERING ========================================
    function render() {
      const ul = document.getElementById('list');
      ul.innerHTML = '';
      for (const todo of state.todos) {
        const li = document.createElement('li');
        li.className = `${todo.done ? 'done' : ''} ${todo.pending ? 'pending' : ''}`;
        const span = document.createElement('span');
        span.textContent = todo.title; // user input -> textContent (project 35)
        li.appendChild(span);
        if (!todo.pending) {
          const del = document.createElement('button');
          del.className = 'del';
          del.textContent = 'x';
          del.onclick = (e) => { e.stopPropagation(); removeTodo(todo); };
          li.appendChild(del);
        }
        li.onclick = () => toggle(todo);
        ul.appendChild(li);
      }
    }

    connect();
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pomodoro (original)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #time { font-size: 48px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Pomodoro</h1>
  <div id="time">25:00</div>
  <div id="phase">work</div>
  <button onclick="start()">Start</button>
  <button onclick="pause()">Pause</button>
  <button onclick="reset()">Reset</button>

  <script>
    // Problem 1: time is COUNTED, not derived. Every tick assumes
    // exactly 1000ms passed. setInterval doesn't promise that — and
    // background tabs get throttled to one tick per MINUTE. Leave
    // this tab during a 25:00 work block, come back, and your
    // pomodoro says 24:37 half an hour later. For a stopwatch
    // (project 46) drift was cosmetic; for a timer that's supposed
    // to TELL you when time is up, drift is the whole product
    // failing.
    var secondsLeft = 25 * 60;

    // Problem 2: the "state machine" is a pile of independent
    // variables. running + onBreak can combine into states that
    // don't exist (paused during... which phase? was it running?).
    // Every new feature multiplies the if-soup below.
    var running = false;
    var onBreak = false;
    var timer = null;

    function start() {
      // Problem 3: click Start twice -> TWO intervals ticking, time
      // runs double speed. (Try it.) Nothing prevents it.
      running = true;
      timer = setInterval(tick, 1000);
    }

    function pause() {
      running = false;
      clearInterval(timer);
    }

    function reset() {
      pause();
      onBreak = false;
      secondsLeft = 25 * 60;
      show();
    }

    function tick() {
      secondsLeft = secondsLeft - 1;
      if (secondsLeft <= 0) {
        // Problem 4: the user is told with alert() — which BLOCKS
        // the page, and only if the tab is focused does anyone see
        // it promptly. The Notifications API exists for exactly
        // this. (And we never asked permission for anything.)
        alert(onBreak ? "Break over!" : "Time for a break!");
        onBreak = !onBreak;
        secondsLeft = (onBreak ? 5 : 25) * 60;
      }
      show();
    }

    function show() {
      var m = Math.floor(secondsLeft / 60);
      var s = secondsLeft % 60;
      document.getElementById("time").textContent =
        (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      document.getElementById("phase").textContent = onBreak ? "break" : "work";
    }

    show();
  </script>
</body>
</html>

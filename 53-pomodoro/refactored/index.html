<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pomodoro (refactored)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #time { font-size: 48px; font-family: monospace; }
    #phase { text-transform: uppercase; letter-spacing: 2px; color: #666; }
    body.break { background: #e8f5e9; }
  </style>
</head>
<body>
  <h1>Pomodoro</h1>
  <div id="phase"></div>
  <div id="time"></div>
  <button id="primary"></button>
  <button id="reset">Reset</button>

  <script>
    // ============ CONFIG =========================================
    const DURATIONS_MS = { work: 25 * 60_000, break: 5 * 60_000 };
    const NEXT_PHASE = { work: 'break', break: 'work' };

    // ============ STATE: a real machine ==========================
    // Exactly four states, and which data exists depends on the
    // state (project 40). No boolean combination can be nonsense:
    //
    //   idle             — nothing scheduled
    //   running          — { phase, endsAt }        <- a TIMESTAMP
    //   paused           — { phase, remainingMs }
    //   (running <-> paused, both -> idle via reset)
    //
    // THE TIME LESSON (project 46, sharpened): a countdown is not
    // "a number I decrement" — it's a FUTURE TIMESTAMP I compare
    // against the clock. remaining = endsAt - now. Throttled tabs,
    // laggy intervals, a suspended laptop: none of them can move
    // endsAt, so none of them can corrupt the timer.
    let state = { status: 'idle', phase: 'work' };

    function remainingMs(now = Date.now()) {
      if (state.status === 'running') return Math.max(0, state.endsAt - now);
      if (state.status === 'paused') return state.remainingMs;
      return DURATIONS_MS[state.phase];
    }

    // ============ TRANSITIONS ====================================
    // Each one: current state in, next state out. Clicking Start
    // twice can't double-tick — the second click is just another
    // transition from 'running', which starts nothing new.
    function primaryAction() {
      const now = Date.now();
      if (state.status === 'running') {
        state = { status: 'paused', phase: state.phase, remainingMs: remainingMs(now) };
      } else {
        state = { status: 'running', phase: state.phase, endsAt: now + remainingMs(now) };
        requestNotifyPermission(); // ask on a user gesture, never on load
      }
      render();
    }

    function reset() {
      state = { status: 'idle', phase: 'work' };
      render();
    }

    function phaseComplete() {
      const finished = state.phase;
      const next = NEXT_PHASE[finished];
      notify(finished === 'work' ? 'Work block done — take a break!' : 'Break over — back to it!');
      // Auto-advance into the next phase, running:
      state = { status: 'running', phase: next, endsAt: Date.now() + DURATIONS_MS[next] };
      render();
    }

    // ============ NOTIFICATIONS ==================================
    // Permission is requested on the first Start click (browsers
    // ignore/penalize requests not tied to a user gesture), and we
    // degrade gracefully: denied -> fall back to the title bar.
    function requestNotifyPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function notify(message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Pomodoro', { body: message });
      }
      document.title = `🔔 ${message}`; // works even when denied/unsupported
    }

    // ============ RENDERING ======================================
    function formatMs(ms) {
      const totalSecs = Math.ceil(ms / 1000); // ceil: show 25:00, not 24:59, at start
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(Math.floor(totalSecs / 60))}:${pad(totalSecs % 60)}`;
    }

    function render() {
      document.getElementById('time').textContent = formatMs(remainingMs());
      document.getElementById('phase').textContent =
        `${state.phase}${state.status === 'paused' ? ' (paused)' : ''}`;
      document.getElementById('primary').textContent =
        state.status === 'running' ? 'Pause' : 'Start';
      document.body.className = state.phase === 'break' ? 'break' : '';
      if (state.status !== 'idle') document.title = `${formatMs(remainingMs())} — Pomodoro`;
    }

    // ============ THE TICK =======================================
    // As in project 46: the interval only REDRAWS and CHECKS — it
    // carries no time information. If the tab was throttled for ten
    // minutes, the first tick after waking sees remainingMs() === 0
    // and completes the phase, exactly as if it had been watching.
    setInterval(() => {
      if (state.status === 'running' && remainingMs() === 0) phaseComplete();
      else if (state.status === 'running') render();
    }, 250);

    document.getElementById('primary').onclick = primaryAction;
    document.getElementById('reset').onclick = reset;
    render();
  </script>
</body>
</html>

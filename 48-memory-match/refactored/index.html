<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Memory match (refactored)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .card { display: inline-block; width: 60px; height: 60px; margin: 4px;
            font-size: 36px; line-height: 60px; background: #36c; color: transparent;
            border-radius: 8px; cursor: pointer; user-select: none; }
    .card.up, .card.matched { background: #eee; color: #000; }
    .card.matched { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Memory</h1>
  <p id="status"></p>
  <div id="board"></div>
  <p><button id="restart">New game</button></p>

  <script>
    const EMOJIS = ['🐈', '🐕', '🦊', '🐸', '🦉', '🐙'];
    const FLIP_BACK_MS = 800;

    // ============ STATE ==========================================
    // Cards are DATA with a face ('down' | 'up' | 'matched'), never
    // DOM nodes. `phase` is the busy-flag done right (project 15):
    // while 'checking', clicks are ignored — the original's
    // third-click corruption has no code path to happen through.
    let state;

    function newGame() {
      const faces = shuffle([...EMOJIS, ...EMOJIS]);
      state = {
        cards: faces.map((emoji, id) => ({ id, emoji, face: 'down' })),
        phase: 'idle',       // 'idle' | 'oneUp' | 'checking' | 'won'
        moves: 0,
      };
      render();
    }

    /** Fisher–Yates (project 11) — unbiased, unlike sort(random). */
    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // ============ ACTIONS ========================================
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const faceUpCards = () => state.cards.filter((c) => c.face === 'up');

    async function flipCard(id) {
      const card = state.cards.find((c) => c.id === id);
      if (state.phase === 'checking' || state.phase === 'won') return;
      if (card.face !== 'down') return;

      card.face = 'up';

      if (state.phase === 'idle') {
        state.phase = 'oneUp';
        render();
        return;
      }

      // Second card of the pair: compare.
      state.phase = 'checking';
      state.moves++;
      render();

      const [a, b] = faceUpCards();
      if (a.emoji === b.emoji) {
        a.face = 'matched';
        b.face = 'matched';
      } else {
        await sleep(FLIP_BACK_MS);   // straight-line async (project 15)
        a.face = 'down';
        b.face = 'down';
      }

      const allMatched = state.cards.every((c) => c.face === 'matched');
      state.phase = allMatched ? 'won' : 'idle';
      render();
    }

    // ============ RENDER =========================================
    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (const card of state.cards) {
        const el = document.createElement('div');
        el.className = `card ${card.face === 'down' ? '' : card.face}`.trim();
        el.textContent = card.emoji; // hidden by CSS when face-down
        el.onclick = () => flipCard(card.id);
        board.appendChild(el);
      }
      document.getElementById('status').textContent =
        state.phase === 'won'
          ? `You won in ${state.moves} moves!`
          : `Moves: ${state.moves}`;
    }

    document.getElementById('restart').onclick = newGame;
    newGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Search (original)</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    input { width: 100%; font-size: 18px; padding: 8px; box-sizing: border-box; }
    li { padding: 4px 0; }
    #status { color: #888; font-size: 13px; min-height: 1em; }
  </style>
</head>
<body>
  <h1>Fruit search</h1>
  <input id="q" placeholder="type 'ba' then quickly 'ban'...">
  <div id="status"></div>
  <ul id="results"></ul>

  <script>
    var FRUITS = ["apple", "apricot", "banana", "blackberry", "blueberry",
      "cherry", "date", "fig", "grape", "guava", "kiwi", "lemon", "lime",
      "mango", "melon", "orange", "papaya", "peach", "pear", "pineapple",
      "plum", "raspberry", "strawberry", "watermelon"];
    var requestCount = 0;

    // A fake search API. Like a real one, its latency VARIES — and
    // that variance is exactly what breaks this page.
    function searchApi(query) {
      requestCount++;
      // shorter queries = more results = slower response (realistic!)
      var delay = 800 - query.length * 150 + Math.random() * 100;
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(FRUITS.filter(function (f) { return f.indexOf(query) >= 0; }));
        }, Math.max(delay, 50));
      });
    }

    // Problem 1: a request PER KEYSTROKE. Type "banana" and you've
    // fired 6 requests, 5 of which are for queries the user already
    // abandoned. (Watch the counter.) Project 28 built debounce for
    // exactly this — it's not wired in.
    document.getElementById("q").oninput = function () {
      var query = this.value;
      if (!query) { document.getElementById("results").innerHTML = ""; return; }

      searchApi(query).then(function (results) {
        // Problem 2 — THE BUG THAT SHIPS TO PRODUCTION: responses
        // come back OUT OF ORDER. "ba" (slow, many results) resolves
        // AFTER "ban" (fast, fewer). Whichever resolves LAST paints
        // the screen — so you typed "ban" and you're looking at the
        // results for "ba". Type 'ba', pause a beat, type 'n': the
        // results flash correct, then go WRONG.
        var html = "";
        for (var i = 0; i < results.length; i++) html += "<li>" + results[i] + "</li>";
        document.getElementById("results").innerHTML = html;
        document.getElementById("status").textContent =
          requestCount + " requests sent";
        // Problem 3: nothing distinguishes "loading" from "no
        // results" — an empty list might mean either.
      });
    };
  </script>
</body>
</html>
